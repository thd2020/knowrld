# Road, part 3: the structure of pages and sites (Learn: Structuring documents).
nodes:
  - id: page-regions
    kind: concept
    title: The regions of a page
    region: semantic-html
    tier: road
    requires: [semantics]
    says: Most pages share the same lands. A header across the top, a navigation bar, the main content, a sidebar, a footer. Name each by its job, and a screen reader can take you straight there.
    cites:
      - structuring-documents#common-components
      - structuring-documents#component-list
      - structuring-documents#functionality
      - structuring-documents#section-tags
    check:
      - prompt: Which part of a website definitely varies from page to page?
        choices: [The header, The main content, The footer]
        answer: 1
        explain: The main content holds the unique content of each page; header, navigation and footer usually stay the same.
      - prompt: Which element marks up a sidebar?
        choices: ["<aside>", "<section>", "<nav>"]
        answer: 0
        explain: The sidebar is aside, often placed inside main.
      - prompt: Why mark up page sections by function?
        choices:
          - So assistive technologies can help with tasks like "find the main navigation"
          - So the page loads faster
          - Because CSS cannot target div elements
        answer: 0
        explain: Screen readers can recognize elements that represent sections and help users find the navigation or the main content.

  - id: sectioning-elements
    kind: concept
    title: main, article, section, aside, header, nav, footer
    region: semantic-html
    tier: road
    requires: [page-regions]
    says: Main once, for what is unique to this page. Article for what stands alone. Section for one part or theme, headed by a heading. Aside for the related, not the central.
    cites:
      - structuring-documents#main-article-section
      - structuring-documents#aside-header-nav-footer
    check:
      - prompt: A single blog post that makes sense on its own belongs in which element?
        choices: ["<section>", "<article>", "<aside>"]
        answer: 1
        explain: article encloses related content that makes sense on its own without the rest of the page.
      - prompt: How many <main> elements should a page use?
        choices: ["One, directly inside body", "One per section", "As many as needed"]
        answer: 0
        explain: Use main only once per page and put it directly inside body.
      - prompt: A header inside an <article> defines what?
        choices:
          - The global header of the page
          - A specific header for that article
          - Nothing; header must be a child of body
        answer: 1
        explain: As a child of body, header is the global header; inside an article or section, it is that section's header.

  - id: non-semantic-wrappers
    kind: concept
    title: div and span, the wrappers without meaning
    region: semantic-html
    tier: road
    requires: [sectioning-elements, attributes]
    says: When no element fits, div wraps a block and span wraps a phrase, each named with a class. They carry no meaning, so they are the last choice, not the first.
    cites:
      - structuring-documents#non-semantic
      - structuring-documents#span
      - structuring-documents#div
      - structuring-documents#div-warning
    check:
      - prompt: When is a <div> the right choice?
        choices:
          - For every block of the page
          - Only when no better semantic block element fits, or you do not want to add meaning
          - Instead of main, to keep things simple
        answer: 1
        explain: div is a non-semantic block element to use only if you can't think of a better semantic element.
      - prompt: What is the difference between <div> and <span>?
        choices:
          - div is block level and span is inline; neither has semantics
          - div has meaning, span does not
          - span is only for CSS and div only for JavaScript
        answer: 0
        explain: span is an inline non-semantic element; div is a block level non-semantic element.

  - id: breaks-and-rules
    kind: concept
    title: Line breaks and thematic breaks
    region: semantic-html
    tier: road
    requires: [void-elements, whitespace-and-comments]
    says: br breaks a line where the lines themselves matter, in an address or a poem. hr marks a change of topic or scene; the line it draws is incidental.
    cites:
      - structuring-documents#br
      - structuring-documents#hr
    check:
      - prompt: Which content needs <br>?
        choices:
          - The lines of a postal address or a poem
          - Space between two paragraphs
          - The end of every sentence
        answer: 0
        explain: br is the only way to force a rigid structure of fixed short lines, such as an address or a poem.
      - prompt: What does <hr> mean?
        choices: ["A thematic change in the text", "A decorative line", "The end of the page"]
        answer: 0
        explain: hr denotes a thematic change, such as a change in topic or scene. Visually it just looks like a line.

  - id: information-architecture
    kind: concept
    title: Planning a site
    region: semantic-html
    tier: road
    requires: [page-regions]
    says: Before the pages, the plan. Note what every page shares, sort the rest into groups, then sketch a sitemap of boxes and the paths between them.
    cites:
      - structuring-documents#information-architecture
      - structuring-documents#sitemap
    check:
      - prompt: What is information architecture?
        choices:
          - Planning how the pages of a website are arranged and link to one another
          - Choosing a server
          - The CSS layout of one page
        answer: 0
        explain: Planning the structure of a multi-page website, including how pages are arranged and linked, is information architecture.
      - prompt: In a small site, how should most pages be reached?
        choices: ["From the main navigation", "Only from search", "Only from the footer"]
        answer: 0
        explain: Most of the pages in a small site should be available from the main navigation, with some exceptions.
