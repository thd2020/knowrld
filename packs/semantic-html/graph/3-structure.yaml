# Road, part 3: the structure of pages and sites (Learn: Structuring documents).
nodes:
  - id: page-regions
    kind: concept
    title: The regions of a page
    region: semantic-html
    tier: road
    requires: [semantics]
    says: Most pages share the same lands. A header across the top, a navigation bar, the main content, a sidebar, a footer. Name each by its job, and a screen reader can take you straight there.
    cites:
      - structuring-documents#common-components
      - structuring-documents#functionality
      - structuring-documents#section-tags
    check:
      - prompt: Which part of a website definitely varies from page to page?
        choices: ["The header with the logo", "The footer with the copyright", "The main content"]
        answer: 2
        explain: The main content holds the unique content of each page; the header, navigation and footer usually stay the same.
      - prompt: Which element marks up a sidebar?
        choices: ["<section>", "<nav>", "<aside>"]
        answer: 2
        explain: The sidebar is aside, often placed inside main.
      - prompt: Why mark up page sections by what they do?
        choices:
          - So the page downloads faster
          - So the layout still works when CSS fails to load
          - So assistive technology can find the navigation or the main content
        answer: 2
        explain: Screen readers can recognize the elements that represent sections and help with tasks like "find the main navigation".
      - prompt: "A news article page has a box with the author's bio and links to related articles. Which region is that?"
        choices:
          - "A sidebar"
          - "The footer, the place for common information on every page"
          - "The header, since it introduces the article's author"
        answer: 0
        explain: "A sidebar holds peripheral info, usually contextual to the main content, such as the author's bio or related links."
      - prompt: "Which element marks up the strip of copyright notices and fine print at the bottom of the page?"
        choices:
          - "<nav>"
          - "<footer>"
          - "<aside>"
        answer: 1
        explain: "The footer is a strip across the bottom that generally holds fine print, copyright notices or contact info."

  - id: sectioning-elements
    kind: concept
    title: main, article, section and aside
    region: semantic-html
    tier: road
    requires: [page-regions]
    says: At most one main without hidden, for what is unique to this page. article for a piece that stands alone. section for one part or theme, opened by a heading. aside for the related, not the central.
    cites:
      - structuring-documents#main-article-section-aside
      - el-section#summary
      - el-main#only-one
    check:
      - prompt: A single blog post that makes sense on its own belongs in which element?
        choices: ["<section>", "<aside>", "<article>"]
        answer: 2
        explain: article encloses a block of related content that makes sense on its own without the rest of the page.
      - prompt: How many main elements without hidden should this simple page use?
        choices: ["One per article", "One", "As many as needed"]
        answer: 1
        explain: Use one main without hidden for the page’s unique content. The language rule permits at most one main lacking hidden.
      - prompt: A mini map is one part of the page's functionality. Which element fits it?
        choices:
          - <section>, opened with a heading
          - <article>, since it could be shared
          - <aside>, since maps are extras
        answer: 0
        explain: section groups a single part of the page that is one piece of functionality, like a mini map, and should begin with a heading.
      - prompt: "A glossary of terms sits beside an article, related to it but not part of its flow. Which element fits?"
        choices:
          - "<main>, a second one just for the glossary"
          - "<section>, opened with its own heading"
          - "<aside>"
        answer: 2
        explain: "aside contains content indirectly related to the main content, such as glossary entries, an author biography or related links."
      - prompt: "Where does MDN recommend placing main for this simple page?"
        choices:
          - "Directly inside <body>, and ideally not nested in other elements"
          - "Inside the header, after the site's logo and title"
          - "Inside each article"
        answer: 0
        explain: "MDN recommends placing the simple page’s main directly inside body, ideally without other wrappers. This is placement advice; at most one main may lack hidden."

  - id: header-nav-footer
    kind: concept
    title: header, nav and footer
    region: semantic-html
    tier: road
    requires: [page-regions]
    says: header gathers the introduction, the site's banner when it sits in body, only its own part's when it sits in an article. nav holds the main navigation. footer closes a page or a section with its end matter.
    cites:
      - structuring-documents#header-nav-footer
      - el-nav#summary
    check:
      - prompt: A header inside an <article> defines what?
        choices:
          - The global header of the whole site
          - A header for that article only
          - Nothing; header must be a child of body
        answer: 1
        explain: As a child of body, header is the global header; inside an article or section it is a specific header for that section.
      - prompt: What belongs in <nav>?
        choices:
          - Every link on the page, including those in text
          - Secondary links such as a footer's legal links
          - The page's main navigation links
        answer: 2
        explain: nav contains the main navigation functionality for the page. Secondary links would not go in it.
      - prompt: "A header is a direct child of <body>. What does it define?"
        choices:
          - "A header for the first section of the content only"
          - "The global header of the page"
          - "The title of the document shown in the tab"
        answer: 1
        explain: "A header that is a child of body defines the global header of the webpage."
      - prompt: "Which of these is a common example of a navigation section?"
        choices:
          - "A recipe's ingredients"
          - "A paragraph that mentions one link in passing"
          - "A table of contents"
        answer: 2
        explain: "Common examples of navigation sections are menus, tables of contents and indexes."
      - prompt: "Do a few secondary links belong in <nav>?"
        choices:
          - "No; nav holds the main navigation"
          - "Only if there are more than three of them together"
          - "Yes, every link on the page belongs in a nav element"
        answer: 0
        explain: "nav contains the main navigation functionality for the page. Secondary links would not go in the navigation."

  - id: non-semantic-wrappers
    kind: concept
    title: div and span, the wrappers without meaning
    region: semantic-html
    tier: road
    requires: [sectioning-elements, attributes]
    says: When no element fits, div wraps a block and span wraps a phrase, a class can provide a styling or script hook. They carry no meaning, so they are the last choice, not the first.
    cites:
      - structuring-documents#non-semantic
      - structuring-documents#span
      - structuring-documents#div
      - structuring-documents#div-warning
    check:
      - prompt: When is a <div> the right choice?
        choices:
          - For every block, since it is the most flexible
          - When no semantic block element fits
          - Instead of main, to keep the page simple
        answer: 1
        explain: div is a non-semantic block element to use only if you can't think of a better semantic block element.
      - prompt: What is the difference between <div> and <span>?
        choices:
          - div has meaning; span has none
          - span is for CSS only and div for scripts only
          - div is block level, span inline; neither has meaning
        answer: 2
        explain: span is an inline non-semantic element; div is a block level non-semantic element.
      - prompt: A shopping cart widget can be opened from any page and is not part of the main content. Which element should wrap it?
        choices:
          - <aside>, since it is related to the page
          - <div>, with a heading
          - <section>, since it is a feature
        answer: 1
        explain: It isn't an aside or part of the main content, so a div is fine, with a heading as a signpost for screen reader users.
      - prompt: "A play's script has an editor's note for the director, with no special meaning, inside a paragraph. Which element wraps it?"
        choices:
          - "<div class=\"editor-note\">, a block inside the paragraph"
          - "<span class=\"editor-note\">"
          - "<aside>"
        answer: 1
        explain: "span is an inline non-semantic element for content you do not want to give any specific meaning; a class can provide a styling or script hook."
      - prompt: "Why give a div or span a class?"
        choices:
          - "So the browser treats it as a section with a heading"
          - "So it gets meaning for screen readers and search engines"
          - "So it can be targeted easily"
        answer: 2
        explain: "Use div and span preferably with a suitable class attribute, a styling or script hook so they can be easily targeted, not a required attribute or an accessible name. They still carry no meaning."

  - id: breaks-and-rules
    kind: concept
    title: Line breaks and thematic breaks
    region: semantic-html
    tier: road
    requires: [void-elements, whitespace-and-comments]
    says: br breaks a line where the lines themselves matter, in an address or a poem. hr marks a change of topic or scene; the line it draws is incidental.
    cites:
      - structuring-documents#br
      - el-br#summary
      - structuring-documents#hr
    check:
      - prompt: Which content needs <br>?
        choices:
          - The space between two paragraphs
          - The end of every sentence
          - The lines of a postal address or poem
        answer: 2
        explain: br supplies a meaningful line break inside a paragraph, such as a line in a postal address or poem.
      - prompt: What does <hr> mean?
        choices:
          - A thematic change, such as a new scene
          - A purely decorative line
          - The end of the page
        answer: 0
        explain: hr denotes a thematic change, such as a change in topic or scene. Visually it just looks like a line.
      - prompt: "A story changes scene from Ron's battle to Harry at home. What marks the change between the paragraphs?"
        choices:
          - "<hr>"
          - "A new h1"
          - "<br>, two of them, to leave a gap between the scenes"
        answer: 0
        explain: "hr denotes a thematic change in the text, such as a change of scene."
      - prompt: "You want more space between two paragraphs. Should you add <br> elements?"
        choices:
          - "Yes, each br adds one line of space between paragraphs"
          - "No; br is for fixed short lines such as a poem's"
          - "Only inside the second paragraph, at its start"
        answer: 1
        explain: "br is the way to force a series of fixed short lines, as in a postal address or a poem; it is not for spacing."
      - prompt: "What does an <hr> look like by default?"
        choices:
          - "A blank gap the height of one line"
          - "A bold heading that names the new scene"
          - "A horizontal line"
        answer: 2
        explain: "Visually an hr just looks like a horizontal line; its meaning is a thematic change."

  - id: information-architecture
    kind: concept
    title: Planning a site
    region: semantic-html
    tier: road
    requires: [page-regions, navigation-menus]
    says: Before the pages, the plan. Note what every page shares, sort the rest into groups, then sketch a sitemap of boxes and the paths between them.
    cites:
      - structuring-documents#information-architecture
      - structuring-documents#common-to-every-page
      - structuring-documents#sort-into-groups
      - structuring-documents#sitemap
    check:
      - prompt: What is information architecture?
        choices:
          - Choosing a server for the site
          - The CSS layout of a single page
          - Planning how a site's pages are arranged and linked
        answer: 2
        explain: Planning the structure of a multi-page website, including how pages are arranged and link to one another, is information architecture.
      - prompt: In a small site, how should most pages be reached?
        choices: ["Only through the site's search box", "From the main navigation", "Only from links in the footer"]
        answer: 1
        explain: Most of the pages in a small site should be available from the main navigation, with some exceptions.
      - prompt: You are planning a travel site. Which content belongs on every page?
        choices:
          - The navigation menu and the footer
          - This week's special offers and holiday deals
          - The latest reviews of the most popular hotel
        answer: 0
        explain: Elements such as the navigation menu and the footer content are common to most, if not all, pages.
      - prompt: "You have listed flights, accommodation, transport and things to do. What is the next step?"
        choices:
          - "Sort the items into groups"
          - "Choose the colours"
          - "Write one page for every item, each linked from the homepage"
        answer: 0
        explain: "Next, sort the content items into groups, to see what might live together on different pages, much like card sorting."
      - prompt: "On a rough sitemap, where does the homepage usually sit?"
        choices:
          - "Off to one side, apart from the other pages"
          - "At the top or at the center"
          - "At the bottom, below every other page it leads to"
        answer: 1
        explain: "The homepage will probably be at the top or the center, linking to most if not all of the others."
