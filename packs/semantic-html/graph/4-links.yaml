# Road, part 4: links (Learn: Creating links), with the <a> reference as country.
nodes:
  - id: hyperlinks
    kind: concept
    title: Anatomy of a link
    region: semantic-html
    tier: road
    requires: [attributes]
    says: Every resource on the web has an address, its URL. Wrap text, a heading or an image in an a element, point href at the address, and the web is a web. Put essential information in accessible page text; support for a link's title is inconsistent on touch, keyboards and assistive technology.
    cites:
      - creating-links#url
      - creating-links#anchor
      - creating-links#block-links
      - attr-title#accessibility-support
    check:
      - prompt: Which attribute of <a> holds the address the link points to?
        choices: ["src", "href", "title"]
        answer: 1
        explain: A link is an a element whose href attribute contains the web address.
      - prompt: Can a whole heading be a link?
        choices:
          - Yes; wrap the heading in an a element
          - No; only inline text can be linked
          - Only if the heading has an id
        answer: 0
        explain: Almost any content can be made into a link, even block-level elements such as a heading.
      - prompt: Why shouldn't vital information live only in a link's title?
        choices:
          - Access through touch, keyboards and assistive technology is inconsistent
          - Browsers never display it at all
          - Search engines penalize it
        answer: 0
        explain: Browsers and assistive technology expose title inconsistently. Do not rely on it for essential information; put that information in accessible page text.
      - prompt: "You want the words \"the Mozilla homepage\" to link to https://www.mozilla.org/en-US/. What do you write?"
        choices:
          - "<a href=\"https://www.mozilla.org/en-US/\">the Mozilla homepage</a>"
          - "<a>the Mozilla homepage</a> https://www.mozilla.org/en-US/"
          - "<link href=\"https://www.mozilla.org/en-US/\">the Mozilla homepage</link>"
        answer: 0
        explain: "A basic link wraps the content in an a element whose href holds the web address."
      - prompt: "What does every resource a hyperlink can point to have?"
        choices:
          - "A title that the browser shows on hover"
          - "A URL"
          - "An id"
        answer: 1
        explain: "Each resource on the web has an address, known as a URL, which hyperlinks point to."

  - id: relative-paths
    kind: concept
    title: Relative paths
    region: semantic-html
    tier: road
    requires: [hyperlinks]
    says: In the illustrated site with no base element, relative paths resolve from the document address. A file name reaches a neighbour, a folder name goes down and two dots go up. A leading slash uses this host’s root; a different base URL can change the host.
    cites:
      - creating-links#same-directory
      - creating-links#subdirectory
      - creating-links#up-a-directory
      - creating-links#root-relative
      - el-base#document-base
    check:
      - prompt: In the illustrated site with no base element, from projects/index.html, which path reaches pdfs/project-brief.pdf?
        choices: ["projects/pdfs/project-brief.pdf", "pdfs/project-brief.pdf", "../pdfs/project-brief.pdf"]
        answer: 2
        explain: Two dots go up a directory level; then the path goes down into pdfs.
      - prompt: In the illustrated site with no base element, what does a slash at the start of a path mean?
        choices:
          - Start from the current folder
          - Start at the root directory of the site
          - Go to another website with that name
        answer: 1
        explain: With no base element and the same host, a leading slash resolves from that host’s root. Moving the linking file within that host does not change this destination.
      - prompt: In the illustrated site with no base element, in the top-level index.html, which path reaches contacts.html in the same folder?
        choices: ["contacts.html", "../contacts.html", "index.html/contacts.html"]
        answer: 0
        explain: A file in the same directory is reached by its file name alone, or with ./ in front.
      - prompt: "In the illustrated site with no base element, in the top-level index.html, which path reaches projects/index.html?"
        choices:
          - "index.html#projects, a fragment of this page"
          - "../projects/index.html"
          - "projects/index.html"
        answer: 2
        explain: "To go down into a directory, write the directory's name, a forward slash, then the file's name."
      - prompt: "With no base element in the illustrated site, ../pdfs/project-brief.pdf sits in projects/index.html. You move the page deeper without changing the link. What can happen?"
        choices:
          - "It can break because it resolves from the moved document address"
          - "The browser finds it anyway"
          - "The link still works, because relative paths follow the file"
        answer: 0
        explain: "With no base element, moving the page to a different directory changes this relative URL’s resolution and can break the link. Preserved routes or redirects can keep an old address working."

  - id: absolute-urls
    kind: concept
    title: Absolute URLs and how links resolve
    region: semantic-html
    tier: road
    requires: [relative-paths]
    says: A full absolute URL specifies its own destination. Relative links resolve against the document's base URL, which defaults to its address when no base element is supplied. A scheme-relative link such as //example.com can reach another host without spelling out a scheme.
    cites:
      - creating-links#absolute-relative
      - creating-links#internal-external
      - creating-links#trailing-slash
      - el-base#document-base
      - el-a#relative-url-example
    check:
      - prompt: Which of these is absolute with respect to the whole web?
        choices:
          - /pdfs/project-brief.pdf, since it starts at the root
          - https://example.com/pdfs/project-brief.pdf
          - ../pdfs/project-brief.pdf, since it climbs up a level
        answer: 1
        explain: /pdfs/project-brief.pdf is absolute only within your site; it is relative to the domain name. A URL with the full domain is absolute for the whole web.
      - prompt: With no base element, why can't a link to another site use /pdfs/brief.pdf?
        choices:
          - The browser needs the other site's domain to find it
          - The path needs ../ in front to leave the site
          - It works, if the other site uses the same folders
        answer: 0
        explain: Without a base element, a root-relative path uses the current document's host. A cross-host link can instead include the destination host in an absolute or scheme-relative URL.
      - prompt: With no base element, the link projects/index.html sits in https://www.example.com/pdfs/index.html. Where does it go?
        choices:
          - https://www.example.com/projects/index.html
          - https://projects.example.com/index.html
          - https://www.example.com/pdfs/projects/index.html
        answer: 2
        explain: With no base element, this relative link resolves against the document's address, yielding https://www.example.com/pdfs/projects/index.html. The URL alone does not tell us whether that resource exists.
      - prompt: "An internal link can be written as https://www.example.com/projects/ or as projects. Which is recommended, and why?"
        choices:
          - "The full URL, so that the link can never point anywhere else"
          - "projects, which still works if the site moves domain"
          - "Either; neither one is easier to keep working than the other"
        answer: 1
        explain: "The path without the full domain is recommended for portability; full URL links all need changing if the site moves to another domain."
      - prompt: "With no base element, which href reaches another host?"
        choices:
          - "A relative path with two dots, like ../project-brief.pdf"
          - "A path starting with a slash, like /pdfs/project-brief.pdf"
          - "https://example.org/pdfs/project-brief.pdf"
        answer: 2
        explain: "This absolute URL includes the destination host. A scheme-relative URL such as //example.org/pdfs/project-brief.pdf can also reach that host, using the base URL's scheme."

  - id: document-fragments
    kind: concept
    title: Linking to part of a page
    region: semantic-html
    tier: road
    requires: [relative-paths]
    says: Give an element an id to make it a fragment destination. With no base element, a hash alone can link within this document; with a base, it resolves against that URL. Duplicate IDs violate document-wide uniqueness.
    cites:
      - creating-links#fragment
      - creating-links#fragment-hash
      - creating-links#fragment-same-page
      - el-base#fragment-resolution
      - attr-id#unique
    check:
      - prompt: With no base element, what does href="#mailing_address" link to?
        choices:
          - A file named mailing_address
          - The element with id="mailing_address" in this page
          - An email address stored in the site
        answer: 1
        explain: With no base element, this fragment-only reference links within the current document. A base URL can make it resolve against a different document instead.
      - prompt: What turns an element into a fragment you can link to?
        choices: ["A class attribute", "An id attribute", "A heading level"]
        answer: 1
        explain: Elements with an id attribute automatically create a document fragment that can be linked to.
      - prompt: Two elements on one page both have id="top". What is wrong?
        choices:
          - "Nothing; a link to #top goes to both at once"
          - An id may not be a common English word such as top
          - An id must be unique in the whole document
        answer: 2
        explain: The id attribute defines an identifier that must be unique within the entire document.
      - prompt: "From another page, how do you link to the element with id=\"mailing_address\" in contacts.html?"
        choices:
          - "contacts.html#mailing_address"
          - "contacts.html?id=mailing_address, as a query term"
          - "#contacts.html, with the hash before the file name"
        answer: 0
        explain: "Include the id at the end of the path, preceded by a hash symbol."
      - prompt: "What is the most typical element to give an id so it can be linked to?"
        choices:
          - "A paragraph somewhere in the middle of a section"
          - "A heading"
          - "The body element"
        answer: 1
        explain: "The most typical use of a document fragment is linking to a specific heading."

  - id: link-text
    kind: concept
    title: Clear link text
    region: semantic-html
    tier: road
    requires: [hyperlinks]
    says: Link text is a signpost read out of context. Say where it goes. Not "click here", not the URL, not the word "link". And keep links looking like links; colour alone is not enough.
    cites:
      - creating-links#accessible-links
      - creating-links#link-tips
      - accessible-html#labels-out-of-context
      - accessible-html#link-styling
    check:
      - prompt: Which link text is best?
        choices: ["Click here", "https://www.firefox.com/", "Download Firefox"]
        answer: 2
        explain: Descriptive text serves screen reader users jumping between links, search engines and skimming readers. Read aloud, a URL sounds ugly.
      - prompt: Should link text include the word "link"?
        choices:
          - Yes, so people know to click
          - No; screen readers already say it is a link
          - Only for links that open a new tab
        answer: 1
        explain: Saying "link" is noise; screen readers announce links, and visual users see them styled differently.
      - prompt: Five links on a page all read "Read more". Why is that a problem?
        choices:
          - A list of links out of context is useless
          - Browsers merge them into one link
          - Search engines index only the first one
        answer: 0
        explain: Screen reader users often list the links on a page; a list of identical labels tells them nothing.
      - prompt: Your design makes links the same weight as body text and tells them apart by colour only. Is that enough?
        choices:
          - Yes, if the colour is bright enough
          - No; colour should not be the only way links stand out
          - Yes, as long as the colour is not red or green
        answer: 1
        explain: Colour should not be used as the sole method of distinguishing links from the text around them.
      - prompt: "Why put keywords in link text?"
        choices:
          - "So that screen readers spell out each keyword letter by letter"
          - "So that the link looks different from the text around it"
          - "Search engines index the target by it"
        answer: 2
        explain: "Search engines use link text to index target files, so keywords that describe what is linked help."

  - id: link-signposts
    kind: concept
    title: Downloads, new tabs and fair warning
    region: semantic-html
    tier: road
    requires: [link-text]
    says: If a link downloads, streams or opens a new tab, say so in its text. Opening new tabs is a choice with costs, so make it on purpose. Nobody likes a door that leads somewhere unexpected.
    cites:
      - creating-links#signposts
      - el-a#download-filename
      - el-a#download-limits
      - el-a#download-headers
      - creating-links#new-tab
      - el-a#target
      - accessible-html#new-tab-indicator
    check:
      - prompt: For a same-origin link, which attribute can suggest the downloaded file’s save name?
        choices: ["target", "rel", "download"]
        answer: 2
        explain: For a same-origin resource, download can suggest a filename. It also applies to blob and data URLs; browser settings and response headers affect the result.
      - prompt: A link opens in a new tab. What should it also have?
        choices:
          - A cue in its text or an icon saying so
          - Nothing; new tabs need no warning
          - A title attribute only
        answer: 0
        explain: Links that open in a new tab should indicate it, for example with text or an icon next to the link text.
      - prompt: Which is a reason not to open a link in a new tab?
        choices:
          - It breaks the back button that many users rely on
          - Screen readers cannot follow links that open new tabs
          - Search engines ignore links with a target
        answer: 0
        explain: Opening links in a new tab can disorient users who are used to the back button, and screen reader users may lose their place.
      - prompt: "A link downloads a 10 MB PDF report. Which link text is best?"
        choices:
          - "Download the sales report (PDF, 10MB)"
          - "https://www.example.com/reports/large-report.pdf"
          - "Click here"
        answer: 0
        explain: "If a link downloads a resource, say so in the text. People on low bandwidth can avoid multi-megabyte files."
      - prompt: "Which attribute and value request a new browsing context, usually a tab or window?"
        choices:
          - "download=\"_blank\""
          - "target=\"_blank\""
          - "rel=\"new-tab\""
        answer: 1
        explain: "target=\"_blank\" requests a new browsing context, usually a tab but configurable as a window."

  - id: email-links
    kind: concept
    title: Email links
    region: semantic-html
    tier: road
    requires: [hyperlinks]
    says: A mailto link opens a new message instead of a page. Put the address after mailto, or leave it out and let the reader choose. Add a subject or a body as query terms, spaces percent-escaped.
    cites:
      - creating-links#mailto
      - creating-links#mailto-empty
      - creating-links#mailto-details
      - creating-links#mailto-encoding
    check:
      - prompt: Which href opens a new email to nowhere@mozilla.org?
        choices: ["email://nowhere@mozilla.org", "mailto:nowhere@mozilla.org", "nowhere@mozilla.org"]
        answer: 1
        explain: Email links use the a element with the mailto URL scheme.
      - prompt: What happens with href="mailto:" and no address?
        choices:
          - The link is broken and does nothing
          - A new email opens with no recipient
          - It emails the owner of the website
        answer: 1
        explain: The address is optional; the email client opens a new message with no destination address, useful for share links.
      - prompt: How are a subject and a body added to a mailto link?
        choices:
          - As query terms after ?, joined by &
          - As extra attributes on the a element
          - Inside the link text, after a colon
        answer: 0
        explain: Each field and its value is a query term. A ? separates them from the address and & separates the fields.
      - prompt: "You want a \"Share\" link that lets readers email anyone they choose. What is its href?"
        choices:
          - "mailto:everyone, as a placeholder for any address"
          - "share:email, the scheme for sharing links"
          - "mailto:, with no address"
        answer: 2
        explain: "The address is optional. With href=\"mailto:\", a new email opens with no destination address."
      - prompt: "Which href sets the subject \"Hello there\" correctly?"
        choices:
          - "mailto:nowhere@mozilla.org?subject=Hello%20there"
          - "mailto:nowhere@mozilla.org subject=\"Hello there\""
          - "mailto:nowhere@mozilla.org&subject=Hello there"
        answer: 0
        explain: "A question mark separates the address from the fields, and spaces in a value must be percent-escaped."

  - id: navigation-menus
    kind: concept
    title: Navigation menus
    region: semantic-html
    tier: road
    requires: [lists, relative-paths]
    says: A menu is a list of links, the same on every page, so readers feel they stay in one place while the content changes. On each page, drop the link to that page itself; where the design keeps it, mark it with aria-current="page".
    cites:
      - creating-links#nav-menu
      - creating-links#nav-list
      - el-nav#summary
      - attr-aria-current#styled-current
    check:
      - prompt: Which markup is right for a navigation menu?
        choices:
          - A paragraph of links split by bars
          - A table with one link in each cell
          - An unordered list of links
        answer: 2
        explain: A navigation menu is usually just a list of links, so an unordered list is semantically OK.
      - prompt: On the About page, what happens to the menu's About link?
        choices:
          - It stays as a normal link
          - It moves to the end of the menu
          - It is removed, or marked as the current page
        answer: 2
        explain: MDN removes the link to the page itself, which also shows which page you are on. If a styled link is kept instead, aria-current="page" tells assistive technology.
      - prompt: Why use the same menu on every page?
        choices:
          - It feels like staying in one place while content changes
          - Screen readers skip a menu they have heard before
          - Search engines rank sites higher for it
        answer: 0
        explain: The same structure and menu on every page gives the impression of staying in the same place while different content comes up.
      - prompt: "The menu link to the current page is kept but styled differently. What tells assistive technology?"
        choices:
          - "target=\"_self\" on that link"
          - "aria-current=\"page\" on that link"
          - "A class=\"current\" on that link, styled in bold"
        answer: 1
        explain: "When a link in a set is styled to show the user is on that page, set aria-current=\"page\" on it."
      - prompt: "In a multi-step checkout, the current step's icon looks different. What goes on its container?"
        choices:
          - "An h1"
          - "aria-current=\"page\", as for the links in a menu"
          - "aria-current=\"step\""
        answer: 2
        explain: "In a multi-step process, the current step's container should have aria-current=\"step\"."

  - id: anchor-attributes
    kind: concept
    title: target, download and tel
    region: semantic-html
    tier: country
    requires: [link-signposts, email-links]
    says: target names the browsing context. With no base target, _self is the default; _blank requests a new context, usually a tab or window, and also cuts opener access as noopener does. download works for same-origin URLs and for blob and data URLs. And tel dials a number where the device can.
    cites:
      - el-a#download-limits
      - el-a#download-headers
      - el-a#target
      - el-base#default-target
      - el-a#target-noopener
      - el-a#tel
    check:
      - prompt: An HTTP or HTTPS link to a PDF on another origin has a download attribute. What happens to that attribute?
        choices:
          - The cross-origin HTTP(S) link’s download attribute is ignored
          - The file is always saved under the name you gave it
          - The browser blocks the link
        answer: 0
        explain: download applies to same-origin URLs and the blob and data schemes. It is ignored for this cross-origin HTTP(S) link, but the server response can still cause a download.
      - prompt: With no target on the link and no base target, which browsing context is the default?
        choices: ["_blank", "_self", "_top"]
        answer: 1
        explain: Without a link target or base target, _self means the current browsing context.
      - prompt: Which href dials a phone number?
        choices: ["phone:+1-800-555-0123", "tel:+1(800)555-0123", "call://18005550123"]
        answer: 1
        explain: Telephone links use the tel URL scheme. What happens depends on the device.
      - prompt: "A link inside an iframe should load in the topmost browsing context. Which target value fits?"
        choices:
          - "_top"
          - "_self, the current browsing context"
          - "_blank, which usually opens a new tab"
        answer: 0
        explain: "_top loads the URL in the topmost browsing context, the highest one that is an ancestor of the current one."
      - prompt: "What does target=\"_blank\" also do, without any rel attribute?"
        choices:
          - "It makes the link open in the same tab instead"
          - "It gives the same behaviour as rel=\"noopener\""
          - "It turns the link into a download of the target file"
        answer: 1
        explain: "target=\"_blank\" implicitly gives the same rel behaviour as rel=\"noopener\", which does not set window.opener."
