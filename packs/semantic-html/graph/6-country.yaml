# Country: concepts from the HTML and ARIA reference and the Glossary, one link from the road
# (the landmark role pages are promoted by judgement; see the fog.yaml header). They deepen a road concept
# with the rules the Learn pages leave out.
nodes:
  - id: heading-navigation
    kind: concept
    title: Headings as a map
    region: semantic-html
    tier: country
    requires: [screen-reader-structure]
    says: A screen reader user jumps heading to heading to learn the land. Skip a rank and they stop to wonder what went missing. Resize with CSS, never by changing the rank. MDN recommends one main h1 per page and appropriate heading levels for subsections; this book follows that recommendation.
    cites:
      - el-headings#usage
      - el-headings#single-h1
      - el-headings#skip-levels
      - el-headings#headings-list
    check:
      - prompt: A subheading should look smaller. What do you change?
        choices:
          - Switch it from an h2 to an h5
          - Keep the level and set font-size in CSS
          - Wrap it in a small element
        answer: 1
        explain: Do not use heading elements to resize text; use the CSS font-size property.
      - prompt: Why is skipping from <h2> to <h4> a problem?
        choices:
          - The browser quietly deletes the h4 and its whole section
          - People jumping heading to heading wonder what is missing
          - The page stops rendering at the h4 and shows an error
        answer: 1
        explain: Skipping levels confuses people who move from heading to heading and are left wondering where the missing heading is.
      - prompt: What heading practice does this book recommend for a page's sections?
        choices:
          - Prefer one main h1 and use appropriate levels for subsections
          - Require an h1 at the start of every section
          - Choose heading ranks only for their default font sizes
        answer: 0
        explain: This book follows MDN’s recommendation to use one main h1 and appropriate subsection levels.
      - prompt: "What can a user agent build from a page's headings automatically?"
        choices:
          - "A table of contents"
          - "A stylesheet that sizes each level of heading"
          - "The tab's title"
        answer: 0
        explain: "Heading information can be used by user agents to construct a table of contents for a document automatically."
      - prompt: "Is a page with two h1 elements, side by side and not nested, allowed by the standard?"
        choices:
          - "No; the page fails to render the second one"
          - "Allowed, though one h1 is best practice"
          - "Yes, and two is the recommended number for a page"
        answer: 1
        explain: "MDN allows this case but recommends a single h1 describing the page content."

  - id: header-footer-context
    kind: concept
    title: Where a header or footer stands
    region: semantic-html
    tier: country
    requires: [header-nav-footer]
    says: At the top level a header is the banner of the whole site. Inside an article or section it is only that part's introduction. A footer belongs to its nearest section, or to the page when that is the body.
    cites:
      - el-header#banner-or-section
      - el-footer#summary
      - el-footer#usage
    check:
      - prompt: A <header> sits inside an <article>. Is it the site's banner landmark?
        choices:
          - Yes; every header element is a banner
          - Only if it contains an h1
          - No; it introduces only its section
        answer: 2
        explain: Nested in sectioning content or main, header loses its landmark status and introduces its surrounding section.
      - prompt: A footer sits inside an article. What does it belong to?
        choices:
          - The whole page, like every footer
          - That article, its nearest sectioning ancestor
          - Nothing; footers must be children of body
        answer: 1
        explain: A footer represents a footer for its nearest ancestor sectioning content. Only when that is the body does it apply to the whole page.
      - prompt: "A header sits directly in body, outside any article or section. Which landmark role does it have?"
        choices:
          - "region, as any section of a page does"
          - "contentinfo"
          - "banner"
        answer: 2
        explain: "A header not nested in sectioning content or main has the same meaning as the site-wide banner landmark."
      - prompt: "The nearest sectioning ancestor of a footer is the body. What does the footer apply to?"
        choices:
          - "The whole page"
          - "Nothing, until it is given an accessible name"
          - "Only the last section that comes before it"
        answer: 0
        explain: "When the nearest ancestor sectioning content or sectioning root is the body, the footer applies to the whole page."
      - prompt: "Where does information about an article's author go inside its footer?"
        choices:
          - "In a cite element"
          - "In an address element"
          - "In a small element, like other fine print"
        answer: 1
        explain: "Enclose information about the author in an address element, which can be included in the footer."

  - id: main-element
    kind: concept
    title: The one main
    region: semantic-html
    tier: country
    requires: [sectioning-elements]
    says: One visible main per document, holding only what is unique to it, never the logo, the menu or the copyright. It is a landmark assistive technology can jump to.
    cites:
      - el-main#only-one
      - el-main#unique-content
      - el-main#landmark
    check:
      - prompt: Should the site logo and navigation go inside <main>?
        choices:
          - Yes; main should wrap the whole page
          - No; content repeated across pages stays out of main
          - Only the navigation
        answer: 1
        explain: Content repeated across documents, such as navigation links, logos and copyright, should not be in main.
      - prompt: How many <main> elements without the hidden attribute may a document have?
        choices: ["One per article", "Any number", "One"]
        answer: 2
        explain: A document mustn't have more than one main element that doesn't have the hidden attribute.
      - prompt: What does <main> give assistive technology?
        choices:
          - A landmark users can jump to
          - A heading announced as the page's title
          - A list of the page's links
        answer: 0
        explain: main behaves like a main landmark, which assistive technology can use to quickly identify and navigate to the main content.
      - prompt: "A page's whole purpose is a search form. Can that form go inside <main>?"
        choices:
          - "Only if the form is wrapped in a nav element first"
          - "No; search forms always stay out of main"
          - "Yes, since it is the page's main function"
        answer: 2
        explain: "Repeated content such as search forms stays out of main, unless the search form is the main function of the page."
      - prompt: "Should you write <div role=\"main\"> or <main>?"
        choices:
          - "<main>, unless legacy browsers matter"
          - "<div role=\"main\">, which more screen readers understand"
          - "Both, the div inside the main, to be safe"
        answer: 0
        explain: "Prefer the main element over declaring role=\"main\", unless there are legacy browser support concerns."

  - id: nav-element
    kind: concept
    title: Major navigation only
    region: semantic-html
    tier: country
    requires: [navigation-menus, header-nav-footer]
    says: nav is for the major blocks of navigation, not every cluster of links. With two navs on a page, give each a label so the reader knows which is which.
    cites:
      - el-nav#usage
      - el-headings#labeled-sections
      - el-headings#labeled-sections-example
    check:
      - prompt: Must every group of links be inside a <nav>?
        choices:
          - No; nav is for major blocks of navigation
          - Yes, every group of links needs one
          - Only groups of three or more links
        answer: 0
        explain: A footer's list of links, for example, often doesn't need a nav.
      - prompt: A page has a primary nav and a footer nav. How can a screen reader user tell them apart?
        choices:
          - Give each a label with aria-labelledby
          - Give each one a different colour and font so they look distinct
          - They can't; all navs sound the same
        answer: 0
        explain: Labelled, they are announced as "Primary navigation" and "Footer navigation" instead of two unnamed nav sections.
      - prompt: "A footer holds a short list of links to terms and privacy. Must they be in a <nav>?"
        choices:
          - "Yes; every list of links must be in a nav element"
          - "No; footer links often need no nav"
          - "Only external links"
        answer: 1
        explain: "nav is for major blocks of navigation links; the footer often has a list of links that don't need to be in a nav."
      - prompt: "Which markup labels a nav with its own heading?"
        choices:
          - "<nav id=\"primary-navigation\" role=\"navigation\"><h2>Primary navigation</h2>"
          - "<nav title=\"Primary navigation\" aria-label=\"navigation\"><h2 class=\"title\">Primary navigation</h2>"
          - "<nav aria-labelledby=\"primary-navigation\"><h2 id=\"primary-navigation\">Primary navigation</h2>"
        answer: 2
        explain: "Sectioning content can be labelled with aria-labelledby pointing at the id of a heading that describes its purpose."
      - prompt: "What does a screen reader announce for two navs labelled \"Primary navigation\" and \"Footer navigation\"?"
        choices:
          - "Two nav sections, each by its name"
          - "Only the links, without saying they are in a nav"
          - "One nav, since the second one is ignored"
        answer: 0
        explain: "The screen reader announces two nav sections, one called \"Primary navigation\" and one \"Footer navigation\"."

  - id: landmarks
    kind: concept
    title: Landmarks
    region: semantic-html
    tier: country
    requires: [header-footer-context, main-element, nav-element, choosing-sections]
    says: Landmarks are places a screen reader can jump to. A body-level header is the banner, nav is navigation, main is main, and a body-level footer is contentinfo. Aside is complementary unless it is unnamed and nested in sectioning content, where its role is generic. A section is a region only once it has a name.
    cites:
      - role-landmark#description
      - role-landmark#html-elements
      - role-region#section-named
      - role-contentinfo#one-per-page
      - el-aside#usage
    check:
      - prompt: Which element gives the complementary landmark?
        choices: ["<aside>", "<section>", "<footer>"]
        answer: 0
        explain: Each landmark role has its HTML element; complementary is aside.
      - prompt: When does a <section> become a region landmark?
        choices:
          - Always, like every sectioning element
          - When it has an accessible name
          - Only when role="region" is written on it
        answer: 1
        explain: A section automatically has the region role if it is given an accessible name, for example with aria-labelledby.
      - prompt: How many top-level contentinfo landmarks should a page have?
        choices: ["One per section", "One", "None; footers are not landmarks"]
        answer: 1
        explain: Each page should only include one contentinfo landmark, made with a footer or role="contentinfo".
      - prompt: What is the best way to make a navigation landmark?
        choices: ['<div role="navigation">', '<div class="nav">', "<nav>"]
        answer: 2
        explain: Prefer the semantic HTML element over an ARIA role; a class adds no semantics at all.
      - prompt: "Why are landmarks useful to assistive technology?"
        choices:
          - "They change how the sections look on the screen"
          - "They help users find and jump to content quickly"
          - "They make the page load faster on slow connections"
        answer: 1
        explain: "Landmarks allow assistive technologies to navigate and to find content quickly."

  - id: choosing-sections
    kind: concept
    title: Choosing a sectioning element
    region: semantic-html
    tier: country
    requires: [non-semantic-wrappers]
    says: section is the generic one, for when nothing more specific fits, and it wants a heading. Standalone? article. Tangential? aside. The main content? main. Only styling? A div.
    cites:
      - el-section#alternatives
      - el-article#usage
      - el-aside#usage
    check:
      - prompt: You need a wrapper purely to apply styles. Which element?
        choices: ["<section>", "<article>", "<div>"]
        answer: 2
        explain: If you are only using the element as a styling wrapper, use a div instead of section.
      - prompt: How should the comments on a blog post be marked up?
        choices:
          - As aside elements, since comments sit beside the main post
          - As article elements nested in the post's article
          - As one section of plain paragraphs
        answer: 1
        explain: A nested article represents an article related to the outer one, such as a comment on a blog post.
      - prompt: Should parenthesized text go in <aside>?
        choices:
          - Yes; asides are for side remarks
          - No; it is part of the main flow
          - Only when it is longer than a line
        answer: 1
        explain: Do not use aside for parenthesized text; that text is part of the main flow.
      - prompt: "A blog comment makes sense on its own and could be syndicated. Which element suits it?"
        choices:
          - "<aside>, as the comment is not the post itself"
          - "<section>"
          - "<article>"
        answer: 2
        explain: "A standalone, atomic unit of content that makes sense syndicated, such as a blog post or comment, is an article."
      - prompt: "How is an article usually identified?"
        choices:
          - "By a heading as one of its children"
          - "By an id attribute on the article element"
          - "By a title attribute that names the article"
        answer: 0
        explain: "Each article should be identified, typically by including a heading element as a child of the article."

  - id: em-and-i
    kind: concept
    title: em or i?
    region: semantic-html
    tier: country
    requires: [presentational-elements]
    says: Both lean the letters, but em stresses a word and changes what you mean, while i sets text apart, a ship's name, a species, a foreign phrase with its lang.
    cites:
      - el-em#i-vs-em
      - el-i#uses
      - el-i#not-presentational
    check:
      - prompt: '"They searched the docks for the Empress of the Galaxy." Which element fits the ship''s name?'
        choices: ["<em>", "<cite>", "<i>"]
        answer: 2
        explain: Ship or vessel names in Western writing are a use case for i; there is no added stress.
      - prompt: What should an idiomatic term from another language carry, besides <i>?
        choices: ["A class of foreign", "A title with a translation", "A lang attribute"]
        answer: 2
        explain: Idiomatic terms from another language should include the lang attribute to identify the language.
      - prompt: Is <i> just a way to get italics?
        choices:
          - Yes; it is purely presentational
          - No; it marks text set off from the normal prose
          - It was removed from HTML5
        answer: 1
        explain: i was once presentational; it now marks text set off from the normal prose, such as a technical term or a thought.
      - prompt: "In \"I love carrots\", the word love is stressed to change the meaning. Which element marks it?"
        choices:
          - "<i>, since stressed words are set in italics"
          - "<em>"
          - "<b>"
        answer: 1
        explain: "em represents stress emphasis that changes the meaning of a sentence; i sets text off from the prose without stress."
      - prompt: "You want a pull-quote in italics for looks alone. What should you use?"
        choices:
          - "<i>, the element for italic text"
          - "<em>, since it is italic by default"
          - "CSS font-style"
        answer: 2
        explain: "Neither em nor i is for purely decorative purposes; to display text in italic type, use the CSS font-style property."

  - id: strong-and-b
    kind: concept
    title: strong or b?
    region: semantic-html
    tier: country
    requires: [presentational-elements]
    says: strong says this matters more. b only draws the eye, to a keyword or a product name, with no extra weight of meaning. The meaning decides, never the bold.
    cites:
      - el-strong#b-vs-strong
      - el-strong#meaning-decides
      - el-strong#em-vs-strong
      - el-b#uses
    check:
      - prompt: Product names in a review, with no special importance. Which element?
        choices: ["<strong>", "<h3>", "<b>"]
        answer: 2
        explain: b is for spans like keywords or product names whose presentation is typically bold, without special importance.
      - prompt: Should a section title be marked up with <b>?
        choices:
          - Yes, if it should look bold
          - No; use a heading element
          - Only when the title is a single line
        answer: 1
        explain: Do not mark titles and headings with b; use the h1 to h6 elements.
      - prompt: '"Warning! This is very dangerous." Which element fits "Warning!"?'
        choices: ["<b>", "<em>", "<strong>"]
        answer: 2
        explain: strong gives portions of a sentence added importance, as in MDN's "Warning! This is very dangerous."
      - prompt: "Two parts of a sentence are both important, one more than the other. How can strong express that?"
        choices:
          - "Nest strong in strong"
          - "It cannot"
          - "By giving the second strong a weight attribute"
        answer: 0
        explain: "Both strong and em can be nested to increase the relative degree of importance or stress emphasis."
      - prompt: "Which element marks text of particular relevance, rather than importance?"
        choices:
          - "<b>, which draws the eye to text"
          - "<mark>"
          - "<strong>, for text that matters more"
        answer: 1
        explain: "strong represents importance, em emphasis and mark relevance; b conveys no such special meaning."

  - id: u-annotation
    kind: concept
    title: The underline that annotates
    region: semantic-html
    tier: country
    requires: [presentational-elements]
    says: u came back with a new meaning, a non-textual annotation, such as a spelling mistake marked. It is never for decoration, and never for a book title.
    cites:
      - el-u#restored
      - el-u#use-cases
    check:
      - prompt: Which is a valid use of <u>?
        choices:
          - Underlining a book title
          - Marking a spelling error
          - Decorating a heading
        answer: 1
        explain: Valid uses include annotating spelling errors; do not use u for presentation or book titles.
      - prompt: What does <u> mean since HTML5?
        choices:
          - Text with a non-textual annotation applied
          - Underlined text, purely for decoration
          - A hyperlink with no href
        answer: 0
        explain: u was restored in HTML5 with a semantic meaning, to mark text as having some form of non-textual annotation.
      - prompt: "A book title appears in a paragraph. Should it be underlined with <u>?"
        choices:
          - "Only foreign books"
          - "Yes; book titles are traditionally underlined"
          - "No; u is not for titles of books"
        answer: 2
        explain: "You should not use u to underline text for presentation or to denote titles of books."
      - prompt: "In Chinese text, which use of <u> is valid?"
        choices:
          - "A proper name mark"
          - "Underlining the heading of each section"
          - "Underlining the words that are links"
        answer: 0
        explain: "Valid uses include applying a proper name mark to denote proper names in Chinese text."
      - prompt: "What happened to <u> between HTML 4 and HTML 5?"
        choices:
          - "It was removed for good"
          - "It was deprecated, then restored with a new meaning"
          - "It was kept exactly as it was, simply a way to underline text"
        answer: 1
        explain: "u was deprecated in HTML 4 and restored in HTML 5 with a semantic meaning, a non-textual annotation."

  - id: inline-semantics
    kind: concept
    title: mark, dfn, small and s
    region: semantic-html
    tier: country
    requires: [strong-and-b]
    says: More words with meaning. mark highlights what is relevant here, like a search match. dfn marks the term a sentence defines. small holds side comments and fine print. s strikes what is no longer accurate; an edit to the document is del and ins.
    cites:
      - el-mark#usage
      - el-dfn#summary
      - el-small#summary
      - el-s#summary
    check:
      - prompt: Search results highlight the words that matched. Which element?
        choices: ["<strong>", "<mark>", "<em>"]
        answer: 1
        explain: mark can indicate the words that matched a search. strong would say the words are important, not relevant.
      - prompt: 'A shop shows an old price that no longer applies: "Was $50". Which element?'
        choices:
          - <del>, since the price has been edited out of the page
          - <small>, since old prices are the page's fine print
          - <s>, for something no longer accurate
        answer: 2
        explain: s represents things that are no longer relevant or accurate. del and ins are for document edits.
      - prompt: Which element marks the term being defined in a sentence?
        choices: ["<dfn>", "<abbr>", "<cite>"]
        answer: 0
        explain: dfn indicates a term to be defined, inside a complete definition statement.
      - prompt: Which element fits a copyright line?
        choices: ["<cite>", "<mark>", "<small>"]
        answer: 2
        explain: small represents side-comments and small print, like copyright and legal text.
      - prompt: "An article corrects a paragraph and wants to show what was removed. Which element marks the removed text?"
        choices:
          - "<small>, so the removed text shows less"
          - "<s>, for text that is no longer accurate"
          - "<del>"
        answer: 2
        explain: "s is not appropriate for document edits; for those, use del and ins."

  - id: abbr-expansion
    kind: concept
    title: Expanding abbreviations
    region: semantic-html
    tier: country
    requires: [abbreviations]
    says: Expand in the text on first use. Reach for title only when that is not possible, and then it holds the expansion and nothing else. Each abbr stands alone.
    cites:
      - el-abbr#expand-first
      - el-abbr#title-only
      - el-abbr#independent
      - el-abbr#title-if-needed
    check:
      - prompt: A page uses <abbr title="HyperText Markup Language">HTML</abbr> once. Do later <abbr>HTML</abbr> elements get that title?
        choices:
          - Yes, the first title applies to all
          - No; each abbr is independent
          - Only within the same paragraph
        answer: 1
        explain: Providing a title for one abbr does not attach the same expansion to others with the same text.
      - prompt: What may the title attribute of <abbr> contain?
        choices:
          - Any helpful tooltip text you like, such as a joke or a hint
          - A link to a glossary entry
          - The full expansion and nothing else
        answer: 2
        explain: If present, title must contain the full description of the abbreviation and nothing else.
      - prompt: "You can expand an abbreviation in the text. Should you also add a title?"
        choices:
          - "No; use title only if expanding in the text is not possible"
          - "Yes, with a longer explanation than the text itself gives"
          - "Yes, every single abbr element on a page needs its own title"
        answer: 0
        explain: "Only include a title if expanding the abbreviation in the text is not possible; a mismatch can be jarring."
      - prompt: "An abbr has title=\"HyperText Markup Language, the language of web pages\". What is wrong?"
        choices:
          - "The title is too short to be useful"
          - "The title must hold the expansion and nothing else"
          - "Nothing; a title may explain the term in any words"
        answer: 1
        explain: "If present, title must contain the full description and nothing else."
      - prompt: "Where does an abbreviation's expansion first belong?"
        choices:
          - "Only in a tooltip that shows on hover"
          - "In a footnote"
          - "In plain text, on first use"
        answer: 2
        explain: "Provide a full expansion of the term in plain text on first use, along with the abbr."

  - id: time-datetime
    kind: concept
    title: The datetime value
    region: semantic-html
    tier: country
    requires: [times-and-dates]
    says: A time element can hold a clock time, a calendar date or a duration. Put the machine-readable value in datetime; without it, the text itself must be that value, and nothing but text.
    cites:
      - el-time#summary
      - el-time#datetime-value
    check:
      - prompt: A <time> has no datetime attribute. Where does its value come from?
        choices:
          - Its text content, which then must be valid
          - The page's lang attribute
          - Nowhere; datetime is required
        answer: 0
        explain: Without datetime, the value is the element's child text content, and the element must have no element descendants.
      - prompt: Which can <time> represent?
        choices:
          - Any number at all, such as a price or a page count
          - A time, a Gregorian date, or a duration
          - Only calendar dates, never times
        answer: 1
        explain: It may represent a 24-hour time, a precise Gregorian date or a valid duration.
      - prompt: Which is a valid datetime for just a time of day?
        choices: ["7.30pm", "half past seven", "19:30"]
        answer: 2
        explain: A time is written on a 24-hour clock as hours and minutes, like 19:30.
      - prompt: "Which time element is valid without a datetime attribute?"
        choices:
          - "<time>2016-01-20</time>"
          - "<time><b>2016-01-20</b></time>"
          - "<time>the twentieth of January</time>"
        answer: 0
        explain: "Without datetime, the element must not have element descendants and its text must be the machine-readable value."
      - prompt: "What can the datetime value of <time> help with?"
        choices:
          - "Styling dates in a different colour from text"
          - "Search results and features such as reminders"
          - "Showing the date in the reader's own language"
        answer: 1
        explain: "The datetime attribute translates dates into a machine-readable format, for better search results or features such as reminders."

  - id: quote-attribution
    kind: concept
    title: Attributing a quotation
    region: semantic-html
    tier: country
    requires: [quotations]
    says: The cite attribute holds the source URL. The attribution a reader sees goes outside the blockquote, and the work's title goes in a cite element.
    cites:
      - el-blockquote#summary
      - el-blockquote#attribution-outside
      - el-cite#summary
      - el-cite#source-attribute
    check:
      - prompt: Where does the visible attribution for a <blockquote> go?
        choices:
          - Inside it, in the last paragraph
          - In the cite attribute only
          - Outside the blockquote element
        answer: 2
        explain: According to the specification, attribution must be placed outside the blockquote.
      - prompt: How do you give the source URL of a q element?
        choices:
          - A cite attribute on the q
          - A cite element inside the q
          - A title attribute on the q
        answer: 0
        explain: To reference the source of quoted material in a blockquote or q, use the cite attribute on the element.
      - prompt: "How is a blockquote usually rendered?"
        choices:
          - "In italics"
          - "In a box at the side of the page"
          - "With indentation"
        answer: 2
        explain: "A blockquote is usually rendered visually by indentation."
      - prompt: "Which markup credits a quotation correctly?"
        choices:
          - "<blockquote><p>…</p></blockquote><p>— Ada</p>"
          - "<blockquote cite=\"Ada\"><p>…</p></blockquote>"
          - "<blockquote><p>…</p><p>— Ada</p></blockquote>"
        answer: 0
        explain: "Attribution for the quotation must be placed outside the blockquote; cite holds a URL, not a name."
      - prompt: "Which element marks up the title of a creative work?"
        choices:
          - "<i>, the element for titles of books"
          - "<cite>"
          - "<q>, around the title of the work"
        answer: 1
        explain: "cite is used to mark up the title of a creative work."

  - id: list-rules
    kind: concept
    title: Picking and nesting lists
    region: semantic-html
    tier: country
    requires: [description-lists]
    says: Shuffle the items. If the meaning changes, it is an ol. Lists nest and alternate freely, an li lives only in a list, and several dt in a row share the dd that follows.
    cites:
      - el-ol#nest
      - el-ol#order-test
      - el-li#parent
      - el-dt#several-terms
    check:
      - prompt: How do you decide between <ol> and <ul>?
        choices:
          - Reorder the items; if the meaning changes, use ol
          - Use ol for any long list
          - Use ul only when the list sits inside nav
        answer: 0
        explain: If reordering changes the meaning, the order is meaningful and the list is an ol.
      - prompt: Can an <li> sit directly in a <div>?
        choices:
          - Yes, anywhere
          - No; it must be in an ol, ul or menu
          - Only when the div sits inside a nav element for a menu
        answer: 1
        explain: An li must be contained in an ordered list, an unordered list or a menu.
      - prompt: Two <dt> elements are followed by one <dd>. What does that mean?
        choices:
          - The second term has no definition
          - Both terms share that description
          - The markup is invalid
        answer: 1
        explain: Several dt in a row are terms all defined by the immediately following dd.
      - prompt: "Which list is ordered?"
        choices:
          - "The colours that a T-shirt in the shop window comes in"
          - "The members of a club, listed in no particular order at all"
          - "Ingredients listed in decreasing proportion on a label"
        answer: 2
        explain: "Ingredients in decreasing proportion are an ordered list; changing the order changes the meaning."
      - prompt: "Can a ul hold an ol inside one of its items?"
        choices:
          - "Yes; lists nest and alternate freely"
          - "Only as the last item"
          - "No; nested lists must be of the same kind"
        answer: 0
        explain: "ol and ul may nest as deeply as desired, alternating between them as needed."

  - id: list-attributes
    kind: concept
    title: Counting and grouping list items
    region: semantic-html
    tier: country
    requires: [list-rules]
    says: An ol can count down with reversed, start anywhere with start, and number in letters or Roman numerals with type, though start is always a plain number. An li can reset the count with value. In a dl, each term and its descriptions may share a div.
    cites:
      - el-ol#reversed-start
      - el-ol#type
      - el-li#value
      - el-dl#div-groups
    check:
      - prompt: A countdown list should be numbered 10, 9, 8 and so on. Which attributes?
        choices:
          - reversed and start="10"
          - type="reverse" with start="10"
          - order="descending" from="10"
        answer: 0
        explain: reversed numbers the items from high to low, and start sets the number to count from.
      - prompt: An ol with type="i" must start at iv. What is start?
        choices: ['start="iv"', 'start="4"', 'start="IV"']
        answer: 1
        explain: start is always an Arabic numeral, even when the numbering type is letters or Roman numerals.
      - prompt: Why wrap each dt and dd group of a dl in a div?
        choices:
          - To apply microdata, attributes or styles to a whole group
          - Browsers require it before they indent any of the dd elements
          - It turns the whole description list into a two-column table
        answer: 0
        explain: HTML allows a div around each name-value group, useful for microdata, global attributes on a whole group, or styling.
      - prompt: "An ol must continue from 7 at its third item. What goes on that li?"
        choices:
          - "type=\"7\", which sets the item's number"
          - "value=\"7\""
          - "start=\"7\", as on the ol element itself"
        answer: 1
        explain: "The li's value attribute sets its ordinal value; the items after it continue from there."
      - prompt: "The numbering style of a list is decoration only. How should you set it?"
        choices:
          - "With a value on each li"
          - "With the type attribute on the ol"
          - "With CSS list-style-type"
        answer: 2
        explain: "Unless the type of numbering matters, as in legal documents, use the CSS list-style-type property instead of type."

  - id: breaks-with-meaning
    kind: concept
    title: Breaks are not spacing
    region: semantic-html
    tier: country
    requires: [breaks-and-rules, screen-reader-structure]
    says: Never build paragraphs from br. Use p and set the gaps with CSS margin. Reserve br for meaningful line breaks and hr for a change of topic.
    cites:
      - el-br#summary
      - el-br#not-margins
      - el-br#screen-readers
      - el-hr#summary
      - el-hr#semantic
    check:
      - prompt: How should you separate two paragraphs?
        choices:
          - Two br elements between them
          - An hr between them
          - Wrap each in p and set spacing with CSS
        answer: 2
        explain: Do not use br to create margins between paragraphs; use p elements and the CSS margin property.
      - prompt: You want a purely decorative horizontal line. Which is right?
        choices:
          - An hr element
          - A CSS border on an existing element
          - A paragraph of underscores that runs across the width
        answer: 1
        explain: hr is now defined semantically as a thematic break; to draw a line, use CSS.
      - prompt: "A page builds its paragraphs from text and <br><br>. What may a screen reader do?"
        choices:
          - "Announce line breaks without treating the text as semantic paragraphs"
          - "Read each part out as a separate, well-formed paragraph of its own"
          - "Skip both the br elements and all of the text between them"
        answer: 0
        explain: "Screen readers may announce line breaks. br does not supply paragraph semantics; use p elements for paragraphs. It does not make neighboring text disappear."
      - prompt: "Which content is a fit for <hr>?"
        choices:
          - "A thin line under every heading, for looks"
          - "A shift of topic within a section"
          - "Gaps in a list"
        answer: 1
        explain: "hr represents a thematic break, such as a change of scene or a shift of topic within a section."
      - prompt: "How is <hr> defined today?"
        choices:
          - "As a horizontal line of a fixed width"
          - "As a margin between two block elements"
          - "In semantic terms"
        answer: 2
        explain: "hr is now defined in semantic terms rather than presentational ones; draw lines with CSS borders."

  - id: title-quality
    kind: concept
    title: A title worth reading first
    region: semantic-html
    tier: country
    requires: [page-title, semantic-html-accessibility]
    says: A screen reader commonly announces the title when entering a page, and the title is a hook in a search result. Make it unique to the page, purpose first and site name after, and never a blob of keywords.
    cites:
      - el-title#text-only
      - el-title#seo
      - el-title#guidelines
      - el-title#assistive
    check:
      - prompt: Which title is best for a bakery's contact page?
        choices: ["Harbour Bakery - Contact us", "Contact us", "Contact us - Harbour Bakery"]
        answer: 2
        explain: Titles should be unique and surface the page's primary purpose first, followed by the name of the website.
      - prompt: What happens to HTML tags inside <title>?
        choices:
          - They are rendered as elements
          - They are treated as plain text
          - They are removed with their content
        answer: 1
        explain: The title only contains text; any tags inside it are treated as plain text.
      - prompt: Why avoid a title like "bakery bread cakes pastries cheap"?
        choices:
          - Keyword blobs can lower a page's search ranking
          - Titles must not contain more than three words
          - Search engines ignore any title written entirely in lowercase
        answer: 0
        explain: If a title is just a list of words, algorithms often reduce the page's position in search results.
      - prompt: "A title is 90 characters long. What might happen in search results?"
        choices:
          - "The end of it may be cut off"
          - "The page is dropped"
          - "Search engines show it in full on two lines"
        answer: 0
        explain: "Search engines typically display about the first 55 to 60 characters; text beyond that may be lost."
      - prompt: "A glossary page about the word \"landmark\". Which title fits?"
        choices:
          - "Landmark"
          - "Landmark: a section users can jump to"
          - "Glossary glossary terms words landmark"
        answer: 1
        explain: "Avoid one- or two-word titles; use a descriptive phrase, or a term-definition pairing for glossary pages."

  - id: language-tags
    kind: concept
    title: Language tags for every part
    region: semantic-html
    tier: country
    requires: [document-language]
    says: The lang on html holds one language tag for most of the page, and it makes even the title be spoken right. Normally tag a part written in another language; proper names and language-independent technical terms can be exceptions.
    cites:
      - el-html#lang
      - el-html#head-announced
      - attr-lang#summary
      - attr-lang#wcag-parts
      - wcag-understandable#language-parts
    check:
      - prompt: Without a lang on <html>, what do screen readers typically do?
        choices:
          - Detect the language perfectly from the words
          - Guess the language from the first word on the page
          - Fall back to the OS language and may mispronounce
        answer: 2
        explain: Without it, screen readers typically default to the operating system's language, which may cause mispronunciations.
      - prompt: A French quotation sits in an English page. What does WCAG ask for?
        choices:
          - Translate it into English
          - Mark that part with its own lang
          - Nothing; the page lang covers it
        answer: 1
        explain: This French quotation should have its own lang. WCAG 3.1.2 normally requires language changes to be identified, with exceptions including proper names and language-independent technical terms.
      - prompt: "The html element has a valid lang. What else is announced properly as a result?"
        choices:
          - "Only the text inside the body"
          - "The names of the files the page links to"
          - "The page's title"
        answer: 2
        explain: "A valid lang on html ensures metadata in the head, such as the title, is announced properly too."
      - prompt: "How many language tags does one lang attribute hold?"
        choices:
          - "A single language tag"
          - "Two"
          - "As many as the page uses, separated by commas"
        answer: 0
        explain: "The lang attribute contains a single BCP 47 language tag."
      - prompt: "A page is mostly English with one Welsh paragraph. Which language goes on html?"
        choices:
          - "Welsh, since it is the less common language"
          - "English"
          - "Both, written one after the other"
        answer: 1
        explain: "The language tag on html should describe the language of the majority of the content."

  - id: code-family
    kind: concept
    title: pre, code, kbd and samp together
    region: semantic-html
    tier: country
    requires: [computer-code, character-references]
    says: pre keeps its spacing but still parses its text as HTML, so escape the < inside it. Nest kbd in kbd for single keys, kbd in samp for echoed input, samp in kbd for a menu you choose.
    cites:
      - el-pre#whitespace
      - el-pre#escape
      - el-pre#contains
      - el-kbd#nesting
    check:
      - prompt: A <pre> block should show the code <p>Hello</p>. What must you do?
        choices:
          - Nothing; pre shows text exactly as typed
          - Escape the < as &lt;
          - Wrap it in an HTML comment
        answer: 1
        explain: The text of pre is parsed as HTML, so syntax characters such as < may need escaping with character references.
      - prompt: What does a <kbd> nested inside another <kbd> represent?
        choices:
          - Output printed by the program
          - A variable name used in the program's code
          - One key within a larger input
        answer: 2
        explain: kbd within kbd represents an actual key or other unit of input as part of a larger input.
      - prompt: "A <pre> begins with a newline right after its opening tag. What happens to it?"
        choices:
          - "It shows as a blank line at the top"
          - "All newlines go"
          - "The first newline is stripped"
        answer: 2
        explain: "If leading newlines follow the opening pre tag, the first newline character is stripped by the parser."
      - prompt: "A <pre> holds a terminal session. Which element marks the lines the computer printed?"
        choices:
          - "<samp>"
          - "<kbd>, since the user typed the command"
          - "<code>, since it is all computer code"
        answer: 0
        explain: "pre commonly contains code, samp and kbd, to represent computer code, computer output and user input respectively."
      - prompt: "Does the parser strip the first newline after an opening <pre> tag in XHTML too?"
        choices:
          - "Yes, in every kind of document"
          - "Only when a space follows it"
          - "No; the HTML parser does that, and XHTML is left alone"
        answer: 2
        explain: "The first newline is stripped by the HTML parser; this does not apply when using XHTML."

  - id: accessibility-tree
    kind: concept
    title: The accessibility tree
    region: semantic-html
    tier: country
    requires: [semantic-html-accessibility, permissive-parsing]
    says: The browser builds the DOM from your markup, then an accessibility tree from the DOM. Each object there has a name and a role, among other properties, and that is what a screen reader tells its user.
    cites:
      - glossary-accessibility-tree#definition
      - glossary-accessibility-tree#from-dom
      - glossary-accessibility-tree#name
      - glossary-accessibility-tree#role
    check:
      - prompt: What is the accessibility tree built from?
        choices: ["The CSS rules", "The DOM tree", "The page's raw source text"]
        answer: 1
        explain: Browsers create the accessibility tree based on the DOM tree and expose it to assistive technologies.
      - prompt: A real <button>Save</button> is in the page. What does the accessibility tree hold for it?
        choices:
          - Its name, "Save", and its role, button
          - Its CSS colours, font and size, as the screen shows it
          - Only the text "Save", since elements have no roles
        answer: 0
        explain: Objects in the tree have a name (how to refer to it) and a role (what kind of thing it is), among other properties.
      - prompt: "A link's text is \"Read more\". What is its name in the accessibility tree?"
        choices:
          - "link, which is its role"
          - "The URL that its href points to"
          - "Read more"
        answer: 2
        explain: "The name is how we refer to the thing; a link with the text \"Read more\" has \"Read more\" as its name."
      - prompt: "In the accessibility tree, what does a role answer?"
        choices:
          - "What it is, such as a button"
          - "What it is called, such as Save"
          - "Where it sits on the page"
        answer: 0
        explain: "The role says what kind of thing it is, for example a button, a nav bar or a list of items."
      - prompt: "What uses the accessibility tree?"
        choices:
          - "Search engines, to rank the page against other pages for a query"
          - "Assistive technologies, through accessibility APIs"
          - "The CSS engine"
        answer: 1
        explain: "The accessibility tree is used by platform accessibility APIs to give assistive technologies, such as screen readers, a representation."

  - id: meta-kinds
    kind: concept
    title: Four kinds of meta
    region: semantic-html
    tier: country
    requires: [character-encoding]
    says: A meta element is whatever metadata the other head elements cannot hold. Its attribute tells its kind, name for the document, http-equiv for a pragma, charset for the encoding, itemprop for your own.
    cites:
      - el-meta#summary
      - el-meta#kinds
    check:
      - prompt: What kind of metadata does <meta charset="utf-8"> provide?
        choices:
          - Document-level metadata about the author
          - A pragma directive for the server
          - A charset declaration
        answer: 2
        explain: With the charset attribute, meta is a charset declaration, giving the document's character encoding.
      - prompt: Which attribute makes <meta> give document-level metadata?
        choices: ["http-equiv", "name", "itemprop"]
        answer: 1
        explain: With name set, meta provides document-level metadata that applies to the whole page.
      - prompt: "Which meta acts as a pragma directive, standing in for an HTTP header?"
        choices:
          - "A meta with name, like the description"
          - "A meta with charset, giving the encoding"
          - "A meta with http-equiv"
        answer: 2
        explain: "With the http-equiv attribute, meta acts as a pragma directive simulating what an HTTP header could give."
      - prompt: "Which meta provides user-defined metadata?"
        choices:
          - "A meta with itemprop"
          - "A charset meta"
          - "A meta with name=\"author\""
        answer: 0
        explain: "With the itemprop attribute set, meta provides user-defined metadata."
      - prompt: "The page's title must go in the head. Which element holds it?"
        choices:
          - "A meta with name=\"title\""
          - "<title>"
          - "A meta with itemprop=\"title\""
        answer: 1
        explain: "meta represents metadata that other meta-related elements, such as title, cannot represent; the title has its own element."
