id: semantic-citadel
statement: |
  The Semantic Citadel is the last gate of the region: a small site of two pages that has fallen into ruin. Rebuild it room by room. Each stage of the siege opens only when the one before it stands.

  **The home page** (`/index.html`) belongs to the Citadel's birdwatching society. It is MDN's bird watching challenge page.

  - Its heading carries the dove logo, `images/dove.png`, with empty alt text, since the heading's words already name the site.
  - Its welcome text is the main article. A sidebar holds the four favourite photos under their heading.
  - Its credits sit in the page's footer.
  - The photographer's notes name the birds in `images/birds/`. Picture 1 is a robin on a fence post, 2 a blue tit on a feeder, 3 a grey heron in the shallows and 4 a kingfisher on a branch. Each thumbnail (`favorite-bird-1_th.jpg` and so on) links to its full-sized picture (`favorite-bird-1.jpg`), and its alt text says which bird the link opens.

  **The letter page** (`/letter.html`) is MDN's letter challenge: Dr Eleanor Gaye's reply to Eileen Dover. Mark it up as the brief asks, with these changes:

  - The page is in US English. Its head holds the character set, a viewport setting, the author and the title *Awesome science application correspondence*. The style element is already in place.
  - The letter is the page's main content. Its headings are one top level heading, the "Re:" line, and three second level headings.
  - The sender's address is the letter's contact information. The recipient's address may go in an `address` too, as MDN's brief says. Strictly, `address` is only for the contact details of the document or article it sits in, so a paragraph with line breaks is the better choice.
  - The names of the sender and the recipient, and the labels *Tel* and *Email*, are strong. The first address and the first date carry the class `sender-column`. The four dates are machine-readable. The five abbreviations PhD, HTML, CSS, BCE and Esq. are expanded, in the text or in a title. There are six sub- and superscripts. At least two other words carry emphasis or importance. The motto is a quotation with its citation.
  - The semester dates, the subjects (in order of priority) and the dances (with their definitions) are lists.

  **Both pages** share one site:

  - Their titles put the page first and the site after: *… – The Citadel*.
  - Each page is framed by a header at the top, holding the menu or followed straight after by it, and a footer at the bottom.
  - The menu is the same on both pages: *Home, Get started, Photos, Gear, Forum, Letters*. It links to `index.html`, `get-started.html`, `photos.html`, `gear.html`, `forum.html` and `letter.html`, which all exist now. On each page, the link to that page itself is removed or marked as the current page.
  - The first focusable thing on each page is a link that skips to the `main` element.

  The last stage is an accessibility audit: axe-core rules run on both pages, and each one names what it tests.
pages:
  - id: home
    path: /index.html
    title: Birdwatching home page
    starter:
      html: |
        <!doctype html>
        <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Birdwatching</title>
            <link href="https://fonts.googleapis.com/css?family=Roboto+Condensed:300%7CCinzel+Decorative:700" rel="stylesheet">
            <link href="style.css" rel="stylesheet">
          </head>
          <body>
            <h1>Birdwatching</h1>
            Home Get started Photos Gear Forum Letters
            <h2>Welcome</h2>
            <p>
              Welcome to our fake birdwatching site. If this were a real site, it
              would be the ideal place to come to learn more about birdwatching,
              whether you are a beginner looking to learn how to get into birding, or
              an expert wanting to share ideas, tips, and photos with other
              like-minded people.
            </p>
            <p>
              So don't waste time! Get what you need, then turn off that computer and
              get out into the great outdoors!
            </p>
            <h2>Favorite photos</h2>
            <!-- Link images here. -->
            <p>
              This fake website example is CC0 — any part of this code may be reused
              in any way you wish. Original example written by Chris Mills, 2016.
            </p>
            <p>
              <a href="http://game-icons.net/lorc/originals/dove.html">Dove icon</a>
              by Lorc.
            </p>
          </body>
        </html>
