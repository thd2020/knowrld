sources:
  - id: basic-html-syntax
    title: Basic HTML syntax
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Basic_HTML_syntax
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/learn_web_development/core/structuring_content/basic_html_syntax/index.md
    excerpts:
      - id: what-is-html
        text: |-
          {{glossary("HTML")}} (HyperText Markup Language) is a _markup language_ that tells web browsers how to structure the web pages you visit. HTML consists of a series of {{glossary("Element", "elements")}}, which you use to enclose, wrap, or _mark up_ different parts of content to make it appear or act in a certain way. The enclosing {{glossary("Tag", "tags")}} can make content into a hyperlink to link to another page, italicize words, and so on. For example, consider the following line of text:

          ```plain
          My cat is very grumpy
          ```

          We could specify that this text is a paragraph by enclosing it in paragraph ({{htmlelement("p")}}) tags:

          ```html
          <p>My cat is very grumpy</p>
          ```

          Or, we could specify that this text is a top-level heading by enclosing it in [`<h1>`](/en-US/docs/Web/HTML/Reference/Elements/Heading_Elements) tags:

          ```html
          <h1>My cat is very grumpy</h1>
          ```
        verbatim: true
        lines:
          - 37
          - 53
      - id: tags-case
        text: |-
          > [!NOTE]
          > Tags in HTML are not case-sensitive. This means they can be written in uppercase or lowercase. For example, a {{htmlelement("title")}} tag could be written as `<title>`, `<TITLE>`, `<Title>`, `<TiTlE>`, etc., and it will work. However, it is best practice to write all tags in lowercase for consistency and readability.
        verbatim: true
        lines:
          - 59
          - 60
      - id: opening-tag
        text: "- **The opening tag:** This consists of the name of the element (in this example, _p_ for paragraph), wrapped in opening and closing angle brackets. This opening tag marks where the element begins or starts to take effect. In this example, it precedes the start of the paragraph text."
        verbatim: true
        lines:
          - 70
          - 70
      - id: closing-tag
        text: "- **The closing tag:** This is the same as the opening tag, except that it includes a forward slash before the element name. This marks where the element ends. Failing to include a closing tag is a common beginner error that can produce peculiar results."
        verbatim: true
        lines:
          - 72
          - 72
      - id: nesting-right
        text: |-
          Elements can be placed within other elements. This is called _nesting_. If we wanted to state that our cat is **very** grumpy, we could wrap the word _very_ in a {{htmlelement("strong")}} element, which gives the word strong(er) text formatting:

          ```html
          <p>My cat is <strong>very</strong> grumpy.</p>
          ```

          In this code block, the text "My cat is very grumpy." is all defined as a paragraph. The word "very" is additionally defined as having strong importance.

          There is a right and wrong way to do nesting. In the code block above, we open the `<p>` element first, then open the `<strong>` element. For proper nesting, we close the `<strong>` element first, then close the `<p>`.
        verbatim: true
        lines:
          - 106
          - 114
      - id: nesting-overlap
        text: |-
          The following is an example of the _wrong_ way to do nesting:

          ```html-nolint example-bad
          <p>My cat is <strong>very grumpy.</p></strong>
          ```

          The **tags have to open and close so that they are inside or outside one another**. Because the elements overlap in the previous code block, the browser has to guess at your intent. This kind of guessing can result in unexpected results.
        verbatim: true
        lines:
          - 116
          - 122
      - id: void
        text: |-
          Not all elements follow the pattern of an opening tag, content, then a closing tag. Some elements consist of a single tag, which is typically used to insert/embed something in the document. Such elements are called {{glossary("void element", "void elements")}}, which means "elements that cannot contain other HTML content".

          For example, the {{htmlelement("br")}} element inserts a line break into a line of text, which causes it to break onto multiple lines:

          ```html live-sample___void-example
          <p>
            This is a single paragraph, but we are going to <br />break it onto two lines.
          </p>
          ```
        verbatim: true
        lines:
          - 126
          - 134
      - id: void-slash
        text: |-
          > [!NOTE]
          > In some HTML examples, you'll see a `/` added at the end of a void element's tag, for example `<br />`. This is a different style of markup syntax, which isn't wrong, but this "closing slash" is not needed.
        verbatim: true
        lines:
          - 140
          - 141
      - id: attributes
        text: Attributes contain extra information about the element that isn't part of its content. The **`class`** attribute provides an identifying name that can be used to target the element with styles (CSS) or scripting information (JavaScript).
        verbatim: true
        lines:
          - 149
          - 149
      - id: attribute-parts
        text: |-
          An attribute should have:

          - A space between it and the element name. When an element has more than one attribute, the attributes should be separated by spaces too.
          - The attribute name, followed by an equals sign (`=`).
          - An attribute value, wrapped with opening and closing quote marks.
        verbatim: true
        lines:
          - 151
          - 155
      - id: boolean
        text: |-
          Sometimes you will see HTML attributes written without values. These are called [Boolean attributes](/en-US/docs/Glossary/Boolean/HTML). When a boolean attribute is added, its value is set to `true`, irrespective of whatever value is assigned to it (even no value). If an attribute is not included in an HTML tag, its value is set to `false`.

          For example, consider the [`disabled`](/en-US/docs/Web/HTML/Reference/Elements/input#disabled) attribute, which you can assign to form {{htmlelement("input")}} elements to stop the user entering data into them. For example:

          ```html live-sample___boolean-example
          <label for="first-input">This input is disabled</label>
          <input id="first-input" type="text" disabled="disabled" />
          <br />
          ```

          As shorthand, it is acceptable to write the `disabled` attribute without a value:

          ```html live-sample___boolean-example
          <label for="second-input">This input is also disabled</label>
          <input id="second-input" type="text" disabled />
          <br />
          ```
        verbatim: true
        lines:
          - 198
          - 214
      - id: unquoted-values
        text: |-
          It is OK to omit the quotes from around attribute values in certain circumstances. But because this can break your markup in other circumstances, we advise you to **always** include the quote marks. Let's explore why.

          The element in the code snippet below, {{htmlelement("a")}}, is called an **anchor**. Anchors enclose text and turn them into links. The `href` attribute specifies the URL the link points to. You can omit the quotes around the `href` attribute value shown below without any negative consequences, because it has no spaces in it:

          ```html
          <a href=https://www.mozilla.org/>favorite website</a>
          ```

          However, you soon run into problems when omitting quotes from attribute values _with_ spaces. Consider the `title` attribute shown below, which provides a description of the linked page ("The Mozilla homepage") that should appear as a tooltip when the link is hovered over by a mouse pointer.

          ```html-nolint example-bad live-sample___bad-no-quotes
          <a href=https://www.mozilla.org/ title=The Mozilla homepage>favorite website</a>
          ```

          Because quotes are not included around the `title` attribute value, the browser interprets it as three attributes: a `title` attribute with the value `The`, and two Boolean attributes — `Mozilla` and `homepage`. Obviously, this is not what we intended! If you're using a device with a mouse pointer, you can try hovering over the link to view the title tooltip (it will give you "The" rather than the intended "The Mozilla homepage").
        verbatim: true
        lines:
          - 232
          - 246
      - id: always-quote
        text: Always include quotes around attribute values. It avoids errors and unintended behavior, and results in more readable code.
        verbatim: true
        lines:
          - 250
          - 250
      - id: quote-styles
        text: |-
          In this article, we have wrapped all our attribute values in double quotes. However, you might see single quotes used in some HTML code. This is a matter of style. You can feel free to choose which one you prefer. Both of these lines are equivalent:

          ```html-nolint
          <a href='https://www.example.com'>A link to my example.</a>

          <a href="https://www.example.com">A link to my example.</a>
          ```

          Make sure you don't mix single quotes and double quotes. The below example mixes quotes, which will lead to errors because as far as the browser is concerned, the `href` attribute value has not been finished:

          ```html-nolint example-bad
          <a href="https://www.example.com'>A link to my example.</a>
          ```
        verbatim: true
        lines:
          - 254
          - 266
      - id: quotes-inside
        text: |-
          If you use one type of quote, you can include the other type of quote _inside_ your attribute values. This works fine:

          ```html
          <a href="https://www.example.com" title="Isn't this fun?">
            A link to my example.
          </a>
          ```

          To use quote marks inside other quote marks of the same type (single quote or double quote), you can use [character references](#character_references_including_special_characters_in_html). For example, this will break:

          ```html-nolint example-bad
          <a href="https://www.example.com" title="An "interesting" reference">A link to my example.</a>
          ```

          Instead, you need to do this:

          ```html-nolint
          <a href="https://www.example.com" title="An &quot;interesting&quot; reference">A link to my example.</a>
          ```
        verbatim: true
        lines:
          - 268
          - 286
      - id: doctype
        text: |-
          1. `<!doctype html>`: The doctype. When HTML was young (1991-1992), doctypes were meant to act as links to a set of rules that the HTML page had to follow to be considered good HTML. Doctypes used to look something like this:

             ```html
             <!doctype html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
             ```

             In modern times, the doctype is a historical artifact that needs to be included for everything else to work correctly. `<!doctype html>` is the shortest string of characters that counts as a valid doctype, and it should be included at the top of all webpages. That is all you need to know!
        verbatim: true
        lines:
          - 309
          - 315
      - id: html-root
        text: '2. `<html></html>`: The {{htmlelement("html")}} element. This element wraps all the content on the page. It is sometimes known as the root element.'
        verbatim: true
        lines:
          - 317
          - 317
      - id: head
        text: "3. `<head></head>`: The {{htmlelement(\"head\")}} element. This element acts as a container for information about the page that _isn't_ part of the content that users will see. This can include keywords and a page description to be shown in search results, CSS to style content, character set declarations, and more. You will learn more about the head of the page in the next article."
        verbatim: true
        lines:
          - 318
          - 318
      - id: charset
        text: '4. `<meta charset="utf-8">`: A {{htmlelement("meta")}} element. This element represents metadata that describes the page. The [`charset`](/en-US/docs/Web/HTML/Reference/Elements/meta#charset) attribute specifies the character encoding your document will use. UTF-8 includes most characters from the vast majority of human written languages, which means the page will be able to display different languages successfully. There is no reason not to set this, and it can help avoid some problems later.'
        verbatim: true
        lines:
          - 319
          - 319
      - id: body
        text: '6. `<body></body>`: The {{htmlelement("body")}} element. This contains _all_ the content that displays on the page, including text, images, videos, games, playable audio tracks, and so on.'
        verbatim: true
        lines:
          - 321
          - 321
      - id: whitespace
        text: In almost all elements (there are exceptions such as {{htmlelement("pre")}}), no matter how much whitespace you use inside HTML element content, the HTML parser reduces each sequence of whitespace to a single space when rendering the code.
        verbatim: true
        lines:
          - 400
          - 400
      - id: special-chars
        text: In HTML, the characters `<`, `>`, `"`, `'`, and `&` are special characters. They are parts of the HTML syntax itself. So how do you include these special characters in your text? For example, how can you use a literal ampersand or less-than sign in your content without it being interpreted as code?
        verbatim: true
        lines:
          - 416
          - 416
      - id: character-references
        text: |-
          You do this with {{glossary("character reference", "character references")}}. These are special codes that represent characters, to be used in these exact circumstances. Each character reference starts with an ampersand (&), and ends with a semicolon (;).

          | Literal character | Character reference equivalent |
          | ----------------- | ------------------------------ |
          | <                 | `&lt;`                         |
          | >                 | `&gt;`                         |
          | "                 | `&quot;`                       |
          | '                 | `&apos;`                       |
          | &                 | `&amp;`                        |

          Character references are fairly easily remembered because the text they use is an abbreviation of the character name — for example "lt" = "less than", "quot" = "quotation", and "amp" = "ampersand". To learn more about entity references, see [List of XML and HTML character entity references](https://en.wikipedia.org/wiki/List_of_XML_and_HTML_character_entity_references) (Wikipedia).
        verbatim: true
        lines:
          - 418
          - 428
      - id: reference-example
        text: |-
          In the example below, there are two paragraphs:

          ```html-nolint live-sample___entity-ref-example
          <p>In HTML, you define a paragraph using the <p> element.</p>

          <p>In HTML, you define a paragraph using the &lt;p&gt; element.</p>
          ```

          This renders as follows:

          {{ EmbedLiveSample('entity-ref-example', 700, 150) }}

          You can see that the first paragraph has gone wrong, because the browser has interpreted the second instance of `<p>` as starting a new paragraph. The second paragraph renders fine because the angle brackets of the content "&lt;p&gt;" are represented by character references.
        verbatim: true
        lines:
          - 430
          - 442
      - id: utf8-no-references
        text: |-
          > [!NOTE]
          > You don't need to use entity references for any other symbols, as modern browsers will handle the actual symbols just fine as long as your HTML's [character encoding is set to UTF-8](/en-US/docs/Learn_web_development/Core/Structuring_content/Webpage_metadata#specifying_your_documents_character_encoding).
        verbatim: true
        lines:
          - 444
          - 445
      - id: comments
        text: HTML has a mechanism to write comments in the code. Browsers ignore comments, therefore they are invisible to the user. The purpose of comments is to allow you to include notes in the code to explain how it works. This is very useful if you return to a code base after being away for long enough that you don't remember it, or if someone else starts working on it that has never seen it before.
        verbatim: true
        lines:
          - 449
          - 449
  - id: webpage-metadata
    title: What's in the head? Web page metadata
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Webpage_metadata
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/learn_web_development/core/structuring_content/webpage_metadata/index.md
    excerpts:
      - id: head-not-displayed
        text: |-
          The HTML head is the contents of the {{htmlelement("head")}} element. Unlike the contents of the {{htmlelement("body")}} element (which are displayed on the page when loaded in a browser), the head's content is not displayed on the page. Instead, the head's job is to contain {{glossary("Metadata", "metadata")}} about the document. In the above example, the head is quite small:

          ```html
          <head>
            <meta charset="utf-8" />
            <title>My test page</title>
          </head>
          ```
        verbatim: true
        lines:
          - 56
          - 63
      - id: h1-on-page
        text: '- The {{htmlelement("Heading_Elements", "h1")}} element appears on the page when loaded in the browser — generally this should be used once per page, to mark up the title of your page content (the story title, or news headline, or whatever is appropriate to your usage.)'
        verbatim: true
        lines:
          - 71
          - 71
      - id: title-metadata
        text: "- The {{htmlelement(\"title\")}} element is metadata that represents the title of the overall HTML document (not the document's content.)"
        verbatim: true
        lines:
          - 72
          - 72
      - id: title-bookmark
        text: The `<title>` element contents are also used in other ways. For example, if you try bookmarking the page (_Bookmarks > Bookmark This Page_ or the star icon in the URL bar in Firefox), you will see the `<title>` contents filled in as the suggested bookmark name.
        verbatim: true
        lines:
          - 88
          - 88
      - id: title-search
        text: The `<title>` contents are also used in search results, as you'll see below.
        verbatim: true
        lines:
          - 92
          - 92
      - id: charset
        text: |-
          ```html
          <meta charset="utf-8" />
          ```

          This element specifies the document's character encoding — the character set that the document is permitted to use. `utf-8` is a universal character set that includes pretty much any character from any human language. This means that your web page will be able to handle displaying any language; it's therefore a good idea to set this on every web page you create! For example, your page could handle English and Japanese just fine:

          ![A web page containing English and Japanese characters, with the character encoding set to universal, or utf-8. Both languages display fine.](correct-encoding.png)

          If you set your character encoding to `ISO-8859-1`, for example (the character set for the Latin alphabet), your page rendering may appear all messed up:

          ![A web page containing English and Japanese characters, with the character encoding set to latin. The Japanese characters don't display correctly.](bad-encoding.png)

          > [!NOTE]
          > Some browsers (like Chrome) automatically fix incorrect encodings, so depending on what browser you use, you may not see this problem. You should still set an encoding of `utf-8` on your page anyway to avoid any potential problems in other browsers.
        verbatim: true
        lines:
          - 102
          - 115
      - id: name-content
        text: |-
          Many `<meta>` elements include `name` and `content` attributes:

          - `name` specifies the type of meta element it is; what type of information it contains.
          - `content` specifies the actual meta content.

          Two such meta elements that are useful to include on your page define the author of the page, and provide a concise description of the page. Let's look at an example:

          ```html
          <meta name="author" content="Chris Mills" />
          <meta
            name="description"
            content="The MDN Web Docs Learning Area aims to provide
          complete beginners to the Web with all they need to know to get
          started with developing websites and applications." />
          ```
        verbatim: true
        lines:
          - 127
          - 141
      - id: description-seo
        text: Specifying a description that includes keywords relating to the content of your page is useful as it has the potential to make your page appear higher in relevant searches performed in search engines (such activities are termed [Search Engine Optimization](/en-US/docs/Glossary/SEO), or {{glossary("SEO")}}.)
        verbatim: true
        lines:
          - 145
          - 145
      - id: keywords-ignored
        text: |-
          > [!NOTE]
          > Many `<meta>` features just aren't used anymore. For example, the keyword `<meta>` element (`<meta name="keywords" content="fill, in, your, keywords, here">`) — which is supposed to provide keywords for search engines to determine the relevance of that page for different search terms — is ignored by search engines, because spammers were just filling the keyword list with hundreds of keywords, biasing results.
        verbatim: true
        lines:
          - 171
          - 172
      - id: favicon
        text: To further enrich your site design, you can add references to custom icons in your metadata, and these will be displayed in certain contexts. The most commonly used of these is the **favicon** (short for "favorites icon", referring to its use in the "favorites" or "bookmarks" lists in browsers).
        verbatim: true
        lines:
          - 198
          - 198
      - id: favicon-link
        text: |-
          A favicon can be added to your page by:

          1. Saving it in a supported format such as `.ico`, `.gif`, or `.png` somewhere inside your website folder structure.
          2. Adding a {{htmlelement("link")}} element into your HTML's {{HTMLElement("head")}} block, which references the path to the favicon file:

             ```html
             <link rel="icon" href="/favicon.ico" type="image/x-icon" />
             ```
        verbatim: true
        lines:
          - 204
          - 211
      - id: link-stylesheet
        text: |-
          - The {{htmlelement("link")}} element should always go inside the head of your document. This takes two attributes, `rel="stylesheet"`, which indicates that it is the document's stylesheet, and `href`, which contains the path to the stylesheet file:

            ```html
            <link rel="stylesheet" href="my-css-file.css" />
            ```
        verbatim: true
        lines:
          - 263
          - 267
      - id: script-defer
        text: |-
          - The {{htmlelement("script")}} element should also go into the head, and should include a `src` attribute containing the path to the JavaScript you want to load, and `defer` (a [boolean attribute](/en-US/docs/Learn_web_development/Core/Structuring_content/Basic_HTML_syntax#boolean_attributes)), which instructs the browser to load the JavaScript after the page has finished parsing the HTML. The `defer` attribute is useful as it guarantees the HTML is all loaded before the JavaScript runs so that you don't get errors due to JavaScript trying to access an HTML element that doesn't exist on the page yet. There are [several ways](/en-US/docs/Learn_web_development/Core/Scripting/What_is_JavaScript#script_loading_strategies) to handle loading JavaScript on your page, but this is the most reliable one to use for modern browsers.

            ```html
            <script src="my-js-file.js" defer></script>
            ```

            > [!NOTE]
            > The `<script>` element may look like a {{glossary("void element")}}, but it's not, and so needs a closing tag. Instead of pointing to an external script file, you can also choose to put your script inside the `<script>` element.
        verbatim: true
        lines:
          - 269
          - 276
      - id: lang
        text: |-
          Finally, it's worth mentioning that you can (and really should) set the language of your page. This can be done by adding the [lang attribute](/en-US/docs/Web/HTML/Reference/Global_attributes/lang) to the opening HTML tag (as seen in the [meta-example.html](https://github.com/mdn/learning-area/blob/main/html/introduction-to-html/the-html-head/meta-example.html) and shown below.)

          ```html
          <html lang="en-US">
            …
          </html>
          ```

          This is useful in many ways. Your HTML document will be indexed more effectively by search engines if its language is set (allowing it to appear correctly in language-specific results, for example), and it is useful to people with visual impairments using screen readers (for example, the word "six" exists in both French and English, but is pronounced differently.)
        verbatim: true
        lines:
          - 296
          - 304
      - id: lang-parts
        text: |-
          You can also set subsections of your document to be recognized as different languages. For example, we could set our Japanese language section to be recognized as Japanese, like so:

          ```html
          <p>Japanese example: <span lang="ja">ご飯が熱い。</span>.</p>
          ```
        verbatim: true
        lines:
          - 306
          - 310
  - id: headings-and-paragraphs
    title: Headings and paragraphs
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Headings_and_paragraphs
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/learn_web_development/core/structuring_content/headings_and_paragraphs/index.md
    excerpts:
      - id: paragraph
        text: |-
          In HTML, each paragraph has to be wrapped in a {{htmlelement("p")}} element, like so:

          ```html
          <p>I am a paragraph, oh yes I am.</p>
          ```

          Each heading has to be wrapped in a heading element:

          ```html
          <h1>I am the title of the story.</h1>
          ```
        verbatim: true
        lines:
          - 46
          - 56
      - id: six-levels
        text: 'There are six heading elements: {{htmlelement("Heading_Elements", "h1")}}, {{htmlelement("Heading_Elements", "h2")}}, {{htmlelement("Heading_Elements", "h3")}}, {{htmlelement("Heading_Elements", "h4")}}, {{htmlelement("Heading_Elements", "h5")}}, and {{htmlelement("Heading_Elements", "h6")}}. Each element represents a different level of content in the document; `<h1>` represents the main heading, `<h2>` represents subheadings, `<h3>` represents sub-subheadings, and so on.'
        verbatim: true
        lines:
          - 58
          - 58
      - id: story-example
        text: |-
          For example, in this story, the `<h1>` element represents the title of the story, the `<h2>` elements represent the title of each chapter, and the `<h3>` elements represent subsections of each chapter:

          ```html
          <h1>The Crushing Bore</h1>

          <p>By Chris Mills</p>

          <h2>Chapter 1: The dark night</h2>

          <p>
            It was a dark night. Somewhere, an owl hooted. The rain lashed down on the…
          </p>

          <h2>Chapter 2: The eternal silence</h2>

          <p>Our protagonist could not so much as a whisper out of the shadowy figure…</p>

          <h3>The specter speaks</h3>

          <p>
            Several more hours had passed, when all of a sudden the specter sat bolt
            upright and exclaimed, "Please have mercy on my soul!"
          </p>
          ```
        verbatim: true
        lines:
          - 62
          - 85
      - id: hierarchy-rules
        text: |-
          It's really up to you what the elements involved represent, as long as the hierarchy makes sense. You just need to bear in mind a few best practices as you create such structures:

          - Preferably, you should use a single `<h1>` per page—this is the top level heading, and all others sit below this in the hierarchy.
          - Make sure you use the headings in the correct order in the hierarchy. Don't use `<h3>` elements to represent subheadings, followed by `<h2>` elements to represent sub-subheadings—that doesn't make sense and will lead to weird results.
          - Of the six heading levels available, you should aim to use no more than three per page, unless you feel it is necessary. Documents with many levels (for example, a deep heading hierarchy) become unwieldy and difficult to navigate. On such occasions, it is advisable to spread the content over multiple pages if possible.
        verbatim: true
        lines:
          - 87
          - 91
      - id: why-structure
        text: |-
          To answer this question, let's take a look at [text-start.html](https://github.com/mdn/learning-area/blob/main/html/introduction-to-html/html-text-formatting/text-start.html)—a nice hummus recipe. This document's body currently contains multiple pieces of content. They aren't marked up in any way, but they are separated with line breaks (Enter/Return pressed to go onto the next line).

          However, when you [open the document in your browser](https://mdn.github.io/learning-area/html/introduction-to-html/html-text-formatting/text-start.html), you'll see that the text appears as a big chunk!

          ![A webpage that shows a wall of unformatted text, because there are no elements on the page to structure it.](screen_shot_2017-03-29_at_09.20.35.png)

          This is because there are no elements to give the content structure, so the browser does not know what is a heading and what is a paragraph. Furthermore:

          - Users looking at a web page tend to scan quickly to find relevant content, often just reading the headings, to begin with. (We usually [spend a very short time on a web page](https://www.nngroup.com/articles/how-long-do-users-stay-on-web-pages/).) If they can't see anything useful within a few seconds, they'll likely get frustrated and go somewhere else.
          - Search engines indexing your page consider the contents of headings as important keywords for influencing the page's search rankings. Without headings, your page will perform poorly in terms of {{glossary("SEO")}} (Search Engine Optimization).
          - Severely visually impaired people often don't read web pages; they listen to them instead. This is done with software called a [screen reader](https://en.wikipedia.org/wiki/Screen_reader). This software provides ways to get fast access to given text content. Among the various techniques used, they provide an outline of the document by reading out the headings, allowing their users to find the information they need quickly. If headings are not available, they will be forced to listen to the whole document read out loud.
          - To style content with {{glossary("CSS")}}, or make it do interesting things with {{glossary("JavaScript")}}, you need to have elements wrapping the relevant content, so CSS/JavaScript can effectively target it.
        verbatim: true
        lines:
          - 95
          - 106
      - id: h1-semantic
        text: |-
          In a similar way, we need to make sure we are using the correct elements, giving our content the correct meaning, function, or appearance. In this context, the `{{htmlelement("Heading_Elements", "&lt;h1>")}}` element is also a semantic element, which gives the text it wraps around the role (or meaning) of "a top level heading on your page."

          ```html
          <h1>This is a top level heading</h1>
          ```

          By default, the browser will give it a large font size to make it look like a heading (although you could style it to look like anything you wanted using CSS). More importantly, its semantic value will be used in multiple ways, for example by search engines and screen readers (as mentioned above).
        verbatim: true
        lines:
          - 151
          - 157
      - id: span-no-semantics
        text: |-
          On the other hand, you could make any element _look_ like a top level heading. Consider the following:

          ```html
          <span style="font-size: 32px; margin: 21px 0; display: block;">
            Is this a top level heading?
          </span>
          ```

          This is a {{htmlelement("span")}} element. It has no semantics. You use it to wrap content when you want to apply CSS to it (or do something to it with JavaScript) without giving it any extra meaning. (You'll find out more about these later on in the course.) We've applied some CSS to it to make it look like a top level heading, but since it has no semantic value, it will not get any of the extra benefits described above. It is a good idea to use the relevant HTML element for the job.
        verbatim: true
        lines:
          - 159
          - 167
  - id: emphasis-and-importance
    title: Emphasis and importance
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Emphasis_and_importance
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/learn_web_development/core/structuring_content/emphasis_and_importance/index.md
    excerpts:
      - id: em
        text: |-
          When we want to add emphasis in spoken language, we _stress_ certain words, subtly altering the meaning of what we are saying. Similarly, in written language we tend to stress words by putting them in italics. For example, the following two sentences have different meanings.

          > I am glad you weren't late.
          >
          > I am _glad_ you weren't _late_.

          The first sentence sounds genuinely relieved that the person wasn't late. In contrast, the second one, with both the words "glad" and "late" in italics, sounds sarcastic or passive-aggressive, expressing annoyance that the person arrived a bit late.

          In HTML we use the {{htmlelement("em")}} (emphasis) element to mark up such instances. As well as making the document more interesting to read, these are recognized by screen readers, which can be configured to speak them in a different tone of voice. Browsers style this as italic by default, but you shouldn't use this tag purely to get italic styling. To do that, you'd use a {{htmlelement("span")}} element and some CSS, or perhaps an {{htmlelement("i")}} element (see below).

          ```html
          <p>I am <em>glad</em> you weren't <em>late</em>.</p>
          ```
        verbatim: true
        lines:
          - 42
          - 54
      - id: strong
        text: |-
          To emphasize important words, we tend to stress them in spoken language and **bold** them in written language. For example:

          > This liquid is **highly toxic**.
          >
          > I am counting on you. **Do not** be late!

          In HTML we use the {{htmlelement("strong")}} (strong importance) element to mark up such instances. As well as making the document more useful, again these are recognized by screen readers, which can be configured to speak them in a different tone of voice. Browsers style this as bold text by default, but you shouldn't use this tag purely to get bold styling. To do that, you'd use a {{htmlelement("span")}} element and some CSS, or perhaps a {{htmlelement("b")}} element (see below).

          ```html
          <p>This liquid is <strong>highly toxic</strong>.</p>

          <p>I am counting on you. <strong>Do not</strong> be late!</p>
          ```
        verbatim: true
        lines:
          - 58
          - 70
      - id: nest-strong-em
        text: |-
          You can nest strong and emphasis inside one another if desired:

          ```html-nolint
          <p>This liquid is <strong>highly toxic</strong> — if you drink it, <strong>you may <em>die</em></strong>.</p>
          ```
        verbatim: true
        lines:
          - 72
          - 76
      - id: presentational
        text: |-
          The elements we've discussed so far have clear-cut associated semantics. The situation with {{htmlelement("b")}}, {{htmlelement("i")}}, and {{htmlelement("u")}} is somewhat more complicated. They came about so people could write bold, italics, or underlined text in an era when CSS was still supported poorly or not at all. Elements like this, which only affect presentation and not semantics, are known as **presentational elements** and should no longer be used because, as we've seen before, semantics is so important to accessibility, SEO, etc.

          HTML5 redefined `<b>`, `<i>`, and `<u>` with new, somewhat confusing, semantic roles.
        verbatim: true
        lines:
          - 137
          - 139
      - id: best-rule
        text: |-
          Here's the best rule you can remember: It's only appropriate to use `<b>`, `<i>`, or `<u>` to convey a meaning traditionally conveyed with bold, italics, or underline when there isn't a more suitable element; and there usually is. Consider whether `<strong>`, `<em>`, `<mark>`, or `<span>` might be more appropriate.

          Always keep an accessibility mindset. The concept of italics isn't very helpful to people using screen readers, or to people using a writing system other than the Latin alphabet.
        verbatim: true
        lines:
          - 141
          - 143
      - id: i-b-u-meanings
        text: |-
          - {{HTMLElement('i')}} is used to convey a meaning traditionally conveyed by italic: foreign words, taxonomic designation, technical terms, a thought…
          - {{HTMLElement('b')}} is used to convey a meaning traditionally conveyed by bold: keywords, product names, lead sentence…
          - {{HTMLElement('u')}} is used to convey a meaning traditionally conveyed by underline: proper name, misspelling…
        verbatim: true
        lines:
          - 145
          - 147
      - id: underline-links
        text: |-
          > [!NOTE]
          > People strongly associate underlining with hyperlinks. Therefore, on the web, it's best to only underline links. Use the `<u>` element when it's semantically appropriate, but consider using CSS to change the default underline to something more appropriate on the web. The example below illustrates how it can be done.
        verbatim: true
        lines:
          - 149
          - 150
  - id: lists
    title: Lists
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Lists
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/learn_web_development/core/structuring_content/lists/index.md
    excerpts:
      - id: unordered
        text: |-
          Unordered lists are used to mark up lists of items for which the order of the items doesn't matter. Let's take a grocery shopping list as an example:

          ```plain
          milk
          eggs
          bread
          hummus
          ```

          In this example, the items can be in any order. To create this list in HTML, we first wrap the whole list in a {{htmlelement("ul")}} (unordered list) element.
          Then, we wrap each item in a {{htmlelement("li")}} (list item) element:

          ```html
          <ul>
            <li>milk</li>
            <li>eggs</li>
            <li>bread</li>
            <li>hummus</li>
          </ul>
          ```
        verbatim: true
        lines:
          - 38
          - 57
      - id: ordered
        text: |-
          Ordered lists are lists in which the order of the items _does_ matter. Let's take a set of directions as an example:

          ```plain
          Drive to the end of the road
          Turn right
          Go straight across the first two roundabouts
          Turn left at the third roundabout
          The school is on your right, 300 meters up the road
          ```

          The markup structure is the same as for unordered lists, except that you have to wrap the list items in an {{htmlelement("ol")}} element, rather than `<ul>`:

          ```html
          <ol>
            <li>Drive to the end of the road</li>
            <li>Turn right</li>
            <li>Go straight across the first two roundabouts</li>
            <li>Turn left at the third roundabout</li>
            <li>The school is on your right, 300 meters up the road</li>
          </ol>
          ```
        verbatim: true
        lines:
          - 76
          - 96
      - id: nesting
        text: |-
          It is perfectly OK to nest one list inside another one. You might want to have some sub-bullets sitting below a top-level bullet. Let's take the second list from our recipe example:

          ```html
          <ol>
            <li>Remove the skin from the garlic, and chop coarsely.</li>
            <li>Remove all the seeds and stalk from the pepper, and chop coarsely.</li>
            <li>Add all the ingredients into a food processor.</li>
            <li>Process all the ingredients into a paste.</li>
            <li>If you want a coarse "chunky" hummus, process it for a short time.</li>
            <li>If you want a smooth hummus, process it for a longer time.</li>
          </ol>
          ```

          Since the last two bullets are very closely related to the one before them (they read like sub-instructions or choices that fit below that bullet), it might make sense to nest them inside their own unordered list and put that list inside the current fourth bullet. This would look like so:

          ```html
          <ol>
            <li>Remove the skin from the garlic, and chop coarsely.</li>
            <li>Remove all the seeds and stalk from the pepper, and chop coarsely.</li>
            <li>Add all the ingredients into a food processor.</li>
            <li>
              Process all the ingredients into a paste.
              <ul>
                <li>
                  If you want a coarse "chunky" hummus, process it for a short time.
                </li>
                <li>If you want a smooth hummus, process it for a longer time.</li>
              </ul>
            </li>
          </ol>
          ```
        verbatim: true
        lines:
          - 179
          - 209
      - id: description-purpose
        text: |-
          The purpose of description lists is to mark up a set of items and their associated descriptions, such as terms and definitions, or questions and answers. Let's look at an example of a set of terms and definitions:

          ```plain
          soliloquy
          In drama, where a character speaks to themselves, representing their inner thoughts or feelings and in the process relaying them to the audience (but not to other characters.)
          monologue
          In drama, where a character speaks their thoughts out loud to share them with the audience and any other characters present.
          aside
          In drama, where a character shares a comment only with the audience for humorous or dramatic effect. This is usually a feeling, thought or piece of additional background information
          ```
        verbatim: true
        lines:
          - 215
          - 224
      - id: dl-dt-dd
        text: |-
          Description lists use a different wrapper than the other list types — {{htmlelement("dl")}}; in addition each term is wrapped in a {{htmlelement("dt")}} (description term) element, and each description is wrapped in a {{htmlelement("dd")}} (description definition) element.

          ### Description list example

          Let's finish marking up our example:

          ```html
          <dl>
            <dt>soliloquy</dt>
            <dd>
              In drama, where a character speaks to themselves, representing their inner
              thoughts or feelings and in the process relaying them to the audience (but
              not to other characters.)
            </dd>
            <dt>monologue</dt>
            <dd>
              In drama, where a character speaks their thoughts out loud to share them
              with the audience and any other characters present.
            </dd>
            <dt>aside</dt>
            <dd>
              In drama, where a character shares a comment only with the audience for
              humorous or dramatic effect. This is usually a feeling, thought, or piece of
              additional background information.
            </dd>
          </dl>
          ```
        verbatim: true
        lines:
          - 226
          - 252
      - id: multiple-descriptions
        text: |-
          Note that it is permitted to have a single term with multiple descriptions, for example:

          ```html
          <dl>
            <dt>aside</dt>
            <dd>
              In drama, where a character shares a comment only with the audience for
              humorous or dramatic effect. This is usually a feeling, thought, or piece of
              additional background information.
            </dd>
            <dd>
              In writing, a section of content that is related to the current topic, but
              doesn't fit directly into the main flow of content so is presented nearby
              (often in a box off to the side.)
            </dd>
          </dl>
          ```
        verbatim: true
        lines:
          - 260
          - 276
  - id: advanced-text-features
    title: Advanced text features
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Advanced_text_features
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/learn_web_development/core/structuring_content/advanced_text_features/index.md
    excerpts:
      - id: blockquote
        text: |-
          If a section of block level content (be it a paragraph, multiple paragraphs, a list, etc.) is quoted from somewhere else, you should wrap it inside a {{htmlelement("blockquote")}} element to signify this, and include a URL pointing to the source of the quote inside a [`cite`](/en-US/docs/Web/HTML/Reference/Elements/blockquote#cite) attribute. For example, the following markup is taken from the MDN `<blockquote>` element page:

          ```html
          <p>
            The <strong>HTML <code>&lt;blockquote&gt;</code> Element</strong> (or
            <em>HTML Block Quotation Element</em>) indicates that the enclosed text is an
            extended quotation.
          </p>
          ```

          To turn this into a block quote, we would just do this:

          ```html
          <p>Here is a blockquote:</p>
          <blockquote
            cite="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/blockquote">
            <p>
              The <strong>HTML <code>&lt;blockquote&gt;</code> Element</strong> (or
              <em>HTML Block Quotation Element</em>) indicates that the enclosed text is
              an extended quotation.
            </p>
          </blockquote>
          ```
        verbatim: true
        lines:
          - 48
          - 70
      - id: inline-q
        text: |-
          Inline quotations work in exactly the same way, except that they use the {{htmlelement("q")}} element. For example, the below bit of markup contains a quotation from the MDN `<q>` page:

          ```html
          <p>
            The quote element — <code>&lt;q&gt;</code> — is
            <q
              cite="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/q">
              intended for short quotations that don't require paragraph breaks.
            </q>
          </p>
          ```
        verbatim: true
        lines:
          - 78
          - 88
      - id: cite-attribute-hidden
        text: The content of the [`cite`](/en-US/docs/Web/HTML/Reference/Elements/blockquote#cite) attribute sounds useful, but unfortunately browsers, screen readers, etc. don't really do much with it. There is no way to get the browser to display the contents of `cite`, without writing your own solution using JavaScript or CSS. If you want to make the source of the quotation available on the page you need to make it available in the text via a link or some other appropriate way.
        verbatim: true
        lines:
          - 96
          - 96
      - id: cite-element
        text: |-
          There is a {{htmlelement("cite")}} element, but this is meant to contain the title of the resource being quoted, e.g., the name of the book. There is no reason, however, why you couldn't link the text inside `<cite>` to the quote source in some way:

          ```html-nolint
          <p>
            According to the
            <a href="/en-US/docs/Web/HTML/Reference/Elements/blockquote">
              <cite>MDN blockquote page</cite></a>:
          </p>

          <blockquote
            cite="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/blockquote">
            <p>
              The <strong>HTML <code>&lt;blockquote&gt;</code> Element</strong> (or
              <em>HTML Block Quotation Element</em>) indicates that the enclosed text is
              an extended quotation.
            </p>
          </blockquote>

          <p>
            The quote element — <code>&lt;q&gt;</code> — is
            <q cite="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/q">
              intended for short quotations that don't require paragraph breaks.
            </q>
            — <a href="/en-US/docs/Web/HTML/Reference/Elements/q"><cite>MDN q page</cite></a>.
          </p>
          ```
        verbatim: true
        lines:
          - 98
          - 123
      - id: abbr
        text: Another fairly common element you'll meet when looking around the Web is {{htmlelement("abbr")}} — this is used to wrap around an abbreviation or acronym. When including either, provide a full expansion of the term in plain text on first use, along with the `<abbr>` to mark up the abbreviation. This provides a hint to user agents on how to announce/display the content while informing all users what the abbreviation means.
        verbatim: true
        lines:
          - 190
          - 190
      - id: abbr-title
        text: |-
          If providing the expansion in addition to the abbreviation makes little sense, and the abbreviation or acronym is a fairly shortened term, provide the full expansion of the term as the value of the [`title`](/en-US/docs/Web/HTML/Reference/Global_attributes/title) attribute:

          ### Abbreviation example

          Let's look at an example.

          ```html
          <p>
            We use <abbr>HTML</abbr>, Hypertext Markup Language, to structure our web
            documents.
          </p>

          <p>
            I think <abbr title="Reverend">Rev.</abbr> Green did it in the kitchen with
            the chainsaw.
          </p>
          ```
        verbatim: true
        lines:
          - 192
          - 208
      - id: abbr-choices
        text: |-
          - Arguably, NASA should be expanded in text on first mention, as it is a useful bit of information for everyone to have available in the text.
          - Acronyms like "LGTM", on the other hand, are purely written to save space and time so it wouldn't make sense to also write it out, hence putting the expansion in the `title` attribute. In a real application, you probably wouldn't do this by hand — you'd get some kind of script to add it automatically for known terms.
        verbatim: true
        lines:
          - 248
          - 249
      - id: acronym-obsolete
        text: |-
          > [!NOTE]
          > Earlier versions of html also included support for the {{htmlelement("acronym")}} element, but it was removed from the HTML spec in favor of using `<abbr>` to represent both abbreviations and acronyms. `<acronym>` should not be used.
        verbatim: true
        lines:
          - 214
          - 215
      - id: address
        text: |-
          HTML has an element for marking up contact details — {{htmlelement("address")}}. This wraps around your contact details, for example:

          ```html
          <address>Chris Mills, Manchester, The Grim North, UK</address>
          ```

          It could also include more complex markup, and other forms of contact information, for example:

          ```html
          <address>
            <p>
              Chris Mills<br />
              Manchester<br />
              The Grim North<br />
              UK
            </p>

            <ul>
              <li>Tel: 01234 567 890</li>
              <li>Email: me@grim-north.co.uk</li>
            </ul>
          </address>
          ```

          Note that something like this would also be OK, if the linked page contained the contact information:

          ```html
          <address>
            Page written by <a href="../authors/chris-mills/">Chris Mills</a>.
          </address>
          ```
        verbatim: true
        lines:
          - 255
          - 285
      - id: address-scope
        text: |-
          > [!NOTE]
          > The {{htmlelement("address")}} element should only be used to provide contact information for the document contained by the nearest {{htmlelement("article")}} or {{htmlelement("body")}} element. It would be correct to use it in the footer of a site to include the contact information of the entire site, or inside an article for the contact details of the author, but not to mark up a list of addresses unrelated to the content of that page.
        verbatim: true
        lines:
          - 287
          - 288
      - id: sup-sub
        text: |-
          You will occasionally need to use superscript and subscript when marking up items like dates, chemical formulae, and mathematical equations so they have the correct meaning. The {{htmlelement("sup")}} and {{htmlelement("sub")}} elements handle this job. For example:

          ```html
          <p>My birthday is on the 25<sup>th</sup> of May 2001.</p>
          <p>
            Caffeine's chemical formula is
            C<sub>8</sub>H<sub>10</sub>N<sub>4</sub>O<sub>2</sub>.
          </p>
          <p>If x<sup>2</sup> is 9, x must equal 3 or -3.</p>
          ```
        verbatim: true
        lines:
          - 292
          - 301
      - id: code-elements
        text: |-
          There are a number of elements available for marking up computer code using HTML:

          - {{htmlelement("code")}}: For marking up generic pieces of computer code.
          - {{htmlelement("pre")}}: For retaining whitespace (generally code blocks) — if you use indentation or excess whitespace inside your text, browsers will ignore it and you will not see it on your rendered page. If you wrap the text in `<pre></pre>` tags however, your whitespace will be rendered identically to how you see it in your text editor.
          - {{htmlelement("var")}}: For specifically marking up variable names.
          - {{htmlelement("kbd")}}: For marking up keyboard (and other types of) input entered into the computer.
          - {{htmlelement("samp")}}: For marking up the output of a computer program.
        verbatim: true
        lines:
          - 309
          - 315
      - id: code-examples
        text: |-
          Let's look at examples of these elements and how they're used to represent computer code:

          ```html
          <pre><code>const para = document.querySelector('p');

          para.onclick = function() {
            alert('Owww, stop poking me!');
          }</code></pre>

          <p>
            You shouldn't use presentational elements like <code>&lt;font&gt;</code> and
            <code>&lt;center&gt;</code>.
          </p>

          <p>
            In the above JavaScript example, <var>para</var> represents a paragraph
            element.
          </p>

          <p>Select all the text with <kbd>Ctrl</kbd>/<kbd>Cmd</kbd> + <kbd>A</kbd>.</p>

          <pre>$ <kbd>ping mozilla.org</kbd>
          <samp>PING mozilla.org (63.245.215.20): 56 data bytes
          64 bytes from 63.245.215.20: icmp_seq=0 ttl=40 time=158.233 ms</samp></pre>
          ```
        verbatim: true
        lines:
          - 317
          - 341
      - id: time
        text: |-
          HTML also provides the {{htmlelement("time")}} element for marking up times and dates in a machine-readable format. For example:

          ```html
          <time datetime="2016-01-20">20 January 2016</time>
          ```
        verbatim: true
        lines:
          - 349
          - 353
      - id: time-why
        text: |-
          Why is this useful? Well, there are many different ways that humans write down dates. The above date could be written as:

          <!-- markdownlint-disable MD033 -->

          - 20 January 2016
          - 20th January 2016
          - Jan 20 2016
          - 20/01/16
          - 01/20/16
          - The 20th of next month
          - <span lang="fr">20e Janvier 2016</span>
          - <span lang="ja">2016 年 1 月 20 日</span>
          - And so on.

          <!-- markdownlint-enable MD033 -->

          But these different forms cannot be easily recognized by computers — what if you wanted to automatically grab the dates of all events in a page and insert them into a calendar? The {{htmlelement("time")}} element allows you to attach an unambiguous, machine-readable time/date for this purpose.
        verbatim: true
        lines:
          - 355
          - 371
      - id: time-formats
        text: |-
          The basic example above just provides a simple machine readable date, but there are many other options that are possible, for example:

          ```html
          <!-- Standard simple date -->
          <time datetime="2016-01-20">20 January 2016</time>
          <!-- Just year and month -->
          <time datetime="2016-01">January 2016</time>
          <!-- Just month and day -->
          <time datetime="01-20">20 January</time>
          <!-- Just time, hours and minutes -->
          <time datetime="19:30">19:30</time>
          <!-- You can do seconds and milliseconds too! -->
          <time datetime="19:30:01.856">19:30:01.856</time>
          <!-- Date and time -->
          <time datetime="2016-01-20T19:30">7.30pm, 20 January 2016</time>
          <!-- Date and time with timezone offset -->
          <time datetime="2016-01-20T19:30+01:00">
            7.30pm, 20 January 2016 is 8.30pm in France
          </time>
          <!-- Calling out a specific week number -->
          <time datetime="2016-W04">The fourth week of 2016</time>
          ```
        verbatim: true
        lines:
          - 373
          - 394
  - id: structuring-documents
    title: Structuring documents
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Structuring_documents
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/learn_web_development/core/structuring_content/structuring_documents/index.md
    excerpts:
      - id: common-components
        text: |-
          Webpages can and will look pretty different from one another, but they all tend to share similar standard components, unless the page is displaying a fullscreen video or game, is part of some kind of art project, or is just badly structured:

          - header:
            - : Usually a big strip across the top with a big heading, logo, and perhaps a tagline. This usually stays the same from one page of a website to another.
          - navigation bar:
            - : Links to the site's main sections; usually represented by menu buttons, links, or tabs. Like the header, this content usually remains consistent from one webpage to another — having inconsistent navigation on your website will just lead to confused, frustrated users. Many web designers consider the navigation bar to be part of the header rather than an individual component, but that's not a requirement; in fact, some also argue that having the two separate is better for [accessibility](/en-US/docs/Learn_web_development/Core/Accessibility), as screen readers can read the two features better if they are separate.
          - main content:
            - : A big area in the center that contains most of the unique content of a given webpage, for example, the video you want to watch, or the main story you're reading, or the map you want to view, or the news headlines, etc. This is the one part of the website that definitely will vary from page to page!
          - sidebar:
            - : Some peripheral info, links, quotes, ads, etc. Usually, this is contextual to what is contained in the main content (for example on a news article page, the sidebar might contain the author's bio, or links to related articles) but there are also cases where you'll find some recurring elements like a secondary navigation system.
          - footer:
            - : A strip across the bottom of the page that generally contains fine print, copyright notices, or contact info. It's a place to put common information (like the header) but usually, that information is not critical or secondary to the website itself. The footer is also sometimes used for {{Glossary("SEO")}} purposes, by providing links for quick access to popular content.
        verbatim: true
        lines:
          - 41
          - 52
      - id: functionality
        text: In your HTML code, you can mark up sections of content based on their _functionality_ — you can use elements that represent the sections of content described above unambiguously, and assistive technologies like screen readers can recognize those elements and help with tasks like "find the main navigation", or "find the main content." As we mentioned earlier in the course, there are a number of [consequences of not using the right element structure and semantics for the right job](/en-US/docs/Learn_web_development/Core/Structuring_content/Headings_and_paragraphs#why_do_we_need_structure).
        verbatim: true
        lines:
          - 70
          - 70
      - id: section-tags
        text: |-
          To implement such semantic mark up, HTML provides dedicated tags that you can use to represent such sections, for example:

          - **header:** {{htmlelement("header")}}.
          - **navigation bar:** {{htmlelement("nav")}}.
          - **main content:** {{htmlelement("main")}}, with various content subsections represented by {{HTMLElement("article")}}, {{htmlelement("section")}}, and {{htmlelement("div")}} elements.
          - **sidebar:** {{htmlelement("aside")}}; often placed inside {{htmlelement("main")}}.
          - **footer:** {{htmlelement("footer")}}.
        verbatim: true
        lines:
          - 72
          - 78
      - id: main-article-section-aside
        text: |-
          - {{HTMLElement('main')}} is for content _unique to this page._ Use `<main>` only _once_ per page, and put it directly inside {{HTMLElement('body')}}. Ideally this shouldn't be nested within other elements.
          - {{HTMLElement('article')}} encloses a block of related content that makes sense on its own without the rest of the page (for example, a single blog post).
          - {{HTMLElement('section')}} is similar to `<article>`, but it is more for grouping together a single part of the page that constitutes one single piece of functionality (like a mini map, or a set of article headlines and summaries), or a theme. It's considered best practice to begin each section with a [heading](/en-US/docs/Learn_web_development/Core/Structuring_content/Headings_and_paragraphs); also note that you can break `<article>`s up into different `<section>`s, or `<section>`s up into different `<article>`s, depending on the context.
          - {{HTMLElement('aside')}} contains content that is not directly related to the main content but can provide additional information indirectly related to it (glossary entries, author biography, related links, etc.).
        verbatim: true
        lines:
          - 202
          - 205
      - id: header-nav-footer
        text: |-
          - {{HTMLElement('header')}} represents a group of introductory content. If it is a child of {{HTMLElement('body')}} it defines the global header of a webpage, but if it's a child of an {{HTMLElement('article')}} or {{HTMLElement('section')}} it defines a specific header for that section (try not to confuse this with [titles and headings](/en-US/docs/Learn_web_development/Core/Structuring_content/Webpage_metadata#adding_a_title)).
          - {{HTMLElement('nav')}} contains the main navigation functionality for the page. Secondary links, etc., would not go in the navigation.
          - {{HTMLElement('footer')}} represents a group of end content for a page.
        verbatim: true
        lines:
          - 206
          - 208
      - id: non-semantic
        text: Sometimes you'll come across a situation where you can't find an ideal semantic element to group some items together or wrap some content. Sometimes you might want to just group a set of elements together to affect them all as a single entity with some {{glossary("CSS")}} or {{glossary("JavaScript")}}. For cases like these, HTML provides the {{HTMLElement("div")}} and {{HTMLElement("span")}} elements. You should use these preferably with a suitable [`class`](/en-US/docs/Web/HTML/Reference/Global_attributes/class) attribute, to provide some kind of label for them so they can be easily targeted.
        verbatim: true
        lines:
          - 214
          - 214
      - id: span
        text: |-
          {{HTMLElement("span")}} is an inline non-semantic element, which you should only use if you can't think of a better semantic text element to wrap your content, or don't want to add any specific meaning. For example:

          ```html
          <p>
            The King walked drunkenly back to his room at 01:00, the beer doing nothing to
            aid him as he staggered through the door.
            <span class="editor-note">
              [Editor's note: At this point in the play, the lights should be down low].
            </span>
          </p>
          ```

          In this case, the editor's note is supposed to merely provide extra direction for the director of the play; it is not supposed to have extra semantic meaning. For sighted users, CSS would perhaps be used to distance the note slightly from the main text.
        verbatim: true
        lines:
          - 216
          - 228
      - id: div
        text: |-
          {{HTMLElement("div")}} is a block level non-semantic element, which you should only use if you can't think of a better semantic block element to use, or don't want to add any specific meaning. For example, imagine a shopping cart widget that you could choose to pull up at any point during your time on an e-commerce site:

          ```html-nolint
          <div class="shopping-cart">
            <h2>Shopping cart</h2>
            <ul>
              <li>
                <p>
                  <a href=""><strong>Silver earrings</strong></a>: $99.95.
                </p>
                <img src="../products/3333-0985/thumb.png" alt="Silver earrings" />
              </li>
              <li>…</li>
            </ul>
            <p>Total cost: $237.89</p>
          </div>
          ```

          This isn't really an `<aside>`, as it doesn't necessarily relate to the main content of the page (you want it viewable from anywhere). It doesn't even particularly warrant using a `<section>`, as it isn't part of the main content of the page. So a `<div>` is fine in this case. We've included a heading as a signpost to aid screen reader users in finding it.
        verbatim: true
        lines:
          - 230
          - 248
      - id: div-warning
        text: |-
          > [!WARNING]
          > Divs are so convenient to use that it's easy to use them too much. As they carry no semantic value, they just clutter your HTML code. Take care to use them only when there is no better semantic solution and try to reduce their usage to the minimum otherwise you'll have a hard time updating and maintaining your documents.
        verbatim: true
        lines:
          - 250
          - 251
      - id: br
        text: |-
          `<br>` creates a line break in a paragraph; it is the only way to force a rigid structure in a situation where you want a series of fixed short lines, such as in a postal address or a poem. For example:

          ```html
          <p>
            There once was a man named O'Dell<br />
            Who loved to write HTML<br />
            But his structure was bad, his semantics were sad<br />
            and his markup didn't read very well.
          </p>
          ```
        verbatim: true
        lines:
          - 262
          - 271
      - id: hr
        text: |-
          `<hr>` elements create a horizontal rule in the document that denotes a thematic change in the text (such as a change in topic or scene). Visually it just looks like a horizontal line. As an example:

          ```html
          <p>
            Ron was backed into a corner by the marauding netherbeasts. Scared, but
            determined to protect his friends, he raised his wand and prepared to do
            battle, hoping that his distress call had made it through.
          </p>
          <hr />
          <p>
            Meanwhile, Harry was sitting at home, staring at his royalty statement and
            pondering when the next spin off series would come out, when an enchanted
            distress letter flew through his window and landed in his lap. He read it
            hazily and sighed; "better get back to work then", he mused.
          </p>
          ```
        verbatim: true
        lines:
          - 279
          - 294
      - id: information-architecture
        text: The next stage after planning out the structure of a single webpage is to plan out the structure of a whole multi-page website, including how they should be arranged and link to one another for the best possible user experience. This is called {{glossary("Information architecture")}}.
        verbatim: true
        lines:
          - 302
          - 302
      - id: common-to-every-page
        text: |-
          1. You'll have a few elements common to most (if not all) pages — such as the navigation menu, and the footer content. If your site is for a business, for example, it's a good idea to have your contact information available in the footer on each page. Note down what you want to have common to every page. For example:
             - Header:
               - Title and logo
               - Site language chooser
             - Navigation menu
             - Footer:
               - Copyright notice
               - Link to terms and conditions, contact details, and accessibility policy
        verbatim: true
        lines:
          - 308
          - 315
      - id: sort-into-groups
        text: 4. Next, try to sort all these content items into groups, to give you an idea of what parts might live together on different pages. This is very similar to a technique called {{glossary("Card sorting")}}.
        verbatim: true
        lines:
          - 332
          - 332
      - id: sitemap
        text: 5. Now try to sketch a rough sitemap — have a box for each page on your site, and draw lines to show the typical workflow between pages. The homepage will probably be in the top or at the center, and link to most if not all of the others. Most of the pages in a small site should be available from the main navigation, although there are exceptions. You might also want to include notes about how things might be presented.![A map of the site showing the homepage, country page, search results, specials page, and checkout and purchase flow](/shared-assets/images/diagrams/learn/structuring-documents/site-map.svg)
        verbatim: true
        lines:
          - 350
          - 350
  - id: creating-links
    title: Creating links
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Creating_links
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/learn_web_development/core/structuring_content/creating_links/index.md
    excerpts:
      - id: url
        text: |-
          Hyperlinks are features of an HTML document that, when clicked or otherwise activated, cause the browser to navigate to other documents or resources, sometimes specific parts of documents.
          Hyperlinks are one of the most exciting innovations the Web has to offer.
          They've been a feature of the Web since the beginning, and are what makes the Web _a web._
          Each resource on the web has an address, known as a {{glossary("URL")}} (Uniform Resource Locator), which hyperlinks point to.
        verbatim: true
        lines:
          - 47
          - 50
      - id: anchor
        text: |-
          A basic link is created by wrapping the text or other content inside an {{htmlelement("a")}} element and using the [`href`](/en-US/docs/Web/HTML/Reference/Elements/a#href) attribute, also known as a **Hypertext Reference**, or **target**, that contains the web address.

          ```html
          <p>
            I'm creating a link to
            <a href="https://www.mozilla.org/en-US/">the Mozilla homepage</a>.
          </p>
          ```
        verbatim: true
        lines:
          - 62
          - 69
      - id: block-links
        text: |-
          As mentioned before, almost any content can be made into a link, even {{Glossary("Block/CSS", "block-level elements")}}.
          If you want to make a heading element a link then wrap it in an anchor (`<a>`) element as shown in the following code snippet:

          ```html
          <a href="https://developer.mozilla.org/en-US/">
            <h1>MDN Web Docs</h1>
          </a>
          <p>
            Documenting web technologies, including CSS, HTML, and JavaScript, since 2005.
          </p>
          ```
        verbatim: true
        lines:
          - 80
          - 90
      - id: image-link
        text: |-
          To turn an image into a link, wrap the {{htmlelement("img")}} element with an {{htmlelement("a")}} element. The example below uses a relative path to reference a locally stored SVG image file.

          ```css hidden
          img {
            height: 100px;
            width: 150px;
            border: 1px solid gray;
          }
          ```

          ```html
          <a href="https://developer.mozilla.org/en-US/">
            <img src="mdn_logo.svg" alt="MDN Web Docs" />
          </a>
          ```
        verbatim: true
        lines:
          - 97
          - 111
      - id: title-hover-only
        text: |-
          > [!NOTE]
          > A link title is only revealed on mouse hover, which means that people relying on keyboard controls or touchscreens to navigate web pages will have difficulty accessing title information.
          > If a title's information is truly important to the usability of the page, then you should present it in a manner that will be accessible to all users, for example by putting it in the regular text.
        verbatim: true
        lines:
          - 139
          - 141
      - id: same-directory
        text: |-
          If you want to include a hyperlink inside the top level `index.html` pointing to `contacts.html`, you can specify the path as just the filename that you want to link to, because it's in the same directory as the current file. The URL you would use is `contacts.html`:

          ```html
          <p>
            Want to contact a specific staff member? Find details on our
            <a href="contacts.html">contacts page</a>.
          </p>
          ```

          You can also start a path to a file inside the same directory using a single dot followed by a slash: `./`. The following example is equivalent to the previous one, but some people like to include the `./` anyway because they feel it provides more clarity:

          ```html
          <p>
            Want to contact a specific staff member? Find details on our
            <a href="./contacts.html">contacts page</a>.
          </p>
          ```
        verbatim: true
        lines:
          - 239
          - 255
      - id: subdirectory
        text: |-
          If you want to include a hyperlink inside the top level `index.html` pointing to `projects/index.html`, you need to go down into the `projects` directory before indicating the file you want to link to. This is done by specifying the directory's name, then a forward slash, then the name of the file. The URL you can use is `projects/index.html`:

          ```html
          <p>Visit my <a href="projects/index.html">project homepage</a>.</p>
          ```
        verbatim: true
        lines:
          - 262
          - 266
      - id: up-a-directory
        text: |-
          If you want to include a hyperlink inside `projects/index.html` pointing to `pdfs/project-brief.pdf`, you have to go up a directory level, then back down into the `pdfs` directory. To go up a directory, you use two dots — `..` — so the URL is `../pdfs/project-brief.pdf`:

          ```html
          <p>A link to my <a href="../pdfs/project-brief.pdf">project brief</a>.</p>
          ```

          > [!NOTE]
          > You can combine multiple instances of these features into complex paths, if needed, for example: `../../../complex/path/to/my/file.html`.
        verbatim: true
        lines:
          - 270
          - 277
      - id: root-relative
        text: |-
          The above URLs work, but bear in mind that if you move either the linking file or the linked file to a different location, you will break the link.

          If you want to create a link to a specific location that won't break if you move the linking file, you can do so by putting a single slash at the start of the path — this indicates that the path starts in the root directory of the site. For example, the previous link inside `projects/index.html` could be rewritten as:

          ```html
          <p>A link to my <a href="/pdfs/project-brief.pdf">project brief</a>.</p>
          ```

          Now the path will always start from the root directory (`creating-hyperlinks`), travel to the `pdfs` directory, and find the `project-brief.pdf` file. This will still work if you move the linking file to a different location, for example `a/b/c/d/e/index.html`.

          If you move the linked `project-brief.pdf` file to a different location, you will still break the link.
        verbatim: true
        lines:
          - 281
          - 291
      - id: absolute-relative
        text: |-
          Two terms you'll come across on the web are **absolute path** and **relative path**.

          - Absolute path: Points to a location defined by its absolute location in your site (or elsewhere on the web). For example, you can create an absolute link that always points to the same location relative to the site root directory using the single slash at the start of the path, as we saw earlier: `/pdfs/project-brief.pdf`.
          - Relative path: Points to a location that is _relative_ to the file you are linking from. In our earlier example, we used `projects/index.html` to create a relative link between the current file and a file called `index.html` that is inside a `projects` subdirectory. If you were to move the current file to a different location, the path would still be relative to that file, but it would point to a different absolute location.

          These terms are not always used consistently. For example, `/pdfs/project-brief.pdf` is absolute with respect to the current file's location, but relative to the [domain name](/en-US/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_domain_name). A URL that includes the full domain name, such as `https://example.com/pdfs/project-brief.pdf`, is absolute with respect to the entire web.
        verbatim: true
        lines:
          - 293
          - 298
      - id: internal-external
        text: |-
          When a link points to a resource on _your_ site, it is referred to as an **internal link**. When a link points to a resource on a _different_ site, it is called an **external link**.

          When specifying an external link, you always have to include the full URL as the path, for example:

          ```html
          <a href="https://www.some-other-site.com">projects</a>
          ```

          You can't reference a location on a different site with a path like `/pdfs/project-brief.pdf` or `projects/index.html`, as they are both relative to a location on your own site, and the browser needs the website's domain name to be able to find it.

          When specifying an internal link, you can use a relative or absolute path, or a full URL. In our example, these links are equivalent:

          ```html
          <a href="https://www.example.com/projects/">projects</a>

          <a href="projects">projects</a>
          ```

          We recommend the latter without the full domain name, because of portability. As we said earlier, if you specify `https://www.example.com/projects/`, it will always link to `https://www.example.com/projects/`. If you then move your website to a different domain, for example `another-example.com`, your full URL links will all need to be changed. If you specify paths such as `/projects`, they will still work, as they are still relative to the directory structure.
        verbatim: true
        lines:
          - 312
          - 330
      - id: fragment
        text: |-
          It's possible to link to a specific part of an HTML document, known as a **document fragment**, rather than just to the top of the document.
          Elements with an [`id`](/en-US/docs/Web/HTML/Reference/Global_attributes/id) attribute in the document automatically create a document fragment that can be linked to.

          The most typical use case is linking to a specific heading, which looks like this:

          ```html
          <h2 id="mailing_address">Mailing address</h2>
          ```
        verbatim: true
        lines:
          - 334
          - 341
      - id: fragment-hash
        text: |-
          To link to that specific `id`, you include it at the end of the path, preceded by a hash/pound symbol (`#`), for example:

          ```html
          <p>
            Want to write us a letter? Use our
            <a href="contacts.html#mailing_address">mailing address</a>.
          </p>
          ```
        verbatim: true
        lines:
          - 343
          - 350
      - id: fragment-same-page
        text: |-
          You can even use the document fragment reference on its own to link to _another part of the current document_:

          ```html
          <p>
            The <a href="#mailing_address">company mailing address</a> can be found at the
            bottom of this page.
          </p>
          ```
        verbatim: true
        lines:
          - 352
          - 359
      - id: url-resolution
        text: |-
          If we start a web server (see [How do you set up a local testing server?](/en-US/docs/Learn_web_development/Howto/Tools_and_setup/set_up_a_local_testing_server)) using our sample site directory as the root, and the website {{glossary("domain name")}} is set to `example.com`, our `pdfs/project-brief.pdf` file would be available at `https://www.example.com/pdfs/project-brief.pdf`.

          All links are resolved relative to the current document's URL, so:

          - For all pages on the `https://example.com` domain, a link to `/pdfs/project-brief.pdf` always creates a link to `https://www.example.com/pdfs/project-brief.pdf`, whose pathname is `/pdfs/project-brief.pdf`. The server looks for the `pdfs` directory in the root directory, then looks for the `project-brief.pdf` file inside that directory.
          - A link to `projects/index.html` would create a link to `https://www.example.com/projects/index.html`, but only when included in a file inside the root directory, such as the top-level `index.html` file, or `contacts.html`. If you included it, for example, inside an HTML file at `pdfs/index.html`, it would link to `https://www.example.com/pdfs/projects/index.html`, whose path name is `/pdfs/projects/index.html`, which doesn't exist, so you'd end up with a broken link.
        verbatim: true
        lines:
          - 372
          - 377
      - id: trailing-slash
        text: |-
          > [!NOTE]
          > The trailing slash (`/`) at the end of the URL is important. With it, a relative link to `contacts.html` inside `projects/index.html` would resolve to `https://www.example.com/projects/contacts.html` (which is in the same directory). Without it, the URL would be treated as a file, and the relative link would resolve to `https://www.example.com/contacts.html` (which is one directory up).
          >
          > [Different web servers handle a URL like `https://www.example.com/projects` differently](https://github.com/slorber/trailing-slash-guide) — some automatically redirect to the URL with a trailing slash, while some serve the same `index.html` without redirecting. The latter behavior can break relative links.
        verbatim: true
        lines:
          - 385
          - 388
      - id: accessible-links
        text: |-
          It's easy to throw links up on your page. That's not enough. We need to make our links _accessible_ to all readers, regardless of their current context and which tools they prefer. For example:

          - Screen reader users like jumping around from link to link on the page, and reading links out of context.
          - Search engines use link text to index target files, so it is a good idea to include keywords in your link text to effectively describe what is being linked to.
          - Visual readers skim over the page rather than reading every word, and their eyes will be drawn to page features that stand out, like links. They will find descriptive link text useful.
        verbatim: true
        lines:
          - 396
          - 400
      - id: link-tips
        text: |-
          - Don't repeat the URL as part of the link text — URLs look ugly, and sound even uglier when a screen reader reads them out letter by letter.
          - Don't say "link" or "links to" in the link text — it's just noise. Screen readers tell people there's a link.
            Visual users will also know there's a link, because links are generally styled in a different color and underlined (this convention generally shouldn't be broken, as users are used to it).
          - Keep your link text as short as possible — this is helpful because screen readers need to interpret the entire link text.
          - Minimize instances where multiple copies of the same text are linked to different places.
            This can cause problems for screen reader users, if there's a list of links out of context that are labeled "click here", "click here", "click here".
        verbatim: true
        lines:
          - 424
          - 429
      - id: signposts
        text: |-
          When linking to a resource that will not be opened in the current page as a "normal navigation", you should add clear wording to the link text about what is going to happen. For example, if you're downloading or streaming a resource, or if the link is going to open a popup or perform some other potentially unexpected effect, this should be stated in the text. This is important for users on low bandwidth connections, who might want to avoid downloading assets of multiple megabytes. It also helps to set up expectations for screen reader users, who may not be aware of what's happening otherwise.

          Let's look at some examples, to see what kind of text can be used here:

          ```html
          <p>
            <a href="/large-report.pdf" download>
              Download the sales report (PDF, 10MB)
            </a>
          </p>

          <p>
            <a href="https://www.example.com/video-stream/" target="_blank">
              Watch the video (stream opens in separate tab, HD quality)
            </a>
          </p>
          ```
        verbatim: true
        lines:
          - 433
          - 449
      - id: download
        text: |-
          When you are linking to a resource that's to be downloaded rather than opened in the browser, you can use the `download` attribute to provide a default save filename. Here's an example with a download link to the latest Windows version of Firefox:

          ```html
          <a
            href="https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US"
            download="firefox-latest-64bit-installer.exe">
            Download Latest Firefox for Windows (64-bit) (English, US)
          </a>
          ```
        verbatim: true
        lines:
          - 453
          - 461
      - id: new-tab
        text: |-
          Links by default open in the same tab as the page they are on, which allows the user to navigate back to the previous page using the browser's back button. However, many sites (including MDN) choose to open certain links, especially external links, in a new tab. This is done by setting the [`target`](/en-US/docs/Web/HTML/Reference/Elements/a#target) attribute to `"_blank"`.

          ```html
          Firefox is developed by the
          <a href="https://www.mozilla.org/en-US/" target="_blank">Mozilla Foundation</a>.
          ```

          Whether or not to open links in a new tab should be a conscious decision, based on user experience design considerations. Here are some things to think about:

          - Opening links in a new tab presents the two documents simultaneously, which is useful for a "parallel" navigation experience. On the other hand, links that open in the same tab are more like a continuation of the current page.
          - Opening links in a new tab can be disorienting for users who are accustomed to using the back button.
          - Even when links are opened in the same tab by default, users can still choose to open them in a new tab, using keyboard shortcuts or context menu options. On the other hand, links that open in a new tab are hard to open in the same tab.
          - Screen reader users may be confused by links that open in a new tab, as they may not realize that the new tab has opened, and they may lose context about their location on the page.

          A common approach is to open external links in new tabs and internal links in the same tab.
          Some designers prefer to open all links in the same tab.
          If you do open links in new tabs, then it is recommended that you provide cues for these links, such as an icon next to the link text.
        verbatim: true
        lines:
          - 465
          - 481
      - id: nav-menu
        text: For this exercise, we'd like you to link some pages together with a navigation menu to create a multipage website. This is one common way in which a website is created — the same page structure is used on every page, including the same navigation menu, so when links are clicked it gives the impression that you are staying in the same place, and different content is being brought up.
        verbatim: true
        lines:
          - 485
          - 485
      - id: nav-list
        text: |-
          You should:

          1. Add an unordered list in the indicated place on one page that includes the names of the pages to link to.
             A navigation menu is usually just a list of links, so this is semantically OK.
          2. Change each page name into a link to that page.
          3. Copy the navigation menu across to each page.
          4. On each page, remove just the link to that same page — it's confusing and unnecessary for a page to include a link to itself.
             And, the lack of a link acts a good visual reminder of which page you are currently on.
        verbatim: true
        lines:
          - 494
          - 501
      - id: mailto
        text: |-
          It's possible to create links or buttons that, when clicked, open a new outgoing email message rather than linking to a resource or page.
          This is done using the {{HTMLElement("a")}} element and the `mailto:` URL scheme.

          In its most basic and commonly used form, a `mailto:` link indicates the email address of the intended recipient. For example:

          ```html
          <a href="mailto:nowhere@mozilla.org">Send email to nowhere</a>
          ```
        verbatim: true
        lines:
          - 512
          - 519
      - id: mailto-empty
        text: |-
          In fact, the email address is optional. If you omit it and your [`href`](/en-US/docs/Web/HTML/Reference/Elements/a#href) is "mailto:", a new outgoing email window will be opened by the user's email client with no destination address.
          This is often useful as "Share" links that users can click to send an email to an address of their choosing.
        verbatim: true
        lines:
          - 523
          - 524
      - id: mailto-details
        text: |-
          In addition to the email address, you can provide other information. In fact, any standard mail header fields can be added to the `mailto` URL you provide.
          The most commonly used of these are "subject", "cc", and "body" (which is not a true header field, but allows you to specify a short content message for the new email).
          Each field and its value is specified as a query term.

          Here's an example that includes a cc, bcc, subject and body:

          ```html
          <a
            href="mailto:nowhere@mozilla.org?cc=name2@rapidtables.com&bcc=name3@rapidtables.com&subject=The%20subject%20of%20the%20email&body=The%20body%20of%20the%20email">
            Send mail with cc, bcc, subject and body
          </a>
          ```
        verbatim: true
        lines:
          - 528
          - 539
      - id: mailto-encoding
        text: |-
          > [!NOTE]
          > The values of each field must be URL-encoded with non-printing characters (invisible characters like tabs, carriage returns, and page breaks) and spaces {{Glossary("Percent-encoding", "percent-escaped")}}.
          > Also, note the use of the question mark (`?`) to separate the main URL from the field values, and ampersands (&) to separate each field in the `mailto:` URL.
          > This is standard URL query notation.
          > Read [The GET method](/en-US/docs/Learn_web_development/Extensions/Forms/Sending_and_retrieving_form_data#the_get_method) to understand what URL query notation is more commonly used for.
        verbatim: true
        lines:
          - 541
          - 545
  - id: debugging-html
    title: Debugging HTML
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Debugging_HTML
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/learn_web_development/core/structuring_content/debugging_html/index.md
    excerpts:
      - id: error-types
        text: |-
          - **Syntax errors**: These are typos in your code that cause the program not to run, like the Rust error shown earlier. These are usually easy to fix as long as you are familiar with the language's syntax and know what the error messages mean.
          - **Logic errors**: These are errors where the syntax is actually correct, but the code is not doing what you intended it to, meaning that the program runs incorrectly. These are often harder to fix than syntax errors, as there isn't an error message to direct you to the source of the error.
        verbatim: true
        lines:
          - 60
          - 61
      - id: permissive
        text: |-
          HTML itself doesn't suffer from syntax errors because browsers parse it permissively, meaning that the page still displays even if there are syntax errors in the source code. Browsers have built-in rules to state how to interpret incorrectly-written HTML markup (often called **invalid** or **badly-formed** markup), changing it automatically to some valid markup.

          For example, the following HTML snippet contains incorrectly nested elements:

          ```html example-bad
          <p>I didn't expect to find the <em>next-door neighbor's <strong>cat</em></strong> here!</p>
          ```

          The closing `</strong>` tag should be before the closing `</em>` tag, but it is not — it is after it.

          If you load this HTML into a browser then look at the [rendered DOM](/en-US/docs/Learn_web_development/Getting_started/Web_standards/How_browsers_load_websites#handling_html), you'll see that the nesting has been corrected by the browser:

          ```html example-good
          <p>
            I didn't expect to find the
            <em>next-door neighbor's <strong>cat</strong></em> here!
          </p>
          ```

          So why is this both good and bad? Well, in this case the browser has created the intended result, but as you'll see [later on](#your_turn_studying_html_using_the_dom_inspector), this is not always the case. You'll always get _something_ running, but the browser doesn't always get it right, which can cause problems. It is better to write correct markup in the first place.
        verbatim: true
        lines:
          - 63
          - 82
      - id: dom-inspector
        text: |-
          For this article, the only relevant devtools function is the **DOM inspector**, which shows the currently-rendered HTML DOM and allows you to edit it. Let's look at this now:

          1. Open the devtools in your browser.
          2. Open the DOM inspector. It is in the same place in each browser — the first tab in the devtools at the start of the row. In Firefox it is labeled _Inspector_, while in Safari, Edge, and Chrome it is labeled _Elements_. This should be the tab selected by default when you first open the devtools, but select it if it isn't.
          3. Examine the DOM tree structure shown in the tab, and note how you can click the little expansion arrows at the start of each DOM node to expand and collapse them and reveal their descendant nodes. You can also use the up and down cursor keys to move up and down the nodes, and the right and left cursor keys to expand and collapse the nodes.
          4. Also try hovering over the nodes (or selecting them with the cursor keys) and note how the currently-hovered (or selected) element is highlighted in the viewport.
        verbatim: true
        lines:
          - 95
          - 100
      - id: validator
        text: The tool for this job is the [Markup Validation Service](https://validator.w3.org/) (or **HTML validator**), which is created and maintained by the W3C (which you learned about in [The web standards model](/en-US/docs/Learn_web_development/Getting_started/Web_standards/The_web_standards_model)). The validator takes an HTML document as an input, goes through it, and gives you a report to tell you what is wrong with your HTML.
        verbatim: true
        lines:
          - 186
          - 186
      - id: line-numbers
        text: The error messages are usually helpful, but sometimes they are not so easy to understand. With a bit of practice, you can work out how to interpret these to fix your code. Let's go through the error messages and see what they mean. You'll see that each message comes with a line and column number to help you to locate the error easily.
        verbatim: true
        lines:
          - 207
          - 207
      - id: fix-a-few
        text: If you can't work out what every error message means, don't worry about it. A good strategy is to fix a few errors at a time, then revalidate your HTML after each set of fixes to show what errors are left. Sometimes, fixing an earlier error will also get rid of other error messages — several errors can often be caused by a single problem, in a domino effect.
        verbatim: true
        lines:
          - 224
          - 224
  - id: accessible-html
    title: "HTML: A good basis for accessibility"
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Accessibility/HTML
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/learn_web_development/core/accessibility/html/index.md
    excerpts:
      - id: posh
        text: "As you learn more about HTML — read more resources, look at more examples, etc. — you'll keep seeing a common theme: the importance of using semantic HTML (sometimes called POSH, or Plain Old Semantic HTML). This means using the correct HTML elements for their intended purpose as much as possible."
        verbatim: true
        lines:
          - 36
          - 36
      - id: button-keyboard
        text: |-
          You might wonder why this is so important. After all, you can use a combination of CSS and JavaScript to make just about any HTML element behave in whatever way you want. For example, a control button to play a video on your site could be marked up like this:

          ```html
          <div>Play video</div>
          ```

          But as you'll see in greater detail later on, it makes sense to use the correct element for the job:

          ```html
          <button>Play video</button>
          ```

          Not only do HTML `<button>`s have some suitable styling applied by default (which you will probably want to override), they also have built-in keyboard accessibility — users can navigate between buttons using the <kbd>Tab</kbd> key and activate their selection using <kbd>Space</kbd>, <kbd>Return</kbd> or <kbd>Enter</kbd>.
        verbatim: true
        lines:
          - 38
          - 50
      - id: other-benefits
        text: |-
          Semantic HTML doesn't take any longer to write than non-semantic (bad) markup if you do it consistently from the start of your project. Even better, semantic markup has other benefits beyond accessibility:

          1. **Easier to develop with** — as mentioned above, you get some functionality for free, plus it is arguably easier to understand.
          2. **Better on mobile** — semantic HTML is arguably lighter in file size than non-semantic spaghetti code, and easier to make responsive.
          3. **Good for SEO** — search engines give more importance to keywords inside headings, links, etc. than keywords included in non-semantic `<div>`s, etc., so your documents will be more findable by customers.
        verbatim: true
        lines:
          - 52
          - 56
      - id: not-all-or-nothing
        text: The goal isn't "all or nothing"; every improvement you can make will help the cause of accessibility.
        verbatim: true
        lines:
          - 68
          - 68
      - id: text-structure
        text: |-
          One of the best accessibility aids a screen reader user can have is an excellent text structure with headings, paragraphs, lists, etc. A good semantic example might look something like the following:

          ```html example-good
          <h1>My heading</h1>

          <p>This is the first section of my document.</p>

          <p>I'll add another paragraph here too.</p>

          <ol>
            <li>Here is</li>
            <li>a list for</li>
            <li>you to read</li>
          </ol>

          <h2>My subheading</h2>

          <p>
            This is the first subsection of my document. I'd love people to be able to
            find this content!
          </p>

          <h2>My 2nd subheading</h2>

          <p>
            This is the second subsection of my content, which I think is more interesting
            than the last one.
          </p>
          ```
        verbatim: true
        lines:
          - 72
          - 100
      - id: screen-reader-navigation
        text: |-
          We've prepared a version with longer text for you to try out with a screen reader (see [good-semantics.html](https://mdn.github.io/learning-area/accessibility/html/good-semantics.html)). If you try navigating through this, you'll see that this is pretty easy to navigate:

          1. The screen reader reads each header out as you progress through the content, notifying you what a heading is, what is a paragraph, etc.
          2. It stops after each element, letting you go at whatever pace is comfortable for you.
          3. You can jump to the next/previous heading in many screen readers.
          4. You can also bring up a list of all headings in many screen readers, allowing you to use them as a handy table of contents to find specific content.
        verbatim: true
        lines:
          - 102
          - 107
      - id: bad-semantics
        text: |-
          People sometimes write headings, paragraphs, etc. using line breaks and adding HTML elements purely for styling, something like the following:

          ```html example-bad
          <span style="font-size: 3em">My heading</span> <br /><br />
          This is the first section of my document.
          <br /><br />
          I'll add another paragraph here too.
          <br /><br />
          1. Here is
          <br /><br />
          2. a list for
          <br /><br />
          3. you to read
          <br /><br />
          <span style="font-size: 2.5em">My subheading</span>
          <br /><br />
          This is the first subsection of my document. I'd love people to be able to find
          this content!
          <br /><br />
          <span style="font-size: 2.5em">My 2nd subheading</span>
          <br /><br />
          This is the second subsection of my content. I think is more interesting than
          the last one.
          ```

          If you try our longer version out with a screen reader (see [bad-semantics.html](https://mdn.github.io/learning-area/accessibility/html/bad-semantics.html)), you'll not have a very good experience — the screen reader hasn't got anything to use as signposts, so you can't retrieve a useful table of contents, and the whole page is seen as a single giant block, so it is just read out in one go, all at once.
        verbatim: true
        lines:
          - 109
          - 134
      - id: clear-language
        text: |-
          The language you use can also affect accessibility. In general, you should use clear language that is not overly complex and doesn't use unnecessary jargon or slang terms. This not only benefits people with cognitive or other disabilities; it benefits readers for whom the text is not written in their first language, younger people…, everyone, in fact! Apart from this, you should try to avoid using language and characters that don't get read out clearly by the screen reader. For example:

          - Don't use dashes if you can avoid it. Instead of writing 5–7, write 5 to 7.
          - Expand abbreviations — instead of writing Jan, write January.
          - Expand acronyms, at least once or twice, then use the [`<abbr>`](/en-US/docs/Web/HTML/Reference/Elements/abbr) tag to describe them.
        verbatim: true
        lines:
          - 140
          - 144
      - id: sectioning
        text: |-
          You should use appropriate [sectioning elements](/en-US/docs/Web/HTML/Reference/Elements#content_sectioning) to structure your webpages, for example navigation ({{htmlelement("nav")}}), footer ({{htmlelement("footer")}}), and repeating content units ({{htmlelement("article")}}). These provide extra semantics for screen readers (and other tools) to give users extra clues about the content they are navigating.

          For example, a modern content structure could look something like this:

          ```html
          <header>
            <h1>Header</h1>
          </header>

          <nav>
            <!-- main navigation in here -->
          </nav>

          <!-- Here is our page's main content -->
          <main>
            <!-- It contains an article -->
            <article>
              <h2>Article heading</h2>

              <!-- article content in here -->
            </article>

            <aside>
              <h2>Related</h2>

              <!-- aside content in here -->
            </aside>
          </main>

          <!-- And here is our main footer that is used across all the pages of our website -->

          <footer>
            <!-- footer content in here -->
          </footer>
          ```
        verbatim: true
        lines:
          - 148
          - 182
      - id: source-order
        text: In addition to having good semantics and an attractive layout, your content should make logical sense in its source order — you can always place it where you want using CSS later on, but you should get the source order right to start with, so what screen reader users get read out to them will make sense.
        verbatim: true
        lines:
          - 186
          - 186
      - id: keyboard-default
        text: One key aspect of the accessibility of UI controls is that by default, browsers allow them to be manipulated by the keyboard. You can try this out using our [native-keyboard-accessibility.html](https://mdn.github.io/learning-area/tools-testing/cross-browser-testing/accessibility/native-keyboard-accessibility.html) example (see the [source code](https://github.com/mdn/learning-area/blob/main/tools-testing/cross-browser-testing/accessibility/native-keyboard-accessibility.html)). Open this in a new tab, and try pressing the tab key; after a few presses, you should see the tab focus start to move through the different focusable elements. The focused elements are given a highlighted default style in every browser (it differs slightly between different browsers) so that you can tell what element is focused.
        verbatim: true
        lines:
          - 192
          - 192
      - id: div-buttons
        text: |-
          However, this is another case where people sometimes do strange things with HTML. For example, you sometimes see buttons marked up using {{htmlelement("div")}}s, for example:

          ```html example-bad
          <div data-message="This is from the first button">Click me!</div>
          <div data-message="This is from the second button">Click me too!</div>
          <div data-message="This is from the third button">And me!</div>
          ```

          But using such code is not advised — you immediately lose the native keyboard accessibility you would have had if you'd just used {{htmlelement("button")}} elements, plus you don't get any of the default CSS styling that buttons get. In the rare to non-existent case when you need to use a non-button element for a button, use the [`button` role](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/button_role) and implement all the default button behaviors, including keyboard and mouse button support.
        verbatim: true
        lines:
          - 246
          - 254
      - id: fake-button-fix
        text: |-
          Adding such advantages back in takes a bit of work (you can see an example in our [fake-div-buttons.html](https://mdn.github.io/learning-area/tools-testing/cross-browser-testing/accessibility/fake-div-buttons.html) example — also see the [source code](https://github.com/mdn/learning-area/blob/main/tools-testing/cross-browser-testing/accessibility/fake-div-buttons.html)). Here we've given our fake `<div>` buttons the ability to be focused (including via tab) by giving each one the attribute `tabindex="0"`. We also include `role="button"` so screen reader users know they can focus on and interact with the element:

          ```html
          <div data-message="This is from the first button" tabindex="0" role="button">
            Click me!
          </div>
          <div data-message="This is from the second button" tabindex="0" role="button">
            Click me too!
          </div>
          <div data-message="This is from the third button" tabindex="0" role="button">
            And me!
          </div>
          ```

          Basically, the [`tabindex`](/en-US/docs/Web/HTML/Reference/Global_attributes/tabindex) attribute is primarily intended to allow tabbable elements to have a custom tab order (specified in positive numerical order), instead of just being tabbed through in their default source order. This is nearly always a bad idea, as it can cause major confusion. Use it only if you really need to, for example, if the layout shows things in a very different visual order to the source code, and you want to make things work more logically. There are two other options for `tabindex`:

          - `tabindex="0"` — as indicated above, this value allows elements that are not normally tabbable to become tabbable. This is the most useful value of `tabindex`.
          - `tabindex="-1"` — this allows not normally tabbable elements to receive focus programmatically, e.g., via JavaScript, or as the target of links.

          While the above addition allows us to tab to the buttons, it does not allow us to activate them via the <kbd>Enter</kbd>/<kbd>Return</kbd> key. To do that, we had to add the following bit of JavaScript:

          ```js
          document.onkeydown = (e) => {
            // The Enter/Return key
            if (e.key === "Enter") {
              document.activeElement.click();
            }
          };
          ```

          Here we add a listener to the `document` object to detect when a button has been pressed on the keyboard. We check what button was pressed via the event object's [`key`](/en-US/docs/Web/API/KeyboardEvent/key) property; if the key pressed is <kbd>Enter</kbd>/<kbd>Return</kbd>, we run the function stored in the button's `onclick` handler using `document.activeElement.click()`. [`activeElement`](/en-US/docs/Web/API/Document/activeElement) which gives us the element that is currently focused on the page.

          This is a lot of extra hassle to build the functionality back in. And there's bound to be other problems with it. **Better to just use the right element for the right job in the first place.**
        verbatim: true
        lines:
          - 258
          - 290
      - id: tabindex
        text: |-
          Basically, the [`tabindex`](/en-US/docs/Web/HTML/Reference/Global_attributes/tabindex) attribute is primarily intended to allow tabbable elements to have a custom tab order (specified in positive numerical order), instead of just being tabbed through in their default source order. This is nearly always a bad idea, as it can cause major confusion. Use it only if you really need to, for example, if the layout shows things in a very different visual order to the source code, and you want to make things work more logically. There are two other options for `tabindex`:

          - `tabindex="0"` — as indicated above, this value allows elements that are not normally tabbable to become tabbable. This is the most useful value of `tabindex`.
          - `tabindex="-1"` — this allows not normally tabbable elements to receive focus programmatically, e.g., via JavaScript, or as the target of links.
        verbatim: true
        lines:
          - 272
          - 275
      - id: meaningful-labels
        text: |-
          UI control text labels are very useful to all users, but getting them right is particularly important to users with disabilities.

          You should make sure that your button and link text labels are understandable and distinctive. Don't just use "Click here" for your labels, as screen reader users sometimes get up a list of buttons and form controls. The following screenshot shows our controls being listed by VoiceOver on Mac.
        verbatim: true
        lines:
          - 294
          - 296
      - id: labels-out-of-context
        text: |-
          Make sure your labels make sense out of context, read on their own, as well as in the context of the paragraph they are in. For example, the following shows an example of good link text:

          ```html example-good
          <p>
            Whales are really awesome creatures.
            <a href="whales.html">Find out more about whales</a>.
          </p>
          ```

          but this is bad link text:

          ```html example-bad
          <p>
            Whales are really awesome creatures. To find out more about whales,
            <a href="whales.html">click here</a>.
          </p>
          ```
        verbatim: true
        lines:
          - 300
          - 316
      - id: missing-alt
        text: |-
          The first image, when viewed by a screen reader, doesn't really offer the user much help — VoiceOver for example reads out "/dinosaur.png, image". It reads out the filename to try to provide some help. In this example the user will at least know it is a dinosaur of some kind, but often files may be uploaded with machine-generated file names (e.g., from a digital camera) and these file names would likely provide no context to the image's content.

          > [!NOTE]
          > This is why you should never include text content inside an image — screen readers can't access it. There are other disadvantages too — you can't select it and copy/paste it. Just don't do it!
        verbatim: true
        lines:
          - 416
          - 419
      - id: alt-content
        text: |-
          Note that the contents of the `alt` attribute should always provide a direct representation of the image and what it conveys visually. The alt should be brief and concise and include all the information conveyed in the image that is not duplicated in the surrounding text.

          The content of the `alt` attribute for a single image differs based on the context. For example, if the photo of Fluffy is an avatar next to a review for Yuckymeat dog food, `alt="Fluffy"` is appropriate. If the photo is part of Fluffy's adoption page for the animal rescue society, information conveyed in the image that is relevant for a prospective dog parent that is not duplicated in the surrounding text should be included. A longer description, such as `alt="Fluffy, a tri-color terrier with very short hair, with a tennis ball in her mouth."` is appropriate. As the surrounding text likely has Fluffy's size and breed, that is not included in the `alt`. However, as the dog's biography likely doesn't include hair length, colors, or toy preferences, which the potential parent needs to know, it is included. Is the image outdoors, or does Fluffy have a red collar with a blue leash? Not important in terms of adopting the pet and therefore not included. All information image conveys that a sighted user can access and is relevant to the context is what needs to be conveyed; nothing more. Keep it short, precise, and useful.

          Any personal knowledge or extra description shouldn't be included here, as it is not useful for people who have not seen the image before. If the ball is Fluffy's favorite toy or if a sighted user can't know that from the image, then don't include it.
        verbatim: true
        lines:
          - 425
          - 429
      - id: empty-alt
        text: |-
          ### Empty alt attributes

          ```html
          <h3>
            <img src="article-icon.png" alt="" />
            Tyrannosaurus Rex: the king of the dinosaurs
          </h3>
          ```

          There may be times where an image is included in a page's design, but its primary purpose is for visual decoration. You'll notice in the code example above that the image's `alt` attribute is empty — this is to make screen readers recognize the image, but not attempt to describe the image (instead they'd just say "image", or similar).

          The reason to use an empty `alt` instead of not including it is because many screen readers announce the whole image URL if no `alt` is provided. In the above example, the image is acting as a visual decoration to the heading it's associated with. In cases like this, and in cases where an image is only decoration and has no content value, you should include an empty `alt` in your `img` elements. Another alternative is to use the aria [`role`](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles) attribute [`role="presentation"`](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/presentation_role) as this also stops screen readers from reading out alternative text.

          > [!NOTE]
          > If possible you should use CSS to display images that are only decorative.
        verbatim: true
        lines:
          - 473
          - 487
      - id: link-styling
        text: |-
          By default, links are visually different from other text in both color and [text-decoration](/en-US/docs/Web/CSS/Reference/Properties/text-decoration), with links being blue and underlined by default, purple and underlined if visited, and with a [focus-ring](/en-US/docs/Web/CSS/Reference/Selectors/:focus) when they receive keyboard focus.

          Color should not be used as the sole method of distinguishing links from non-linking content. Link text color, like all text, has to be significantly different from the background color ([a 4.5:1 contrast](/en-US/docs/Web/Accessibility/Guides/Understanding_WCAG/Perceivable/Color_contrast)). In addition, links should visually be significantly different from non-linking text, with a minimum contrast requirement of 3:1 between link text and surrounding text and between default, visited, and focus/active states and a 4.5:1 contrast between all those state colors and the background color.
        verbatim: true
        lines:
          - 495
          - 497
      - id: fake-button-links
        text: |-
          Anchor tags are often abused with the `onclick` event to create pseudo-buttons by setting **href** to `"#"` or `"javascript:void(0)"` to prevent the page from refreshing.

          These values cause unexpected behavior when copying or dragging links, opening links in a new tab or window, bookmarking, and when JavaScript is still downloading, errors out, or is disabled. This also conveys incorrect semantics to assistive technologies (e.g., screen readers). In these cases, it is recommended to use a {{HTMLElement("button")}} instead. In general you should only use an anchor for navigation using a proper URL.
        verbatim: true
        lines:
          - 501
          - 503
      - id: new-tab-indicator
        text: |-
          Links that open in a new tab or window via the `target="_blank"` declaration and links to whose `href` value points to a file resource should include an indicator about the behavior that will occur when the link is activated.

          People experiencing low vision conditions, who are navigating with the aid of screen reading technology, or who have cognitive concerns may become confused when the new tab, window, or application is opened unexpectedly. Older versions of screen reading software may not even announce the behavior.

          #### Link that opens a new tab or window

          ```html
          <a target="_blank" href="https://www.wikipedia.org/"
            >Wikipedia (opens in a new window)</a
          >
          ```

          #### Link to a non-HTML resource

          ```html
          <a target="_blank" href="2017-annual-report.ppt"
            >2017 Annual Report (PowerPoint)</a
          >
          ```
        verbatim: true
        lines:
          - 507
          - 525
      - id: skip-link
        text: |-
          A skip link, also known as skipnav, is an `a` element placed as close as possible to the opening {{HTMLElement("body")}} element that links to the beginning of the page's main content. This link allows people to bypass content repeated throughout multiple pages on a website, such as a website's header and primary navigation.

          Skip links are especially useful for people who navigate with the aid of assistive technology such as switch control, voice command, or mouth sticks/head wands, where the act of moving through repetitive links can be a laborious task.
        verbatim: true
        lines:
          - 536
          - 538
