  - id: aria-labelledby
    title: "ARIA: aria-labelledby attribute"
    url: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-labelledby
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/accessibility/aria/reference/attributes/aria-labelledby/index.md
    excerpts:
      - id: name-override
        text: |-
          The purpose of `aria-labelledby` is the same as that of `aria-label`. It provides the user with a recognizable, accessible name for an interactive element. If an element has both attributes set, `aria-labelledby` will be used. `aria-labelledby` also takes precedence over most other methods of providing an accessible name, such as {{HTMLElement('label')}}, and the element's inner text. Note that {{domxref("Element.ariaLabelledByElements")}} has the highest precedence for setting the ARIA label.

          The `aria-labelledby` and [`aria-describedby`](/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-describedby) attributes both reference other elements to calculate text alternatives. `aria-labelledby` should reference brief text that provides the element with an accessible name. `aria-describedby` is used to reference longer content that provides a description. If there is no element in the DOM that provides a brief label appropriate for an accessible name for an interactive element, use `aria-label` to define the accessible name for an interactive element.
        verbatim: true
        lines:
          - 22
          - 24
  - id: aria-hidden
    title: "ARIA: aria-hidden attribute"
    url: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-hidden
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/accessibility/aria/reference/attributes/aria-hidden/index.md
    excerpts:
      - id: exposure
        text: |-
          The `aria-hidden` state indicates whether the element is exposed to an accessibility API.

          ## Description

          The `aria-hidden` attribute can be used to hide non-interactive content from the accessibility API.

          Adding `aria-hidden="true"` to an element removes that element and all of its children from the accessibility tree. This can improve the experience for assistive technology users by hiding:

          - Purely decorative content, such as icons or images
          - Duplicated content, such as repeated text
          - Offscreen or collapsed content, such as menus

          The presence of the `aria-hidden` attribute hides content from assistive technology but doesn't visually hide anything.
        verbatim: true
        lines:
          - 10
          - 22
  - id: el-fieldset
    title: <fieldset> HTML field set element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/fieldset
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
