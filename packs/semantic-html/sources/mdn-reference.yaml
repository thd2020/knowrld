sources:
  - id: el-headings
    title: <h1>–<h6> HTML section heading elements
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/Heading_Elements
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/heading_elements/index.md
    excerpts:
      - id: usage
        text: |-
          - Heading information can be used by user agents to construct a table of contents for a document automatically.
          - Do not use heading elements to resize text. Instead, use the {{glossary("CSS")}} {{cssxref("font-size")}} property.
          - Do not skip heading levels: always start from `<h1>`, followed by `<h2>` and so on.
        verbatim: true
        lines:
          - 67
          - 69
      - id: single-h1
        text: |-
          While using multiple `<h1>` elements on one page is allowed by the HTML standard (as long as they are not [nested](#nesting)), this is not considered a best practice. A page should generally have a single `<h1>` element that describes the content of the page (similar to the document's [`<title>`](/en-US/docs/Web/HTML/Reference/Elements/title) element).

          > [!NOTE]
          > Nesting multiple `<h1>` elements in nested [sectioning elements](/en-US/docs/Web/HTML/Reference/Elements#content_sectioning) was allowed in older versions of the HTML standard. However, this was never considered a best practice and is now non-conforming. Read more in [There Is No Document Outline Algorithm](https://adrianroselli.com/2016/08/there-is-no-document-outline-algorithm.html).

          Prefer using only one `<h1>` per page and [nest headings](#nesting) without skipping levels.
        verbatim: true
        lines:
          - 73
          - 78
      - id: skip-levels
        text: A common navigation technique for users of screen reading software is to quickly jump from heading to heading in order to determine the content of the page. Because of this, it is important to not skip one or more heading levels. Doing so may create confusion, as the person navigating this way may be left wondering where the missing heading is.
        verbatim: true
        lines:
          - 106
          - 106
      - id: headings-list
        text: Headings may be nested as subsections to reflect the organization of the content of the page. Most screen readers can also generate an ordered list of all the headings on a page, which can help a person quickly determine the content hierarchy and navigate to different headings.
        verbatim: true
        lines:
          - 126
          - 126
      - id: labeled-sections
        text: |-
          Another common navigation technique for users of screen reading software is to generate a list of [sectioning content](/en-US/docs/Web/HTML/Reference/Elements#content_sectioning) and use it to determine the page's layout.

          Sectioning content can be labeled using a combination of the [`aria-labelledby`](/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-labelledby) and [`id`](/en-US/docs/Web/HTML/Reference/Global_attributes/id) attributes, with the label concisely describing the purpose of the section. This technique is useful for situations where there is more than one sectioning element on the same page.
        verbatim: true
        lines:
          - 189
          - 191
      - id: labeled-sections-example
        text: |-
          ```html
          <header>
            <nav aria-labelledby="primary-navigation">
              <h2 id="primary-navigation">Primary navigation</h2>
              <!-- navigation items -->
            </nav>
          </header>

          <!-- page content -->

          <footer>
            <nav aria-labelledby="footer-navigation">
              <h2 id="footer-navigation">Footer navigation</h2>
              <!-- navigation items -->
            </nav>
          </footer>
          ```

          {{EmbedLiveSample('Sectioning_content_examples')}}

          In this example, screen reading technology would announce that there are two {{HTMLElement("nav")}} sections, one called "Primary navigation" and one called "Footer navigation". If labels were not provided, the person using screen reading software may have to investigate each `nav` element's contents to determine their purpose.
        verbatim: true
        lines:
          - 195
          - 215
  - id: el-header
    title: <header> HTML header element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/header
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/header/index.md
    excerpts:
      - id: banner-or-section
        text: |-
          When not nested within [sectioning content](/en-US/docs/Web/HTML/Guides/Content_categories#sectioning_content), {{htmlelement("main")}}, or an element with the same ARIA role as these elements' implicit ARIA role, then the `<header>` element has an identical meaning to the site-wide [`banner`](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/banner_role) landmark role. It defines a global site header, which usually includes a logo, company name, search feature, and possibly the global navigation or a slogan. It is generally located at the top of the page.

          Otherwise, when nested within said elements, it loses its landmark status and represents a group of introductory or navigational aids for the surrounding section. It usually contains the surrounding section's heading (an `h1` – `h6` element) and optional subheading, but this is **not** required.
        verbatim: true
        lines:
          - 57
          - 59
  - id: el-footer
    title: <footer> HTML footer element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/footer
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/footer/index.md
    excerpts:
      - id: summary
        text: The **`<footer>`** [HTML](/en-US/docs/Web/HTML) element represents a footer for its nearest ancestor [sectioning content](/en-US/docs/Web/HTML/Guides/Content_categories#sectioning_content) or [sectioning root](/en-US/docs/Web/HTML/Reference/Elements/Heading_Elements#labeling_section_content) element. A `<footer>` typically contains information about the author of the section, copyright data or links to related documents.
        verbatim: true
        lines:
          - 10
          - 10
      - id: usage
        text: |-
          - Enclose information about the author in an {{HTMLElement("address")}} element that can be included into the `<footer>` element.
          - When the nearest ancestor sectioning content or sectioning root element is the body element the footer applies to the whole page.
        verbatim: true
        lines:
          - 50
          - 51
  - id: el-main
    title: <main> HTML main element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/main
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/main/index.md
    excerpts:
      - id: only-one
        text: A document mustn't have more than one `<main>` element that doesn't have the [`hidden`](/en-US/docs/Web/HTML/Reference/Global_attributes/hidden) attribute specified.
        verbatim: true
        lines:
          - 44
          - 44
      - id: unique-content
        text: The content of a `<main>` element should be unique to the document. Content that is repeated across a set of documents or document sections such as sidebars, navigation links, copyright information, site logos, and search forms shouldn't be included unless the search form is the main function of the page.
        verbatim: true
        lines:
          - 46
          - 46
      - id: landmark
        text: The `<main>` element behaves like a [`main` landmark](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/main_role) role. [Landmarks](/en-US/docs/Web/Accessibility/ARIA/Guides/Techniques#landmark_roles) can be used by assistive technology to quickly identify and navigate to large sections of the document. Prefer using the `<main>` element over declaring `role="main"`, unless there are [legacy browser support concerns](#browser_compatibility).
        verbatim: true
        lines:
          - 54
          - 54
      - id: skip-target
        text: |-
          Skip navigation, also known as "skipnav", is a technique that allows an assistive technology user to quickly bypass large sections of repeated content (main navigation, info banners, etc.). This lets the user access the main content of the page faster.

          Adding an [`id`](/en-US/docs/Web/HTML/Reference/Global_attributes/id) attribute to the `<main>` element lets it be a target of a skip navigation link.
        verbatim: true
        lines:
          - 58
          - 60
  - id: el-nav
    title: <nav> HTML navigation section element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/nav
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/nav/index.md
    excerpts:
      - id: summary
        text: The **`<nav>`** [HTML](/en-US/docs/Web/HTML) element represents a section of a page whose purpose is to provide navigation links, either within the current document or to other documents. Common examples of navigation sections are menus, tables of contents, and indexes.
        verbatim: true
        lines:
          - 10
          - 10
      - id: usage
        text: |-
          - It's not necessary for all links to be contained in a `<nav>` element. `<nav>` is intended only for a major block of navigation links; typically the {{HTMLElement("footer")}} element often has a list of links that don't need to be in a `<nav>` element.
          - A document may have several `<nav>` elements, for example, one for site navigation and one for intra-page navigation. [`aria-labelledby`](/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-labelledby) can be used in such case to promote accessibility, see [example](/en-US/docs/Web/HTML/Reference/Elements/Heading_Elements#labeling_section_content).
        verbatim: true
        lines:
          - 60
          - 61
  - id: el-section
    title: <section> HTML generic section element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/section
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/section/index.md
    excerpts:
      - id: summary
        text: The **`<section>`** [HTML](/en-US/docs/Web/HTML) element represents a generic standalone section of a document, which doesn't have a more specific semantic element to represent it. Sections should always have a heading, with very few exceptions.
        verbatim: true
        lines:
          - 10
          - 10
      - id: alternatives
        text: |-
          Also consider these cases:

          - If the contents of the element represent a standalone, atomic unit of content that makes sense syndicated as a standalone piece (e.g., a blog post or blog comment, or a newspaper article), the {{HTMLElement("article")}} element would be a better choice.
          - If the contents represent useful tangential information that works alongside the main content, but is not directly part of it (like related links, or an author bio), use an {{HTMLElement("aside")}}.
          - If the contents represent the main content area of a document, use {{HTMLElement("main")}}.
          - If you are only using the element as a styling wrapper, use a {{HTMLElement("div")}} instead.
        verbatim: true
        lines:
          - 48
          - 53
  - id: el-article
    title: <article> HTML article contents element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/article
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/article/index.md
    excerpts:
      - id: usage
        text: |-
          A given document can have multiple articles in it; for example, on a blog that shows the text of each article one after another as the reader scrolls, each post would be contained in an `<article>` element, possibly with one or more `<section>`s within.

          - Each `<article>` should be identified, typically by including a heading ([`<h1>` - `<h6>`](/en-US/docs/Web/HTML/Reference/Elements/Heading_Elements) element) as a child of the `<article>` element.
          - When an `<article>` element is nested, the inner element represents an article related to the outer element. For example, the comments of a blog post can be `<article>` elements nested in the `<article>` representing the blog post.
          - Author information of an `<article>` element can be provided through the {{HTMLElement("address")}} element, but it doesn't apply to nested `<article>` elements.
          - The publication date and time of an `<article>` element can be described using the [`datetime`](/en-US/docs/Web/HTML/Reference/Elements/time#datetime) attribute of a {{HTMLElement("time")}} element.
        verbatim: true
        lines:
          - 64
          - 69
  - id: el-aside
    title: <aside> HTML aside element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/aside
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/aside/index.md
    excerpts:
      - id: usage
        text: |-
          - Do not use the `<aside>` element to tag parenthesized text, as this kind of text is considered part of the main flow.
          - The `<aside>` element has an implicit role of [`complementary`](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/complementary_role), unless it has no {{glossary("accessible name")}} and is nested in [sectioning content](/en-US/docs/Web/HTML/Guides/Content_categories#sectioning_content), in which case it has the [`generic`](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/generic_role) role.
        verbatim: true
        lines:
          - 54
          - 55
  - id: el-em
    title: <em> HTML emphasis element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/em
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/em/index.md
    excerpts:
      - id: i-vs-em
        text: |-
          Some developers may be confused by how multiple elements seemingly produce similar visual results. `<em>` and `<i>` are a common example, since they both italicize text. What's the difference? Which should you use?

          By default, the visual result is the same. However, the semantic meaning is different. The `<em>` element represents stress emphasis of its contents, while the `<i>` element represents text that is set off from the normal prose, such as a foreign word, fictional character thoughts, or when the text refers to the definition of a word instead of representing its semantic meaning. (The title of a work, such as the name of a book or movie, should use `<cite>`.)

          This means the right one to use depends on the situation. Neither is for purely decorative purposes, that's what CSS styling is for.
        verbatim: true
        lines:
          - 40
          - 44
  - id: el-i
    title: <i> HTML idiomatic text element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/i
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/i/index.md
    excerpts:
      - id: uses
        text: |-
          - Use the `<i>` element for text that is set off from the normal prose for readability reasons. This would be a range of text with different semantic meaning than the surrounding text. Among the use cases for the `<i>` element are spans of text representing a different quality or mode of text, such as:
            - Alternative voice or mood
            - Taxonomic designations (such as the genus and species "_Homo sapiens_")
            - Idiomatic terms from another language (such as "_et cetera_"); these should include the [`lang`](/en-US/docs/Web/HTML/Reference/Global_attributes/lang) attribute to identify the language
            - Technical terms
            - Transliterations
            - Thoughts (such as "She wondered, _What is this writer talking about, anyway?_")
            - Ship or vessel names in Western writing systems (such as "They searched the docks for the _Empress of the Galaxy_, the ship to which they were assigned.")
        verbatim: true
        lines:
          - 40
          - 47
      - id: not-presentational
        text: '- In earlier versions of the HTML specification, the `<i>` element was merely a presentational element used to display text in italics, much like the `<b>` element was used to display text in bold letters. This is no longer true, as these tags now define semantics rather than typographic appearance. A browser will typically still display the contents of the `<i>` element in italic type, but is, by definition, no longer required to do so. To display text in italic type, authors should use the CSS {{cssxref("font-style")}} property.'
        verbatim: true
        lines:
          - 49
          - 49
  - id: el-strong
    title: <strong> HTML strong importance element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/strong
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/strong/index.md
    excerpts:
      - id: b-vs-strong
        text: |-
          It is often confusing to new developers why there are so many ways to express the same thing on a rendered website. {{HTMLElement("b")}} and `<strong>` are perhaps one of the most common sources of confusion, causing developers to ask "Should I use `<b>` or `<strong>`? Don't they both do the same thing?"

          Not exactly. The `<strong>` element is for content that is of greater importance, while the `<b>` element is used to draw attention to text without indicating that it's more important.
        verbatim: true
        lines:
          - 42
          - 44
      - id: meaning-decides
        text: The intended meaning or purpose of the enclosed text should be what determines which element you use. Communicating meaning is what semantics are all about.
        verbatim: true
        lines:
          - 48
          - 48
      - id: em-vs-strong
        text: While `<em>` is used to change the meaning of a sentence as spoken emphasis does ("I _love_ carrots" vs. "I love _carrots_"), `<strong>` is used to give portions of a sentence added importance (e.g., "**Warning!** This is **very dangerous.**") Both `<strong>` and `<em>` can be nested to increase the relative degree of importance or stress emphasis, respectively.
        verbatim: true
        lines:
          - 54
          - 54
  - id: el-b
    title: <b> HTML bring attention to element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/b
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/b/index.md
    excerpts:
      - id: uses
        text: |-
          - Use the `<b>` for cases like keywords in a summary, product names in a review, or other spans of text whose typical presentation would be boldfaced (but not including any special importance).
          - Do not confuse the `<b>` element with the {{HTMLElement("strong")}}, {{HTMLElement("em")}}, or {{HTMLElement("mark")}} elements. The {{HTMLElement("strong")}} element represents text of certain _importance_, {{HTMLElement("em")}} puts some emphasis on the text and the {{HTMLElement("mark")}} element represents text of certain _relevance_. The `<b>` element doesn't convey such special semantic information; use it only when no others fit.
          - Similarly, do not mark titles and headings using the `<b>` element. For this purpose, use the {{HTMLElement("Heading_Elements", "h1")}} to {{HTMLElement("Heading_Elements", "h6")}} tags. Further, stylesheets can change the default style of these elements, with the result that they are not _necessarily_ displayed in bold.
        verbatim: true
        lines:
          - 35
          - 37
  - id: el-u
    title: <u> HTML unarticulated annotation (underline) element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/u
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/u/index.md
    excerpts:
      - id: restored
        text: "Along with other pure styling elements, the original HTML Underline (`<u>`) element was deprecated in HTML 4; however, `<u>` was restored in HTML 5 with a new, semantic, meaning: to mark text as having some form of non-textual annotation applied."
        verbatim: true
        lines:
          - 44
          - 44
      - id: use-cases
        text: |-
          Valid use cases for the `<u>` element include annotating spelling errors, applying a [proper name mark](https://en.wikipedia.org/wiki/Proper_name_mark) to denote proper names in Chinese text, and other forms of annotation.

          You should _not_ use `<u>` to underline text for presentation purposes, or to denote titles of books.
        verbatim: true
        lines:
          - 51
          - 53
  - id: el-mark
    title: <mark> HTML mark text element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/mark
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/mark/index.md
    excerpts:
      - id: usage
        text: |-
          Typical use cases for `<mark>` include:

          - When used in a quotation ({{HTMLElement("q")}}) or block quote ({{HTMLElement("blockquote")}}), it generally indicates text which is of special interest but is not marked in the original source material, or material which needs special scrutiny even though the original author didn't think it was of particular importance. Think of this like using a highlighter pen in a book to mark passages that you find of interest.
          - Otherwise, `<mark>` indicates a portion of the document's content which is likely to be relevant to the user's current activity. This might be used, for example, to indicate the words that matched a search operation.
          - Don't use `<mark>` for syntax highlighting purposes; instead, use the {{HTMLElement("span")}} element with appropriate CSS applied to it.

          > [!NOTE]
          > Don't confuse `<mark>` with the {{HTMLElement("strong")}} element; `<mark>` is used to denote content which has a degree of _relevance_, while `<strong>` indicates spans of text of _importance_.
        verbatim: true
        lines:
          - 42
          - 49
  - id: el-dfn
    title: <dfn> HTML definition element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/dfn
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/dfn/index.md
    excerpts:
      - id: summary
        text: |-
          The **`<dfn>`** [HTML](/en-US/docs/Web/HTML) element indicates a term to be defined. The `<dfn>` element should be used in a complete definition statement, where the full definition of the term can be one of the following:

          - The ancestor paragraph (a block of text, sometimes marked by a {{HTMLElement("p")}} element)
          - The {{HTMLElement("dt")}}/{{HTMLElement("dd")}} pairing
          - The nearest [section](/en-US/docs/Web/HTML/Guides/Content_categories#sectioning_content) ancestor of the `<dfn>` element,
        verbatim: true
        lines:
          - 10
          - 14
  - id: el-small
    title: <small> HTML side comment element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/small
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/small/index.md
    excerpts:
      - id: summary
        text: The **`<small>`** [HTML](/en-US/docs/Web/HTML) element represents side-comments and small print, like copyright and legal text, independent of its styled presentation. By default, it renders text within it one font-size smaller, such as from `small` to `x-small`.
        verbatim: true
        lines:
          - 10
          - 10
  - id: el-s
    title: <s> HTML strikethrough element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/s
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/s/index.md
    excerpts:
      - id: summary
        text: The **`<s>`** [HTML](/en-US/docs/Web/HTML) element renders text with a strikethrough, or a line through it. Use the `<s>` element to represent things that are no longer relevant or no longer accurate. However, `<s>` is not appropriate when indicating document edits; for that, use the {{HTMLElement("del")}} and {{HTMLElement("ins")}} elements, as appropriate.
        verbatim: true
        lines:
          - 10
          - 10
  - id: el-abbr
    title: <abbr> HTML abbreviation element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/abbr
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/abbr/index.md
    excerpts:
      - id: expand-first
        text: When including an abbreviation or acronym, provide a full expansion of the term in plain text on first use, along with the `<abbr>` to mark up the abbreviation. This informs the user what the abbreviation or acronym means.
        verbatim: true
        lines:
          - 12
          - 12
      - id: title-only
        text: The optional [`title`](/en-US/docs/Web/HTML/Reference/Global_attributes/title) attribute can provide an expansion for the abbreviation or acronym when a full expansion is not present. This provides a hint to user agents on how to announce/display the content while informing all users what the abbreviation means. If present, `title` must contain this full description and nothing else.
        verbatim: true
        lines:
          - 14
          - 14
      - id: independent
        text: Each `<abbr>` element you use is independent of all others; providing a `title` for one does not automatically attach the same expansion text to others with the same content text.
        verbatim: true
        lines:
          - 38
          - 38
      - id: title-if-needed
        text: Only include a `title` if expanding the abbreviation or acronym in the text is not possible. Having a difference between the announced word or phrase and what is displayed on the screen, especially if it's technical jargon the reader may not be familiar with, can be jarring.
        verbatim: true
        lines:
          - 65
          - 65
  - id: el-time
    title: <time> HTML time (date) element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/time
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/time/index.md
    excerpts:
      - id: summary
        text: |-
          The **`<time>`** [HTML](/en-US/docs/Web/HTML) element represents a specific period in time. It may include the `datetime` attribute to translate dates into machine-readable format, allowing for better search engine results or custom features such as reminders.

          It may represent one of the following:

          - A time on a 24-hour clock.
          - A precise date in the [Gregorian calendar](https://en.wikipedia.org/wiki/Gregorian_calendar) (with optional time and timezone information).
          - [A valid time duration](https://html.spec.whatwg.org/multipage/common-microsyntaxes.html#valid-duration-string).
        verbatim: true
        lines:
          - 10
          - 16
      - id: datetime-value
        text: The _datetime value_ (the machine-readable value of the datetime) is the value of the element's `datetime` attribute, which must be in the proper format (see below). If the element does not have a `datetime` attribute, **it must not have any element descendants**, and the _datetime value_ is the element's child text content.
        verbatim: true
        lines:
          - 51
          - 51
  - id: el-blockquote
    title: <blockquote> HTML block quotation element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/blockquote
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/blockquote/index.md
    excerpts:
      - id: summary
        text: The **`<blockquote>`** [HTML](/en-US/docs/Web/HTML) element indicates that the enclosed text is an extended quotation. Usually, this is rendered visually by indentation (see [Notes](#usage_notes) for how to change it). A URL for the source of the quotation may be given using the `cite` attribute, while a text representation of the source can be given using the {{HTMLElement("cite")}} element.
        verbatim: true
        lines:
          - 10
          - 10
      - id: attribution-outside
        text: According to the specification, attribution for the quotation, if any, must be placed outside the `<blockquote>` element.
        verbatim: true
        lines:
          - 56
          - 56
  - id: el-cite
    title: <cite> HTML citation element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/cite
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
