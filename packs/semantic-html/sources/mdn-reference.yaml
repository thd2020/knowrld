  - id: el-html
    title: <html> HTML document root element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/html
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/html/index.md
    excerpts:
      - id: lang
        text: While HTML does not require authors to specify `<html>` element start and ending tags, it is important for authors to do so as it will allow them to specify the [`lang`](/en-US/docs/Web/HTML/Reference/Global_attributes/lang) for the webpage. Providing a `lang` attribute with a valid {{glossary("BCP 47 language tag")}} on the `<html>` element will help screen reading technology determine the proper language to announce. The identifying language tag should describe the language used by the majority of the content of the page. Without it, screen readers will typically default to the operating system's set language, which may cause mispronunciations.
        verbatim: true
        lines:
          - 23
          - 23
      - id: head-announced
        text: Including a valid `lang` declaration on the `<html>` element also ensures that important metadata contained in the page's {{HTMLElement("head")}}, such as the page's {{HTMLElement("title")}}, are also announced properly.
        verbatim: true
        lines:
          - 25
          - 25
