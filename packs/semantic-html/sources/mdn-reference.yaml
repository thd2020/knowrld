sources:
  - id: el-headings
    title: <h1>–<h6> HTML section heading elements
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/Heading_Elements
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/heading_elements/index.md
    excerpts:
      - id: usage
        text: |-
          - Heading information can be used by user agents to construct a table of contents for a document automatically.
          - Do not use heading elements to resize text. Instead, use the {{glossary("CSS")}} {{cssxref("font-size")}} property.
          - Do not skip heading levels: always start from `<h1>`, followed by `<h2>` and so on.
        verbatim: true
        lines:
          - 67
          - 69
      - id: single-h1
        text: While using multiple `<h1>` elements on one page is allowed by the HTML standard (as long as they are not [nested](#nesting)), this is not considered a best practice. A page should generally have a single `<h1>` element that describes the content of the page (similar to the document's [`<title>`](/en-US/docs/Web/HTML/Reference/Elements/title) element).
        verbatim: true
        lines:
          - 73
          - 73
      - id: skip-levels
        text: A common navigation technique for users of screen reading software is to quickly jump from heading to heading in order to determine the content of the page. Because of this, it is important to not skip one or more heading levels. Doing so may create confusion, as the person navigating this way may be left wondering where the missing heading is.
        verbatim: true
        lines:
          - 106
          - 106
      - id: headings-list
        text: Headings may be nested as subsections to reflect the organization of the content of the page. Most screen readers can also generate an ordered list of all the headings on a page, which can help a person quickly determine the content hierarchy and navigate to different headings.
        verbatim: true
        lines:
          - 126
          - 126
      - id: labeled-navs
        text: In this example, screen reading technology would announce that there are two {{HTMLElement("nav")}} sections, one called "Primary navigation" and one called "Footer navigation". If labels were not provided, the person using screen reading software may have to investigate each `nav` element's contents to determine their purpose.
        verbatim: true
        lines:
          - 215
          - 215
  - id: el-header
    title: <header> HTML header element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/header
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/header/index.md
    excerpts:
      - id: banner
        text: When not nested within [sectioning content](/en-US/docs/Web/HTML/Guides/Content_categories#sectioning_content), {{htmlelement("main")}}, or an element with the same ARIA role as these elements' implicit ARIA role, then the `<header>` element has an identical meaning to the site-wide [`banner`](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/banner_role) landmark role. It defines a global site header, which usually includes a logo, company name, search feature, and possibly the global navigation or a slogan. It is generally located at the top of the page.
        verbatim: true
        lines:
          - 57
          - 57
      - id: nested
        text: Otherwise, when nested within said elements, it loses its landmark status and represents a group of introductory or navigational aids for the surrounding section. It usually contains the surrounding section's heading (an `h1` – `h6` element) and optional subheading, but this is **not** required.
        verbatim: true
        lines:
          - 59
          - 59
  - id: el-footer
    title: <footer> HTML footer element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/footer
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/footer/index.md
    excerpts:
      - id: summary
        text: The **`<footer>`** [HTML](/en-US/docs/Web/HTML) element represents a footer for its nearest ancestor [sectioning content](/en-US/docs/Web/HTML/Guides/Content_categories#sectioning_content) or [sectioning root](/en-US/docs/Web/HTML/Reference/Elements/Heading_Elements#labeling_section_content) element. A `<footer>` typically contains information about the author of the section, copyright data or links to related documents.
        verbatim: true
        lines:
          - 10
          - 10
      - id: usage
        text: |-
          - Enclose information about the author in an {{HTMLElement("address")}} element that can be included into the `<footer>` element.
          - When the nearest ancestor sectioning content or sectioning root element is the body element the footer applies to the whole page.
          - The `<footer>` element is not sectioning content and therefore doesn't introduce a new section in the [outline](/en-US/docs/Web/HTML/Reference/Elements/Heading_Elements).
        verbatim: true
        lines:
          - 50
          - 52
  - id: el-main
    title: <main> HTML main element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/main
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/main/index.md
    excerpts:
      - id: only-one
        text: A document mustn't have more than one `<main>` element that doesn't have the [`hidden`](/en-US/docs/Web/HTML/Reference/Global_attributes/hidden) attribute specified.
        verbatim: true
        lines:
          - 44
          - 44
      - id: unique-content
        text: The content of a `<main>` element should be unique to the document. Content that is repeated across a set of documents or document sections such as sidebars, navigation links, copyright information, site logos, and search forms shouldn't be included unless the search form is the main function of the page.
        verbatim: true
        lines:
          - 46
          - 46
      - id: landmark
        text: The `<main>` element behaves like a [`main` landmark](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/main_role) role. [Landmarks](/en-US/docs/Web/Accessibility/ARIA/Guides/Techniques#landmark_roles) can be used by assistive technology to quickly identify and navigate to large sections of the document. Prefer using the `<main>` element over declaring `role="main"`, unless there are [legacy browser support concerns](#browser_compatibility).
        verbatim: true
        lines:
          - 54
          - 54
      - id: skip-target
        text: Adding an [`id`](/en-US/docs/Web/HTML/Reference/Global_attributes/id) attribute to the `<main>` element lets it be a target of a skip navigation link.
        verbatim: true
        lines:
          - 60
          - 60
  - id: el-nav
    title: <nav> HTML navigation section element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/nav
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/nav/index.md
    excerpts:
      - id: summary
        text: The **`<nav>`** [HTML](/en-US/docs/Web/HTML) element represents a section of a page whose purpose is to provide navigation links, either within the current document or to other documents. Common examples of navigation sections are menus, tables of contents, and indexes.
        verbatim: true
        lines:
          - 10
          - 10
      - id: usage
        text: |-
          - It's not necessary for all links to be contained in a `<nav>` element. `<nav>` is intended only for a major block of navigation links; typically the {{HTMLElement("footer")}} element often has a list of links that don't need to be in a `<nav>` element.
          - A document may have several `<nav>` elements, for example, one for site navigation and one for intra-page navigation. [`aria-labelledby`](/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-labelledby) can be used in such case to promote accessibility, see [example](/en-US/docs/Web/HTML/Reference/Elements/Heading_Elements#labeling_section_content).
        verbatim: true
        lines:
          - 60
          - 61
  - id: el-section
    title: <section> HTML generic section element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/section
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/section/index.md
    excerpts:
      - id: summary
        text: The **`<section>`** [HTML](/en-US/docs/Web/HTML) element represents a generic standalone section of a document, which doesn't have a more specific semantic element to represent it. Sections should always have a heading, with very few exceptions.
        verbatim: true
        lines:
          - 10
          - 10
      - id: alternatives
        text: |-
          - If the contents of the element represent a standalone, atomic unit of content that makes sense syndicated as a standalone piece (e.g., a blog post or blog comment, or a newspaper article), the {{HTMLElement("article")}} element would be a better choice.
          - If the contents represent useful tangential information that works alongside the main content, but is not directly part of it (like related links, or an author bio), use an {{HTMLElement("aside")}}.
          - If the contents represent the main content area of a document, use {{HTMLElement("main")}}.
          - If you are only using the element as a styling wrapper, use a {{HTMLElement("div")}} instead.
        verbatim: true
        lines:
          - 50
          - 53
  - id: el-article
    title: <article> HTML article contents element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/article
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/article/index.md
    excerpts:
      - id: usage
        text: |-
          - Each `<article>` should be identified, typically by including a heading ([`<h1>` - `<h6>`](/en-US/docs/Web/HTML/Reference/Elements/Heading_Elements) element) as a child of the `<article>` element.
          - When an `<article>` element is nested, the inner element represents an article related to the outer element. For example, the comments of a blog post can be `<article>` elements nested in the `<article>` representing the blog post.
          - Author information of an `<article>` element can be provided through the {{HTMLElement("address")}} element, but it doesn't apply to nested `<article>` elements.
          - The publication date and time of an `<article>` element can be described using the [`datetime`](/en-US/docs/Web/HTML/Reference/Elements/time#datetime) attribute of a {{HTMLElement("time")}} element.
        verbatim: true
        lines:
          - 66
          - 69
  - id: el-aside
    title: <aside> HTML aside element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/aside
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/aside/index.md
    excerpts:
      - id: usage
        text: |-
          - Do not use the `<aside>` element to tag parenthesized text, as this kind of text is considered part of the main flow.
          - The `<aside>` element has an implicit role of [`complementary`](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/complementary_role), unless it has no {{glossary("accessible name")}} and is nested in [sectioning content](/en-US/docs/Web/HTML/Guides/Content_categories#sectioning_content), in which case it has the [`generic`](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/generic_role) role.
        verbatim: true
        lines:
          - 54
          - 55
  - id: el-em
    title: <em> HTML emphasis element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/em
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/em/index.md
    excerpts:
      - id: i-vs-em
        text: By default, the visual result is the same. However, the semantic meaning is different. The `<em>` element represents stress emphasis of its contents, while the `<i>` element represents text that is set off from the normal prose, such as a foreign word, fictional character thoughts, or when the text refers to the definition of a word instead of representing its semantic meaning. (The title of a work, such as the name of a book or movie, should use `<cite>`.)
        verbatim: true
        lines:
          - 42
          - 42
      - id: neither-decorative
        text: This means the right one to use depends on the situation. Neither is for purely decorative purposes, that's what CSS styling is for.
        verbatim: true
        lines:
          - 44
          - 44
  - id: el-i
    title: <i> HTML idiomatic text element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/i
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/i/index.md
    excerpts:
      - id: uses
        text: |-
          - Use the `<i>` element for text that is set off from the normal prose for readability reasons. This would be a range of text with different semantic meaning than the surrounding text. Among the use cases for the `<i>` element are spans of text representing a different quality or mode of text, such as:
            - Alternative voice or mood
            - Taxonomic designations (such as the genus and species "_Homo sapiens_")
            - Idiomatic terms from another language (such as "_et cetera_"); these should include the [`lang`](/en-US/docs/Web/HTML/Reference/Global_attributes/lang) attribute to identify the language
            - Technical terms
            - Transliterations
            - Thoughts (such as "She wondered, _What is this writer talking about, anyway?_")
            - Ship or vessel names in Western writing systems (such as "They searched the docks for the _Empress of the Galaxy_, the ship to which they were assigned.")
        verbatim: true
        lines:
          - 40
          - 47
      - id: not-presentational
        text: '- In earlier versions of the HTML specification, the `<i>` element was merely a presentational element used to display text in italics, much like the `<b>` element was used to display text in bold letters. This is no longer true, as these tags now define semantics rather than typographic appearance. A browser will typically still display the contents of the `<i>` element in italic type, but is, by definition, no longer required to do so. To display text in italic type, authors should use the CSS {{cssxref("font-style")}} property.'
        verbatim: true
        lines:
          - 49
          - 49
  - id: el-strong
    title: <strong> HTML strong importance element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/strong
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/strong/index.md
    excerpts:
      - id: b-vs-strong
        text: Not exactly. The `<strong>` element is for content that is of greater importance, while the `<b>` element is used to draw attention to text without indicating that it's more important.
        verbatim: true
        lines:
          - 44
          - 44
      - id: meaning-decides
        text: The intended meaning or purpose of the enclosed text should be what determines which element you use. Communicating meaning is what semantics are all about.
        verbatim: true
        lines:
          - 48
          - 48
      - id: em-vs-strong
        text: While `<em>` is used to change the meaning of a sentence as spoken emphasis does ("I _love_ carrots" vs. "I love _carrots_"), `<strong>` is used to give portions of a sentence added importance (e.g., "**Warning!** This is **very dangerous.**") Both `<strong>` and `<em>` can be nested to increase the relative degree of importance or stress emphasis, respectively.
        verbatim: true
        lines:
          - 54
          - 54
  - id: el-b
    title: <b> HTML bring attention to element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/b
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/b/index.md
    excerpts:
      - id: uses
        text: |-
          - Use the `<b>` for cases like keywords in a summary, product names in a review, or other spans of text whose typical presentation would be boldfaced (but not including any special importance).
          - Do not confuse the `<b>` element with the {{HTMLElement("strong")}}, {{HTMLElement("em")}}, or {{HTMLElement("mark")}} elements. The {{HTMLElement("strong")}} element represents text of certain _importance_, {{HTMLElement("em")}} puts some emphasis on the text and the {{HTMLElement("mark")}} element represents text of certain _relevance_. The `<b>` element doesn't convey such special semantic information; use it only when no others fit.
          - Similarly, do not mark titles and headings using the `<b>` element. For this purpose, use the {{HTMLElement("Heading_Elements", "h1")}} to {{HTMLElement("Heading_Elements", "h6")}} tags. Further, stylesheets can change the default style of these elements, with the result that they are not _necessarily_ displayed in bold.
        verbatim: true
        lines:
          - 35
          - 37
  - id: el-u
    title: <u> HTML unarticulated annotation (underline) element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/u
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/u/index.md
    excerpts:
      - id: restored
        text: "Along with other pure styling elements, the original HTML Underline (`<u>`) element was deprecated in HTML 4; however, `<u>` was restored in HTML 5 with a new, semantic, meaning: to mark text as having some form of non-textual annotation applied."
        verbatim: true
        lines:
          - 44
          - 44
      - id: use-cases
        text: Valid use cases for the `<u>` element include annotating spelling errors, applying a [proper name mark](https://en.wikipedia.org/wiki/Proper_name_mark) to denote proper names in Chinese text, and other forms of annotation.
        verbatim: true
        lines:
          - 51
          - 51
      - id: not-for
        text: You should _not_ use `<u>` to underline text for presentation purposes, or to denote titles of books.
        verbatim: true
        lines:
          - 53
          - 53
  - id: el-abbr
    title: <abbr> HTML abbreviation element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/abbr
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/abbr/index.md
    excerpts:
      - id: expand-first
        text: When including an abbreviation or acronym, provide a full expansion of the term in plain text on first use, along with the `<abbr>` to mark up the abbreviation. This informs the user what the abbreviation or acronym means.
        verbatim: true
        lines:
          - 12
          - 12
      - id: title-only
        text: The optional [`title`](/en-US/docs/Web/HTML/Reference/Global_attributes/title) attribute can provide an expansion for the abbreviation or acronym when a full expansion is not present. This provides a hint to user agents on how to announce/display the content while informing all users what the abbreviation means. If present, `title` must contain this full description and nothing else.
        verbatim: true
        lines:
          - 14
          - 14
      - id: independent
        text: Each `<abbr>` element you use is independent of all others; providing a `title` for one does not automatically attach the same expansion text to others with the same content text.
        verbatim: true
        lines:
          - 38
          - 38
      - id: title-if-needed
        text: Only include a `title` if expanding the abbreviation or acronym in the text is not possible. Having a difference between the announced word or phrase and what is displayed on the screen, especially if it's technical jargon the reader may not be familiar with, can be jarring.
        verbatim: true
        lines:
          - 65
          - 65
  - id: el-time
    title: <time> HTML time (date) element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/time
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/time/index.md
    excerpts:
      - id: summary
        text: The **`<time>`** [HTML](/en-US/docs/Web/HTML) element represents a specific period in time. It may include the `datetime` attribute to translate dates into machine-readable format, allowing for better search engine results or custom features such as reminders.
        verbatim: true
        lines:
          - 10
          - 10
      - id: represents
        text: |-
          It may represent one of the following:

          - A time on a 24-hour clock.
          - A precise date in the [Gregorian calendar](https://en.wikipedia.org/wiki/Gregorian_calendar) (with optional time and timezone information).
          - [A valid time duration](https://html.spec.whatwg.org/multipage/common-microsyntaxes.html#valid-duration-string).
        verbatim: true
        lines:
          - 12
          - 16
      - id: datetime-value
        text: The _datetime value_ (the machine-readable value of the datetime) is the value of the element's `datetime` attribute, which must be in the proper format (see below). If the element does not have a `datetime` attribute, **it must not have any element descendants**, and the _datetime value_ is the element's child text content.
        verbatim: true
        lines:
          - 51
          - 51
  - id: el-blockquote
    title: <blockquote> HTML block quotation element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/blockquote
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/blockquote/index.md
    excerpts:
      - id: summary
        text: The **`<blockquote>`** [HTML](/en-US/docs/Web/HTML) element indicates that the enclosed text is an extended quotation. Usually, this is rendered visually by indentation (see [Notes](#usage_notes) for how to change it). A URL for the source of the quotation may be given using the `cite` attribute, while a text representation of the source can be given using the {{HTMLElement("cite")}} element.
        verbatim: true
        lines:
          - 10
          - 10
      - id: attribution-outside
        text: According to the specification, attribution for the quotation, if any, must be placed outside the `<blockquote>` element.
        verbatim: true
        lines:
          - 56
          - 56
  - id: el-cite
    title: <cite> HTML citation element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/cite
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/cite/index.md
    excerpts:
      - id: summary
        text: The **`<cite>`** [HTML](/en-US/docs/Web/HTML) element is used to mark up the title of a creative work. The reference may be in an abbreviated form according to context-appropriate conventions related to citation metadata.
        verbatim: true
        lines:
          - 10
          - 10
      - id: source-attribute
        text: To include a reference to the source of quoted material which is contained within a {{HTMLElement("blockquote")}} or {{HTMLElement("q")}} element, use the [`cite`](/en-US/docs/Web/HTML/Reference/Elements/blockquote#cite) attribute on the element.
        verbatim: true
        lines:
          - 75
          - 75
  - id: el-address
    title: <address> HTML contact address element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/address
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/address/index.md
    excerpts:
      - id: content
        text: The contact information provided by an `<address>` element's contents can take whatever form is appropriate for the context, and may include any type of contact information that is needed, such as a physical address, URL, email address, phone number, social media handle, geographic coordinates, and so forth. The `<address>` element should include the name of the person, people, or organization to which the contact information refers.
        verbatim: true
        lines:
          - 33
          - 33
      - id: usage
        text: |-
          - The `<address>` element can only be used to represent the contact information for its nearest {{HTMLElement("article")}} or {{HTMLElement("body")}} element ancestor.
          - This element should not contain more information than the contact information, like a publication date (which belongs in a {{HTMLElement("time")}} element).
          - Typically an `<address>` element can be placed inside the {{HTMLElement("footer")}} element of the current section, if any.
        verbatim: true
        lines:
          - 43
          - 45
  - id: el-ol
    title: <ol> HTML ordered list element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/ol
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/ol/index.md
    excerpts:
      - id: nest
        text: The `<ol>` and {{HTMLElement("ul")}} (or the synonym {{HTMLElement("menu")}}) elements may nest as deeply as desired, alternating between `<ol>`, `<ul>` (or `<menu>`) as needed.
        verbatim: true
        lines:
          - 60
          - 60
      - id: order-test
        text: To determine which list to use, try changing the order of the list items; if the meaning changes, use the `<ol>` element — otherwise you can use {{HTMLElement("ul")}} otherwise, or {{HTMLElement("menu")}} if your list is a menu.
        verbatim: true
        lines:
          - 68
          - 68
  - id: el-li
    title: <li> HTML list item element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/li
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/li/index.md
    excerpts:
      - id: parent
        text: 'The **`<li>`** [HTML](/en-US/docs/Web/HTML) element is used to represent an item in a list. It must be contained in a parent element: an ordered list ({{HTMLElement("ol")}}), an unordered list ({{HTMLElement("ul")}}), or a menu ({{HTMLElement("menu")}}). In menus and unordered lists, list items are usually displayed using bullet points. In ordered lists, they are usually displayed with an ascending counter on the left, such as a number or letter.'
        verbatim: true
        lines:
          - 10
          - 10
  - id: el-dt
    title: <dt> HTML description term element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/dt
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/dt/index.md
    excerpts:
      - id: several-terms
        text: The **`<dt>`** [HTML](/en-US/docs/Web/HTML) element specifies a term in a description or definition list, and as such must be used inside a {{HTMLElement("dl")}} element. It is usually followed by a {{HTMLElement("dd")}} element; however, multiple `<dt>` elements in a row indicate several terms that are all defined by the immediate next {{HTMLElement("dd")}} element.
        verbatim: true
        lines:
          - 10
          - 10
  - id: el-br
    title: <br> HTML line break element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/br
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/br/index.md
    excerpts:
      - id: not-margins
        text: "> Do not use `<br>` to create margins between paragraphs; wrap them in {{htmlelement(\"p\")}} elements and use the [CSS](/en-US/docs/Web/CSS) {{cssxref('margin')}} property to control their size."
        verbatim: true
        lines:
          - 38
          - 38
      - id: screen-readers
        text: Creating separate paragraphs of text using `<br>` is not only bad practice, it is problematic for people who navigate with the aid of screen reading technology. Screen readers may announce the presence of the element, but not any content contained within `<br>`s. This can be a confusing and frustrating experience for the person using the screen reader.
        verbatim: true
        lines:
          - 57
          - 57
  - id: el-hr
    title: <hr> HTML thematic break (horizontal rule) element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/hr
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/hr/index.md
    excerpts:
      - id: summary
        text: "The **`<hr>`** [HTML](/en-US/docs/Web/HTML) element represents a thematic break between elements: for example, a change of scene in a story, or a shift of topic within a section."
        verbatim: true
        lines:
          - 10
          - 10
      - id: semantic
        text: Historically, the `<hr>` element has always been presented as a horizontal rule or line. While it may still be displayed as a horizontal rule in visual browsers, this element is now defined in semantic terms, rather than presentational terms. Therefore, if you wish to draw a horizontal line, you should do so by adding a border to an existing element using CSS.
        verbatim: true
        lines:
          - 41
          - 41
  - id: el-title
    title: <title> HTML document title element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/title
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/title/index.md
    excerpts:
      - id: text-only
        text: The **`<title>`** [HTML](/en-US/docs/Web/HTML) element defines the document's title that is shown in a {{glossary("Browser", "browser")}}'s title bar or a page's tab. It only contains text; HTML tags within the element, if any, are also treated as plain text.
        verbatim: true
        lines:
          - 10
          - 10
      - id: seo
        text: The contents of a page title can have significant implications for search engine optimization ({{glossary("SEO")}}). In general, a longer, descriptive title performs better than short or generic titles. The content of the title is one of the components used by search engine algorithms to decide the order in which to list pages in search results. Also, the title is the initial "hook" by which you grab the attention of readers glancing at the search results page.
        verbatim: true
        lines:
          - 26
          - 26
      - id: unique
        text: "- Try to make sure your titles are as unique as possible within your own site. Duplicate—or near-duplicate—titles can contribute to inaccurate search results."
        verbatim: true
        lines:
          - 33
          - 33
      - id: assistive
        text: A common navigation technique for users of assistive technology is to read the page title and infer the content the page contains. This is because navigating into a page to determine its content can be a time-consuming and potentially confusing process. Titles should be unique to every page of a website, ideally surfacing the primary purpose of the page first, followed by the name of the website. Following this pattern will help ensure that the primary purpose of the page is announced by a screen reader first. This provides a far better experience than having to listen to the name of a website before the unique page title, for every page a user navigates to in the same website.
        verbatim: true
        lines:
          - 39
          - 39
  - id: el-html
    title: <html> HTML document root element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/html
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/html/index.md
    excerpts:
      - id: lang
        text: While HTML does not require authors to specify `<html>` element start and ending tags, it is important for authors to do so as it will allow them to specify the [`lang`](/en-US/docs/Web/HTML/Reference/Global_attributes/lang) for the webpage. Providing a `lang` attribute with a valid {{glossary("BCP 47 language tag")}} on the `<html>` element will help screen reading technology determine the proper language to announce. The identifying language tag should describe the language used by the majority of the content of the page. Without it, screen readers will typically default to the operating system's set language, which may cause mispronunciations.
        verbatim: true
        lines:
          - 23
          - 23
      - id: head-announced
        text: Including a valid `lang` declaration on the `<html>` element also ensures that important metadata contained in the page's {{HTMLElement("head")}}, such as the page's {{HTMLElement("title")}}, are also announced properly.
        verbatim: true
        lines:
          - 25
          - 25
  - id: attr-lang
    title: lang HTML global attribute
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes/lang
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/global_attributes/lang/index.md
    excerpts:
      - id: summary
        text: 'The **`lang`** [global attribute](/en-US/docs/Web/HTML/Reference/Global_attributes) helps define the language of an element: the language that non-editable elements are written in, or the language that the editable elements should be written in by the user. The attribute contains a single {{glossary("BCP 47 language tag")}}.'
        verbatim: true
        lines:
          - 10
          - 10
      - id: wcag-parts
        text: WCAG Success Criterion 3.1.2 requires that pages with **parts** in different languages have the languages of those parts specified too. Again, the **`lang`** attribute is the correct mechanism for this.
        verbatim: true
        lines:
          - 55
          - 55
  - id: el-pre
    title: <pre> HTML preformatted text element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/pre
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/pre/index.md
    excerpts:
      - id: whitespace
        text: Whitespace inside this element is displayed as written, with one exception. If one or more leading newline characters are included immediately following the opening `<pre>` tag, the _first_ newline character is stripped. This transformation is done by the HTML parser and does not apply when using {{Glossary("XHTML")}}.
        verbatim: true
        lines:
          - 12
          - 12
      - id: escape
        text: "`<pre>` elements' text content is parsed as HTML, so if you want to ensure that your text content stays as plain text, some syntax characters, such as `<`, may need to be escaped using their respective {{glossary(\"character reference\", \"character references\")}}. See [escaping ambiguous characters](#escaping_ambiguous_characters) for more information."
        verbatim: true
        lines:
          - 14
          - 14
      - id: contains
        text: '`<pre>` elements commonly contain {{HTMLElement("code")}}, {{HTMLElement("samp")}}, and {{HTMLElement("kbd")}} elements, to represent computer code, computer output, and user input, respectively.'
        verbatim: true
        lines:
          - 16
          - 16
  - id: el-code
    title: <code> HTML inline code element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/code
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/code/index.md
    excerpts:
      - id: summary
        text: The **`<code>`** [HTML](/en-US/docs/Web/HTML) element displays its contents styled in a fashion intended to indicate that the text is a short fragment of computer code. By default, the content text is displayed using the {{Glossary("user agent", "user agent's")}} default monospace font.
        verbatim: true
        lines:
          - 10
          - 10
  - id: el-kbd
    title: <kbd> HTML keyboard input element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/kbd
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/kbd/index.md
    excerpts:
      - id: nesting
        text: |-
          - Nesting a `<kbd>` element within another `<kbd>` element represents an actual key or other unit of input as a portion of a larger input. See [Representing keystrokes within an input](#representing_keystrokes_within_an_input) below.
          - Nesting a `<kbd>` element inside a {{HTMLElement("samp")}} element represents input that has been echoed back to the user by the system. See [Echoed input](#echoed_input), below, for an example.
          - Nesting a `<samp>` element inside a `<kbd>` element, on the other hand, represents input which is based on text presented by the system, such as the names of menus and menu items, or the names of buttons displayed on the screen. See the example under [Representing onscreen input options](#representing_onscreen_input_options) below.
        verbatim: true
        lines:
          - 49
          - 51
  - id: el-sup
    title: <sup> HTML superscript element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/sup
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/sup/index.md
    excerpts:
      - id: summary
        text: The **`<sup>`** [HTML](/en-US/docs/Web/HTML) element specifies inline text which is to be displayed as superscript for solely typographical reasons. Superscripts are usually rendered with a raised baseline using smaller text.
        verbatim: true
        lines:
          - 10
          - 10
      - id: typographical
        text: The `<sup>` element should only be used for typographical reasons—that is, to change the position of the text to comply with typographical conventions or standards, rather than solely for presentation or appearance purposes.
        verbatim: true
        lines:
          - 38
          - 38
      - id: wordmark
        text: 'For example, to style the [wordmark](https://en.wikipedia.org/wiki/Wordmark) of a business or product which uses a raised baseline should be done using CSS (most likely {{cssxref("vertical-align")}}) rather than `<sup>`. This would be done using, for example, `vertical-align: super` or, to shift the baseline up 50%, `vertical-align: 50%`.'
        verbatim: true
        lines:
          - 40
          - 40
      - id: uses
        text: |-
          - Displaying exponents, such as "x<sup>3</sup>". It may be worth considering the use of [MathML](/en-US/docs/Web/MathML) for these, especially in more complex cases. See [Exponents](#exponents) under [Examples](#examples) below.
          - Displaying [superior lettering](https://en.wikipedia.org/wiki/Superior_letter), which is used in some languages when rendering certain abbreviations. For example, in French, the word "mademoiselle" can be abbreviated "M<sup>lle</sup>"; this is an acceptable use case. See [Superior lettering](#superior_lettering) for examples.
          - Representing ordinal numbers, such as "4<sup>th</sup>" instead of "fourth." See [Ordinal numbers](#ordinal_numbers) for examples.
        verbatim: true
        lines:
          - 44
          - 46
  - id: el-sub
    title: <sub> HTML subscript element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/sub
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/sub/index.md
    excerpts:
      - id: summary
        text: The **`<sub>`** [HTML](/en-US/docs/Web/HTML) element specifies inline text which should be displayed as subscript for solely typographical reasons. Subscripts are typically rendered with a lowered baseline using smaller text.
        verbatim: true
        lines:
          - 10
          - 10
      - id: uses
        text: |-
          - Marking up footnote numbers. See [Footnote numbers](#footnote_numbers) for an example.
          - Marking up the subscript in mathematical variable numbers (although you may also consider using a [MathML](/en-US/docs/Web/MathML) formula for this). See [Variable subscripts](#variable_subscripts).
          - Denoting the number of atoms of a given element within a chemical formula (such as every developer's best friend, C<sub>8</sub>H<sub>10</sub>N<sub>4</sub>O<sub>2</sub>, otherwise known as "caffeine"). See [Chemical formulas](#chemical_formulas).
        verbatim: true
        lines:
          - 42
          - 44
  - id: el-meta
    title: <meta> HTML metadata element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/meta/index.md
    excerpts:
      - id: summary
        text: The **`<meta>`** [HTML](/en-US/docs/Web/HTML) element represents {{Glossary("Metadata","metadata")}} that cannot be represented by other meta-related elements, such as {{HTMLElement("base")}}, {{HTMLElement("link")}}, {{HTMLElement("script")}}, {{HTMLElement("style")}}, or {{HTMLElement("title")}}.
        verbatim: true
        lines:
          - 10
          - 10
      - id: kinds
        text: |-
          - If the [`name`](/en-US/docs/Web/HTML/Reference/Elements/meta/name) attribute is set, the `<meta>` element provides _document-level metadata_ that applies to the whole page.
          - If the [`http-equiv`](/en-US/docs/Web/HTML/Reference/Elements/meta/http-equiv) attribute is set, the `<meta>` element acts as a _pragma directive_ to simulate directives that could otherwise be given by an HTTP header.
          - If the [`charset`](#charset) attribute is set, the `<meta>` element is a _charset declaration_, giving the character encoding in which the document is encoded.
          - If the [`itemprop`](/en-US/docs/Web/HTML/Reference/Global_attributes/itemprop) attribute is set, the `<meta>` element provides _user-defined metadata_.
        verbatim: true
        lines:
          - 14
          - 17
