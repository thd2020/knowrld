    excerpts:
      - id: whitespace
        text: Whitespace inside this element is displayed as written, with one exception. If one or more leading newline characters are included immediately following the opening `<pre>` tag, the _first_ newline character is stripped. This transformation is done by the HTML parser and does not apply when using {{Glossary("XHTML")}}.
        verbatim: true
