      - id: escape
        text: "`<pre>` elements' text content is parsed as HTML, so if you want to ensure that your text content stays as plain text, some syntax characters, such as `<`, may need to be escaped using their respective {{glossary(\"character reference\", \"character references\")}}. See [escaping ambiguous characters](#escaping_ambiguous_characters) for more information."
        verbatim: true
        lines:
