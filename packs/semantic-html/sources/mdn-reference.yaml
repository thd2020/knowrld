          - 10
      - id: wcag-parts
        text: WCAG Success Criterion 3.1.2 requires that pages with **parts** in different languages have the languages of those parts specified too. Again, the **`lang`** attribute is the correct mechanism for this.
        verbatim: true
        lines:
          - 55
          - 55
