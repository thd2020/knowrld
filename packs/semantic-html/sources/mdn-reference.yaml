  - id: el-dl
    title: <dl> HTML description list element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/dl
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/dl/index.md
    excerpts:
      - id: div-groups
        text: |-
          ### Wrapping name-value groups in `div` elements

          HTML allows wrapping each name-value group in a `<dl>` element in a {{HTMLElement("div")}} element. This can be useful when using [microdata](/en-US/docs/Web/HTML/Guides/Microdata), or when [global attributes](/en-US/docs/Web/HTML/Reference/Global_attributes) apply to a whole group, or for styling purposes.

          ```html
          <dl>
            <div>
              <dt>Name</dt>
              <dd>Godzilla</dd>
            </div>
            <div>
              <dt>Born</dt>
              <dd>1952</dd>
            </div>
            <div>
              <dt>Birthplace</dt>
              <dd>Japan</dd>
            </div>
            <div>
              <dt>Color</dt>
              <dd>Green</dd>
            </div>
          </dl>
          ```
        verbatim: true
        lines:
          - 155
          - 178
  - id: el-br
