    excerpts:
      - id: summary
        text: The **`<cite>`** [HTML](/en-US/docs/Web/HTML) element is used to mark up the title of a creative work. The reference may be in an abbreviated form according to context-appropriate conventions related to citation metadata.
        verbatim: true
        lines:
          - 10
          - 10
      - id: source-attribute
        text: To include a reference to the source of quoted material which is contained within a {{HTMLElement("blockquote")}} or {{HTMLElement("q")}} element, use the [`cite`](/en-US/docs/Web/HTML/Reference/Elements/blockquote#cite) attribute on the element.
        verbatim: true
        lines:
          - 75
          - 75
  - id: el-address
    title: <address> HTML contact address element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/address
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/address/index.md
    excerpts:
      - id: usage
        text: |-
          - The `<address>` element can only be used to represent the contact information for its nearest {{HTMLElement("article")}} or {{HTMLElement("body")}} element ancestor.
          - This element should not contain more information than the contact information, like a publication date (which belongs in a {{HTMLElement("time")}} element).
          - Typically an `<address>` element can be placed inside the {{HTMLElement("footer")}} element of the current section, if any.
        verbatim: true
        lines:
          - 43
          - 45
  - id: el-ol
    title: <ol> HTML ordered list element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/ol
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/ol/index.md
    excerpts:
      - id: reversed-start
        text: |-
          - `reversed`
            - : This Boolean attribute specifies that the list's items are in reverse order. Items will be numbered from high to low.
          - `start`
            - : An integer to start counting from for the list items. Always an Arabic numeral (1, 2, 3, etc.), even when the numbering `type` is letters or Roman numerals. For example, to start numbering elements from the letter "d" or the Roman numeral "iv," use `start="4"`.
        verbatim: true
        lines:
          - 39
          - 42
      - id: type
        text: |-
          - `type`
            - : Sets the numbering type:
              - `a` for lowercase letters
              - `A` for uppercase letters
              - `i` for lowercase Roman numerals
              - `I` for uppercase Roman numerals
              - `1` for numbers (default)

              The specified type is used for the entire list unless a different [`type`](/en-US/docs/Web/HTML/Reference/Elements/li#type) attribute is used on an enclosed {{HTMLElement("li")}} element.

              > [!NOTE]
              > Unless the type of the list number matters (like legal or technical documents where items are referenced by their number/letter), use the CSS {{CSSxRef("list-style-type")}} property instead.
        verbatim: true
        lines:
          - 43
          - 54
      - id: nest
        text: The `<ol>` and {{HTMLElement("ul")}} (or the synonym {{HTMLElement("menu")}}) elements may nest as deeply as desired, alternating between `<ol>`, `<ul>` (or `<menu>`) as needed.
        verbatim: true
        lines:
          - 60
          - 60
      - id: order-test
        text: |-
          The `<ol>` and {{HTMLElement("ul")}} elements both represent a list of items. The difference is with the `<ol>` element, the order is meaningful. For example:

          - Steps in a recipe
          - Turn-by-turn directions
          - The list of ingredients in decreasing proportion on nutrition information labels

          To determine which list to use, try changing the order of the list items; if the meaning changes, use the `<ol>` element — otherwise you can use {{HTMLElement("ul")}} otherwise, or {{HTMLElement("menu")}} if your list is a menu.
        verbatim: true
        lines:
          - 62
          - 68
  - id: el-li
    title: <li> HTML list item element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/li
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/li/index.md
    excerpts:
      - id: parent
        text: 'The **`<li>`** [HTML](/en-US/docs/Web/HTML) element is used to represent an item in a list. It must be contained in a parent element: an ordered list ({{HTMLElement("ol")}}), an unordered list ({{HTMLElement("ul")}}), or a menu ({{HTMLElement("menu")}}). In menus and unordered lists, list items are usually displayed using bullet points. In ordered lists, they are usually displayed with an ascending counter on the left, such as a number or letter.'
        verbatim: true
        lines:
          - 10
          - 10
      - id: value
        text: |-
          - `value`
            - : This integer attribute indicates the current ordinal value of the list item as defined by the {{HTMLElement("ol")}} element. The only allowed value for this attribute is a number, even if the list is displayed with Roman numerals or letters. List items that follow this one continue numbering from the value set. This attribute has no meaning for unordered lists ({{HTMLElement("ul")}}) or for menus ({{HTMLElement("menu")}}).
        verbatim: true
        lines:
          - 43
          - 44
  - id: el-dt
    title: <dt> HTML description term element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/dt
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
