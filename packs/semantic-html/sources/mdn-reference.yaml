    excerpts:
      - id: not-margins
        text: |-
          > [!NOTE]
          > Do not use `<br>` to create margins between paragraphs; wrap them in {{htmlelement("p")}} elements and use the [CSS](/en-US/docs/Web/CSS) {{cssxref('margin')}} property to control their size.
        verbatim: true
        lines:
