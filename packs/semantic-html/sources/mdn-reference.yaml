    excerpts:
      - id: disabled
        text: |-
          - [`disabled`](/en-US/docs/Web/HTML/Reference/Attributes/disabled)
            - : If this Boolean attribute is set, all form controls that are descendants of the `<fieldset>`, are disabled, meaning they are not editable and won't be submitted along with the {{htmlelement("form")}}. They won't receive any browsing events, like mouse clicks or focus-related events. By default browsers display such controls grayed out. Note that form elements inside the {{HTMLElement("legend")}} element won't be disabled.
        verbatim: true
        lines:
          - 49
          - 50
  - id: css-disabled
    title: :disabled CSS pseudo-class
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Selectors/:disabled
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/css/reference/selectors/_colon_disabled/index.md
    excerpts:
      - id: summary
        text: The **`:disabled`** [CSS](/en-US/docs/Web/CSS) [pseudo-class](/en-US/docs/Web/CSS/Reference/Selectors/Pseudo-classes) represents any disabled element. An element is disabled if it can't be activated (selected, clicked on, typed into, etc.) or accept focus. The element also has an enabled state, in which it can be activated or accept focus.
        verbatim: true
        lines:
