      - id: text-node-value
        text: '- If the node is a [CDATA section](/en-US/docs/Web/API/CDATASection), a comment, a [processing instruction](/en-US/docs/Web/API/ProcessingInstruction), or a [text node](/en-US/docs/Web/API/Text), `textContent` returns, or sets, the text inside the node, i.e., the {{domxref("Node.nodeValue")}}.'
