  - id: role-button
    title: "ARIA: button role"
    url: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/button_role
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/accessibility/aria/reference/roles/button_role/index.md
    excerpts:
      - id: name
        text: Buttons should always have an accessible name. For most buttons, this name will be the same as the text inside the button, between the opening and closing tags. In some cases, for example buttons represented by icons, the accessible name may be provided from the [`aria-label`](/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-label) or [`aria-labelledby`](/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-labelledby) attributes.
        verbatim: true
        lines:
          - 70
          - 70
      - id: native-keys
        text: |-
          | Key              | Function              |
          | ---------------- | --------------------- |
          | <kbd>Enter</kbd> | Activates the button. |
          | <kbd>Space</kbd> | Activates the button  |
        verbatim: true
        lines:
          - 85
          - 88
      - id: keyboard
        text: |-
          #### Required event handlers

          Buttons can be operated by mouse, touch, and keyboard users. For native HTML `<button>` elements, the button's `onclick` event fires for mouse clicks and when the user presses <kbd>Space</kbd> or <kbd>Enter</kbd> while the button has focus. But if another tag is used to create a button, the `onclick` event only fires when clicked by the mouse cursor, even if `role="button"` is used. Because of this, separate key event handlers must be added to the element so that the button is be triggered when the <kbd>Space</kbd> or <kbd>Enter</kbd> key is pressed.

          - `onclick`
            - : Handles the event raised when the button is activated using a mouse click or touch event.
          - `onKeyDown`
            - : Handles the event raised when the button is activated using the Enter or Space key on the keyboard. (Note not the [deprecated onKeyPress](/en-US/docs/Web/API/Element/keypress_event))
        verbatim: true
        lines:
          - 94
          - 101
      - id: anchor-keys
        text: '> Be careful when marking up links with the button role. Buttons are expected to be triggered using the <kbd>Space</kbd> or <kbd>Enter</kbd> key, while links are expected to be triggered using the <kbd>Enter</kbd> key. In other words, when links are used to behave like buttons, adding `role="button"` alone is not sufficient. It will also be necessary to add a key event handler that listens for the <kbd>Space</kbd> key in order to be consistent with native buttons.'
        verbatim: true
        lines:
          - 268
          - 268
  - id: attr-tabindex
    title: tabindex HTML global attribute
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes/tabindex
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/global_attributes/tabindex/index.md
    excerpts:
      - id: focusability
        text: |-
          > [!NOTE]
          > If an HTML element renders and has `tabindex` attribute with any valid integer value, the element can be focused with JavaScript (by calling the [`focus()`](/en-US/docs/Web/API/HTMLElement/focus) method) or visually by clicking with the mouse. The particular `tabindex` value controls whether the element is `tabbable` (i.e., reachable via sequential keyboard navigation, usually with the <kbd>Tab</kbd> key).

          - A _negative value_ (the exact negative value doesn't actually matter, usually `tabindex="-1"`) means that the element is not reachable via sequential keyboard navigation.
        verbatim: true
        lines:
          - 46
          - 49
      - id: recommended
        text: |2-
            > [!WARNING]
            > You are recommended to only use `0` and `-1` as `tabindex` values. Avoid using `tabindex` values greater than `0` and CSS properties that can change the order of focusable HTML elements ([Ordering flex items](/en-US/docs/Web/CSS/Guides/Flexible_box_layout/Ordering_items)). Doing so makes it difficult for people who rely on using keyboard for navigation or assistive technology to navigate and operate page content. Instead, write the document with the elements in a logical sequence.
        verbatim: true
        lines:
          - 58
          - 59
  - id: role-presentation
    title: "ARIA: presentation role"
    url: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/presentation_role
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/accessibility/aria/reference/roles/presentation_role/index.md
    excerpts:
      - id: focus-exception
        text: The {{HTMLElement('a')}} is a special case. Its role would have been exposed even if it had the `presentation` or `none` role directly applied to it. Browsers ignore `role="presentation"` and `role="none"` on focusable elements, including link and inputs, or anything with a [tabindex](/en-US/docs/Web/HTML/Reference/Global_attributes/tabindex) attribute set. Browsers also ignore the inclusion of the role if any of the element contains any global ARIA states and properties, such as [`aria-describedby`](/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-describedby).
        verbatim: true
        lines:
          - 40
          - 40
      - id: aria-exception
        text: None. If a global ARIA state and property is set, `presentation` or `none` will be ignored, and the implicit role of the element will be used.
        verbatim: true
        lines:
          - 47
          - 47
