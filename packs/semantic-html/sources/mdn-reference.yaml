  - id: css-whitespace
    title: Handling whitespace
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Text/Whitespace
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/css/guides/text/whitespace/index.md
    excerpts:
      - id: dom-preservation
        text: 'It is a common myth that "HTML ignores whitespace", which is untrue: **HTML preserves all whitespace text content as you wrote them in the source code.** As a markup language, HTML produces a {{glossary("DOM")}} where all whitespace in the text content is preserved, which can be retrieved and manipulated via DOM APIs such as {{domxref("Node.textContent")}}. If HTML strips whitespace from the DOM, then CSS, a downstream rendering engine that works on the DOM, would not be able to preserve them using the {{cssxref("white-space")}} property.'
        verbatim: true
        lines:
          - 20
          - 20
      - id: default-display
        text: When the DOM is passed to CSS for rendering, the whitespace is largely stripped by default. This means that the way your code is formatted is not visible to the end user—creating space around and inside elements is the job of CSS.
        verbatim: true
        lines:
          - 62
          - 62
      - id: collapse-setting
        text: "> This algorithm can be configured via the {{cssxref(\"white-space-collapse\")}} property (or its shorthand property {{cssxref(\"white-space\")}}). We'll start by assuming its default value (`white-space-collapse: collapse`), then look at how different property values affect this algorithm."
        verbatim: true
        lines:
          - 109
          - 109
      - id: collapse-summary
        text: |-
          In a nutshell, different whitespace characters are collapsed and transformed in the following fashion:

          - Tabs are generally converted to spaces.
          - If segment breaks are to be collapsed:
            - Sequences of segment breaks are collapsed to a single segment break.
            - They are converted to spaces in languages that separate words with spaces (like English), or removed altogether in languages that do not separate words with spaces (like Chinese).
          - If spaces are to be collapsed:
            - Spaces or tabs before or after segment breaks are removed.
            - Sequences of spaces are collapsed to a single space.
        verbatim: true
        lines:
          - 163
          - 171
  - id: el-script
    title: <script> HTML script element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/script/index.md
    excerpts:
      - id: defer-scope
        text: |-
          - `defer`
            - : This Boolean attribute is set to indicate to a browser that the script is meant to be executed after the document has been parsed, but before firing {{domxref("Document/DOMContentLoaded_event", "DOMContentLoaded")}} event.

              Scripts with the `defer` attribute will prevent the `DOMContentLoaded` event from firing until the script has loaded and finished evaluating.

              > [!WARNING]
              > This attribute must not be used if the `src` attribute is absent (i.e., for inline scripts), in this case it would have no effect.
              >
              > The `defer` attribute has no effect on [module scripts](/en-US/docs/Web/JavaScript/Guide/Modules) — they defer by default.

              Scripts with the `defer` attribute will execute in the order in which they appear in the document.

              This attribute allows the elimination of **parser-blocking JavaScript** where the browser would have to load and evaluate scripts before continuing to parse. `async` has a similar effect in this case.

              If the attribute is specified with the `async` attribute, the element will act as if only the `async` attribute is specified.
        verbatim: true
        lines:
          - 64
          - 78
      - id: type-classic
        text: |-
          - [`type`](/en-US/docs/Web/HTML/Reference/Elements/script/type)
            - : This attribute indicates the type of script represented.
              The value of this attribute will be one of the following:
              - **Attribute is not set (default), an empty string, or a JavaScript MIME type**
                - : Indicates that the script is a "classic script", containing JavaScript code.
                  Authors are encouraged to omit the attribute if the script refers to JavaScript code rather than specify a MIME type.
                  JavaScript MIME types are [listed in the IANA media types specification](/en-US/docs/Web/HTTP/Guides/MIME_types#textjavascript).
        verbatim: true
        lines:
          - 112
          - 118
      - id: data-block
        text: |2-
              - **Any other value**
                - : The embedded content is treated as a data block, and won't be processed by the browser.
                  Developers must use a valid MIME type that is not a JavaScript MIME type to denote data blocks.
                  All of the other attributes will be ignored, including the `src` attribute.
        verbatim: true
        lines:
          - 131
          - 134
      - id: parallel-download
        text: "- `async` and `defer` both instruct the browser to download the script(s) in a separate thread, while the rest of the page (the DOM, etc.) is downloading, so the page loading is not blocked during the fetch process."
        verbatim: true
        lines:
          - 211
          - 211
  - id: dom-content-loaded
    title: "Document: DOMContentLoaded event"
    url: https://developer.mozilla.org/en-US/docs/Web/API/Document/DOMContentLoaded_event
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/api/document/domcontentloaded_event/index.md
    excerpts:
      - id: resource-boundary
        text: |-
          The **`DOMContentLoaded`** event fires when the HTML document has been completely parsed, and all deferred scripts ([`<script defer src="…">`](/en-US/docs/Web/HTML/Reference/Elements/script#defer) and [`<script type="module">`](/en-US/docs/Web/HTML/Reference/Elements/script#module)) have downloaded and executed. It doesn't wait for other things like images, subframes, and async scripts to finish loading.

          `DOMContentLoaded` does not wait for stylesheets to load, however deferred scripts _do_ wait for stylesheets, and the `DOMContentLoaded` event is queued after deferred scripts. Also, scripts which aren't deferred or async (e.g., `<script>`) will wait for already-parsed stylesheets to load.
        verbatim: true
        lines:
          - 11
          - 13
  - id: el-base
    title: <base> HTML document base URL element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/base
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/base/index.md
    excerpts:
      - id: document-base
        text: |-
          The **`<base>`** [HTML](/en-US/docs/Web/HTML) element specifies the base URL to use for all _relative_ URLs in a document. There can be only one `<base>` element in a document.

          A document's used base URL can be accessed by scripts with {{domxref('Node.baseURI')}}. If the document has no `<base>` elements, then `baseURI` defaults to {{domxref("location.href")}}.
        verbatim: true
        lines:
          - 10
          - 12
      - id: default-target
        text: |2-
            - : A **keyword** or **author-defined name** of the default {{Glossary("browsing context")}} to show the results of navigation from {{HTMLElement("a")}}, {{HTMLElement("area")}}, or {{HTMLElement("form")}} elements without explicit `target` attributes. The following keywords have special meanings:
              - `_self` (default): Show the result in the current browsing context.
              - `_blank`: Show the result in a new, unnamed browsing context.
              - `_parent`: Show the result in the parent browsing context of the current one, if the current page is inside a frame. If there is no parent, acts the same as `_self`.
              - `_top`: Show the result in the topmost browsing context (the browsing context that is an ancestor of the current one and has no parent). If there is no parent, acts the same as `_self`.
        verbatim: true
        lines:
          - 27
          - 31
      - id: fragment-resolution
        text: |-
          Links pointing to a fragment in the document — e.g., `<a href="#some-id">` — are resolved with the `<base>`, triggering an HTTP request to the base URL with the fragment attached.

          For example, given `<base href="https://example.com/">` and this link: `<a href="#anchor">To anchor</a>`. The link points to `https://example.com/#anchor`.
        verbatim: true
        lines:
          - 41
          - 43
  - id: attr-title
    title: title HTML global attribute
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes/title
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/global_attributes/title/index.md
    excerpts:
      - id: accessibility-support
        text: |-
          Use of the `title` attribute is highly problematic for:

          - People using touch-only devices
          - People navigating with keyboards
          - People navigating with assistive technology such as screen readers or magnifiers
          - People experiencing fine motor control impairment
          - People with cognitive concerns

          This is due to inconsistent browser support, compounded by the additional assistive technology parsing of the browser-rendered page. If a tooltip effect is desired, it is better to [use a more accessible technique](https://inclusive-components.design/tooltips-toggletips/) that can be accessed with the above browsing methods.
        verbatim: true
        lines:
          - 101
          - 109
  - id: wcag-color-contrast
    title: Color contrast
    url: https://developer.mozilla.org/en-US/docs/Web/Accessibility/Guides/Understanding_WCAG/Perceivable/Color_contrast
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/accessibility/guides/understanding_wcag/perceivable/color_contrast/index.md
    excerpts:
      - id: normal-large
        text: |-
          - [1.4.3 Minimum contrast (AA)](https://w3c.github.io/wcag/guidelines/22/#contrast-minimum)
            - : The color contrast between background and foreground content should be at a minimum level to ensure legibility:
              - Text and its background should have a contrast ratio of at least 4.5:1.
              - Heading (or just larger) text should have a ratio of at least 3:1. Larger text is defined as at least 18pt, or 14pt bold.
        verbatim: true
        lines:
          - 117
          - 120
  - id: el-img
    title: <img> HTML image embed element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/img
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/img/index.md
    excerpts:
      - id: summary
