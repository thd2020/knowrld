  - id: role-generic
    title: "ARIA: generic role"
    url: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/generic_role
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/accessibility/aria/reference/roles/generic_role/index.md
    excerpts:
      - id: summary
        text: The `generic` role creates a nameless container element which has no semantic meaning on its own.
        verbatim: true
        lines:
          - 10
          - 10
      - id: mapping
        text: While ARIA is primarily used to express semantics, there are some elements that shouldn't expose a semantic name to assistive technologies. The `generic` role indicates an element's role is equivalent to that of the non-semantic {{HTMLElement('div')}} and {{HTMLElement('span')}} elements.
        verbatim: true
