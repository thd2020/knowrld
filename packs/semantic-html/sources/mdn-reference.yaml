  - id: el-meta
    title: <meta> HTML metadata element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/meta/index.md
    excerpts:
      - id: summary
        text: The **`<meta>`** [HTML](/en-US/docs/Web/HTML) element represents {{Glossary("Metadata","metadata")}} that cannot be represented by other meta-related elements, such as {{HTMLElement("base")}}, {{HTMLElement("link")}}, {{HTMLElement("script")}}, {{HTMLElement("style")}}, or {{HTMLElement("title")}}.
        verbatim: true
        lines:
          - 10
          - 10
      - id: kinds
        text: |-
          The type of metadata provided by the `<meta>` element can be one of the following:

          - If the [`name`](/en-US/docs/Web/HTML/Reference/Elements/meta/name) attribute is set, the `<meta>` element provides _document-level metadata_ that applies to the whole page.
          - If the [`http-equiv`](/en-US/docs/Web/HTML/Reference/Elements/meta/http-equiv) attribute is set, the `<meta>` element acts as a _pragma directive_ to simulate directives that could otherwise be given by an HTTP header.
          - If the [`charset`](#charset) attribute is set, the `<meta>` element is a _charset declaration_, giving the character encoding in which the document is encoded.
          - If the [`itemprop`](/en-US/docs/Web/HTML/Reference/Global_attributes/itemprop) attribute is set, the `<meta>` element provides _user-defined metadata_.
        verbatim: true
        lines:
          - 12
          - 17
      - id: charset
        text: |-
          - `charset`
            - : This attribute declares the document's character encoding. If the attribute is present, its value must be an ASCII case-insensitive match for the string `"utf-8"`, because UTF-8 is the only valid encoding for HTML5 documents. `<meta>` elements which declare a character encoding must be located entirely within the first 1024 bytes of the document.
        verbatim: true
        lines:
          - 27
          - 28
  - id: meta-viewport
    title: <meta name="viewport"> HTML attribute value
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta/name/viewport
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/meta/name/viewport/index.md
    excerpts:
      - id: summary
        text: |-
          The **`viewport`** value for the [`name`](/en-US/docs/Web/HTML/Reference/Elements/meta/name) attribute of a {{htmlelement("meta")}} element gives hints about how the {{glossary("viewport")}} should be sized.

          If specified, you define viewport-related behaviors using a [`content`](/en-US/docs/Web/HTML/Reference/Elements/meta#content) attribute in the `<meta>` element as a comma-separated list of one or more values.
        verbatim: true
        lines:
          - 10
          - 12
      - id: narrow-screens
        text: Some mobile devices and other narrow screens render pages in a virtual window or viewport that is wider than the screen, and then shrink the rendered result down to fit the screen size. Users can then zoom and pan to look more closely at different areas of the page. For example, if a mobile screen has a width of 640px, pages might be rendered with a virtual viewport of 980px, and then it will be shrunk down to fit into the 640px space. This is done because not all pages are optimized for mobile and break (or at least look bad) when rendered at a small viewport width. This virtual viewport is a way to make non-mobile-optimized sites in general look better on narrow screen devices. However, this mechanism is not so good for pages that are optimized for narrow screens using [media queries](/en-US/docs/Web/CSS/Guides/Media_queries) — if the virtual viewport is 980px for example, media queries that kick in at 640px or 480px or less will never be used, limiting the effectiveness of such responsive design techniques. The viewport `<meta>` element mitigates this problem of virtual viewport on narrow screen devices.
        verbatim: true
        lines:
          - 68
          - 68
      - id: recommended
        text: |-
          The recommended setting is the following, which sets the viewport to match the device's width:

          ```html
          <meta name="viewport" content="width=device-width" />
          ```

          > [!NOTE]
          > This example omits `initial-scale=1`, a common practice that's usually unnecessary. When it is omitted, the browser determines the initial zoom level automatically and may zoom out when content overflows the viewport. The amount of scaling is browser-dependent and may depend on both the content's width and height. Add `initial-scale=1` if overflowing content causes unwanted shrinking and you want the page to start at 100% zoom instead; however, you should usually avoid overflowing content horizontally.
        verbatim: true
        lines:
          - 70
          - 77
      - id: no-zoom
        text: |2-
                  > [!WARNING]
                  > Disabling zooming capabilities by setting `user-scalable` to a value of `no` prevents people experiencing low vision conditions from being able to read and understand page content. Additionally, WCAG requires a minimum of 2× scaling; however, the best practice is to enable a 5× zoom. For more information, see:
                  >
                  > - [MDN Understanding WCAG, Guideline 1.4 explanations](/en-US/docs/Web/Accessibility/Guides/Understanding_WCAG/Perceivable#guideline_1.4_make_it_easier_for_users_to_see_and_hear_content_including_separating_foreground_from_background)
                  > - [Understanding Success Criterion 1.4.4 | W3C Understanding WCAG 2.0](https://www.w3.org/TR/UNDERSTANDING-WCAG20/visual-audio-contrast-scale.html)
        verbatim: true
        lines:
          - 42
          - 46
  - id: el-a
    title: <a> HTML anchor element
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/a
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/html/reference/elements/a/index.md
    excerpts:
      - id: download-filename
        text: |-
          - `download`
            - : Causes the browser to treat the linked URL as a download. Can be used with or without a `filename` value:
              - Without a value, the browser will suggest a filename/extension, generated from various sources:
                - The {{HTTPHeader("Content-Disposition")}} HTTP header
                - The final segment in the URL [path](/en-US/docs/Web/API/URL/pathname)
                - The {{Glossary("MIME_type", "media type")}} (from the {{HTTPHeader("Content-Type")}} header, the start of a [`data:` URL](/en-US/docs/Web/URI/Reference/Schemes/data), or {{domxref("Blob.type")}} for a [`blob:` URL](/en-US/docs/Web/URI/Reference/Schemes/blob))

              - `filename`: defining a value suggests it as the filename. `/` and `\` characters are converted to underscores (`_`). Filesystems may forbid other characters in filenames, so browsers will adjust the suggested name if necessary.
        verbatim: true
        lines:
          - 57
          - 64
      - id: download-limits
        text: |2-
              > [!NOTE]
              >
              > - `download` only works for [same-origin URLs](/en-US/docs/Web/Security/Defenses/Same-origin_policy), or the `blob:` and `data:` schemes.
              > - How browsers treat downloads varies by browser, user settings, and other factors. The user may be prompted before a download starts, or the file may be saved automatically, or it may open automatically, either in an external application or in the browser itself.
        verbatim: true
        lines:
          - 66
          - 69
      - id: download-headers
        text: |2-
              > - If the `Content-Disposition` header has different information from the `download` attribute, resulting behavior may differ:
              >   - If the header specifies a `filename`, it takes priority over a filename specified in the `download` attribute.
              >   - If the header specifies a disposition of `inline`, Chrome and Firefox prioritize the attribute and treat it as a download. Old Firefox versions (before 82) prioritize the header and will display the content inline.
        verbatim: true
        lines:
          - 70
          - 72
      - id: target
        text: |-
          - `target`
            - : Where to display the linked URL, as the name for a _browsing context_ (a tab, window, or {{HTMLElement("iframe")}}). The following keywords have special meanings for where to load the URL:
              - `_self`: The current browsing context. (Default)
              - `_blank`: Usually a new tab, but users can configure browsers to open a new window instead.
              - `_parent`: The parent browsing context of the current one. If no parent, behaves as `_self`.
              - `_top`: The topmost browsing context. To be specific, this means the "highest" context that's an ancestor of the current one. If no ancestors, behaves as `_self`.
        verbatim: true
        lines:
          - 106
          - 111
      - id: target-noopener
        text: |2-
              > [!NOTE]
              > Setting `target="_blank"` on `<a>` elements implicitly provides the same `rel` behavior as setting [`rel="noopener"`](/en-US/docs/Web/HTML/Reference/Attributes/rel/noopener) which does not set `window.opener`.
        verbatim: true
        lines:
          - 114
          - 115
      - id: empty-fragment
        text: '> You can use `href="#top"` or the empty fragment (`href="#"`) to link to the top of the current page, [as defined in the HTML specification](https://html.spec.whatwg.org/multipage/browsing-the-web.html#scroll-to-the-fragment-identifier).'
        verbatim: true
        lines:
          - 351
          - 351
      - id: relative-url-example
        text: |-
          ```html
          <a href="//example.com">Scheme-relative URL</a>
          <a href="/en-US/docs/Web/HTML">Origin-relative URL</a>
          <a href="p">Directory-relative URL</a>
          <a href="./p">Directory-relative URL</a>
          <a href="../p">Parent-directory-relative URL</a>
          ```
        verbatim: true
        lines:
          - 317
          - 323
      - id: skip-link
        text: |-
          A **skip link** is a link placed as early as possible in {{HTMLElement("body")}} content that points to the beginning of the page's main content. Usually, CSS hides a skip link offscreen until focused.

          ```html
          <body>
            <a href="#content" class="skip-link">Skip to main content</a>

            <header>…</header>

            <!-- The skip link jumps to here -->
            <main id="content"></main>
          </body>
          ```
        verbatim: true
        lines:
          - 242
          - 253
      - id: tel
        text: |-
          ### Linking to telephone numbers

          ```html
          <a href="tel:+49.157.0156">+49 157 0156</a>
          <a href="tel:+1(800)555-0123">(800) 555-0123</a>
          ```

          #### Result

          {{EmbedLiveSample('Linking to telephone numbers')}}

          `tel:` link behavior varies with device capabilities:

          - Cellular devices autodial the number.
          - Most operating systems have programs that can make calls, like Skype or FaceTime.
          - Websites can make phone calls with {{domxref("Navigator/registerProtocolHandler", "registerProtocolHandler")}}, such as `web.skype.com`.
          - Other behaviors include saving the number to contacts, or sending the number to another device.
        verbatim: true
        lines:
          - 367
          - 383
  - id: attr-aria-current
    title: "ARIA: aria-current attribute"
    url: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-current
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/accessibility/aria/reference/attributes/aria-current/index.md
    excerpts:
      - id: styled-current
        text: |-
          When you have a group of related elements, such as several links in a breadcrumb or steps in a multi-step flow, with one element in the group styled differently from the others to indicate to the sighted user that this is the current element within its group, the `aria-current` should be used to inform the assistive technology user what has been indicated via styling.

          In a breadcrumb list, when a link within a set of pagination links is styled to indicate the user is currently on that page, `aria-current="page"` should be set on that link. In a multi step based process with a step indicator such as a multi-page survey or a multi step checkout or registration process, when the current step icon is visually different to represent that it is the current step, that icon's container should have `aria-current="step"` for assistive technology users who may not be able to "see" the visual difference.
        verbatim: true
        lines:
          - 14
          - 16
  - id: role-landmark
    title: "ARIA: landmark role"
    url: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/landmark_role
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-29
    raw: https://raw.githubusercontent.com/mdn/content/dd70ed064388b0fac4338321f727c8840a508b64/files/en-us/web/accessibility/aria/reference/roles/landmark_role/index.md
    excerpts:
      - id: description
        text: A `landmark` is an abstract role for a section of content that is important enough that users will likely want to be able to navigate to the section easily and have it included in a dynamically generated summary of the page. Landmarks allow assistive technologies to navigate and to find content quickly.
        verbatim: true
        lines:
          - 17
          - 17
      - id: html-elements
        text: |-
          Every concrete landmark role has its corresponding HTML semantic element:

          | ARIA Role                                                                                | HTML Element               |
          | ---------------------------------------------------------------------------------------- | -------------------------- |
          | [`banner`](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/banner_role)               | {{HTMLElement('header')}}  |
          | [`complementary`](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/complementary_role) | {{HTMLElement('aside')}}   |
          | [`contentinfo`](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/contentinfo_role)     | {{HTMLElement('footer')}}  |
          | [`form`](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/form_role)                   | {{HTMLElement('form')}}    |
          | [`main`](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/main_role)                   | {{HTMLElement('main')}}    |
          | [`navigation`](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/navigation_role)       | {{HTMLElement('nav')}}     |
          | [`region`](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/region_role)               | {{HTMLElement('section')}} |
          | [`search`](/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/search_role)               | {{HTMLElement('search')}}  |
