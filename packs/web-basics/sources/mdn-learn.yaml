          - 184
      - id: cross-axis
        text: "- The **cross axis** is the axis running perpendicular to the direction the flex items are laid out in. The start and end points of this axis are called the **cross start** and **cross end**. The length of a flex item along the cross axis is the **cross size**."
        verbatim: true
        lines:
