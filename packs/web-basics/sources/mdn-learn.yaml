      - id: main-axis
        text: "- The **main axis** is the axis running in the direction the flex items are laid out in (for example, as a row across the page, or a column down the page.) The start and end points of this axis are called the **main start** and **main end**. The length of a flex item along the main axis is the **main size**."
        verbatim: true
        lines:
