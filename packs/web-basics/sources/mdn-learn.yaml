  - id: headings
    title: Headings and paragraphs
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Headings_and_paragraphs
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-28
    raw: https://raw.githubusercontent.com/mdn/content/e1250f3487ad2d64e06cca58660ddc95b9a2d65c/files/en-us/learn_web_development/core/structuring_content/headings_and_paragraphs/index.md
    excerpts:
      - id: six
        text: 'There are six heading elements: {{htmlelement("Heading_Elements", "h1")}}, {{htmlelement("Heading_Elements", "h2")}}, {{htmlelement("Heading_Elements", "h3")}}, {{htmlelement("Heading_Elements", "h4")}}, {{htmlelement("Heading_Elements", "h5")}}, and {{htmlelement("Heading_Elements", "h6")}}. Each element represents a different level of content in the document; `<h1>` represents the main heading, `<h2>` represents subheadings, `<h3>` represents sub-subheadings, and so on.'
        verbatim: true
        lines:
          - 58
          - 58
      - id: three
        text: "- Of the six heading levels available, you should aim to use no more than three per page, unless you feel it is necessary. Documents with many levels (for example, a deep heading hierarchy) become unwieldy and difficult to navigate. On such occasions, it is advisable to spread the content over multiple pages if possible."
        verbatim: true
        lines:
          - 91
          - 91
      - id: semantics
        text: In a similar way, we need to make sure we are using the correct elements, giving our content the correct meaning, function, or appearance. In this context, the `{{htmlelement("Heading_Elements", "&lt;h1>")}}` element is also a semantic element, which gives the text it wraps around the role (or meaning) of "a top level heading on your page."
        verbatim: true
        lines:
          - 151
          - 151
  - id: structuring-documents
    title: Structuring documents
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Structuring_documents
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-28
    raw: https://raw.githubusercontent.com/mdn/content/e1250f3487ad2d64e06cca58660ddc95b9a2d65c/files/en-us/learn_web_development/core/structuring_content/structuring_documents/index.md
    excerpts:
      - id: functionality
        text: In your HTML code, you can mark up sections of content based on their _functionality_ — you can use elements that represent the sections of content described above unambiguously, and assistive technologies like screen readers can recognize those elements and help with tasks like "find the main navigation", or "find the main content." As we mentioned earlier in the course, there are a number of [consequences of not using the right element structure and semantics for the right job](/en-US/docs/Learn_web_development/Core/Structuring_content/Headings_and_paragraphs#why_do_we_need_structure).
        verbatim: true
        lines:
          - 70
          - 70
      - id: nav
        text: |-
          - navigation bar:
            - : Links to the site's main sections; usually represented by menu buttons, links, or tabs. Like the header, this content usually remains consistent from one webpage to another — having inconsistent navigation on your website will just lead to confused, frustrated users. Many web designers consider the navigation bar to be part of the header rather than an individual component, but that's not a requirement; in fact, some also argue that having the two separate is better for [accessibility](/en-US/docs/Learn_web_development/Core/Accessibility), as screen readers can read the two features better if they are separate.
        verbatim: true
        lines:
          - 45
          - 46
      - id: main
        text: |-
          - main content:
            - : A big area in the center that contains most of the unique content of a given webpage, for example, the video you want to watch, or the main story you're reading, or the map you want to view, or the news headlines, etc. This is the one part of the website that definitely will vary from page to page!
        verbatim: true
        lines:
          - 47
          - 48
  - id: lists
    title: Lists
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Lists
