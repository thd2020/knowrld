sources:
  - id: basic-html-syntax
    title: Basic HTML syntax
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Basic_HTML_syntax
    publisher: MDN contributors
    license: CC-BY-SA-2.5+
    retrieved: 2026-09-28
    raw: https://raw.githubusercontent.com/mdn/content/e1250f3487ad2d64e06cca58660ddc95b9a2d65c/files/en-us/learn_web_development/core/structuring_content/basic_html_syntax/index.md
    excerpts:
      - id: what-is-html
        text: '{{glossary("HTML")}} (HyperText Markup Language) is a _markup language_ that tells web browsers how to structure the web pages you visit. HTML consists of a series of {{glossary("Element", "elements")}}, which you use to enclose, wrap, or _mark up_ different parts of content to make it appear or act in a certain way. The enclosing {{glossary("Tag", "tags")}} can make content into a hyperlink to link to another page, italicize words, and so on. For example, consider the following line of text:'
        verbatim: true
        lines:
          - 37
          - 37
      - id: opening-tag
        text: "- **The opening tag:** This consists of the name of the element (in this example, _p_ for paragraph), wrapped in opening and closing angle brackets. This opening tag marks where the element begins or starts to take effect. In this example, it precedes the start of the paragraph text."
        verbatim: true
        lines:
          - 70
          - 70
      - id: content
        text: '- **The content:** This is the content of the element. In this example, it is the paragraph text — "My cat is very grumpy".'
        verbatim: true
        lines:
          - 71
          - 71
      - id: closing-tag
        text: "- **The closing tag:** This is the same as the opening tag, except that it includes a forward slash before the element name. This marks where the element ends. Failing to include a closing tag is a common beginner error that can produce peculiar results."
        verbatim: true
        lines:
          - 72
          - 72
      - id: void
        text: Not all elements follow the pattern of an opening tag, content, then a closing tag. Some elements consist of a single tag, which is typically used to insert/embed something in the document. Such elements are called {{glossary("void element", "void elements")}}, which means "elements that cannot contain other HTML content".
        verbatim: true
        lines:
          - 126
          - 126
      - id: attributes
        text: Attributes contain extra information about the element that isn't part of its content. The **`class`** attribute provides an identifying name that can be used to target the element with styles (CSS) or scripting information (JavaScript).
        verbatim: true
        lines:
          - 149
          - 149
      - id: doctype
        text: In modern times, the doctype is a historical artifact that needs to be included for everything else to work correctly. `<!doctype html>` is the shortest string of characters that counts as a valid doctype, and it should be included at the top of all webpages. That is all you need to know!
        verbatim: true
        lines:
          - 315
          - 315
      - id: html-root
        text: '2. `<html></html>`: The {{htmlelement("html")}} element. This element wraps all the content on the page. It is sometimes known as the root element.'
        verbatim: true
        lines:
          - 317
          - 317
      - id: head
        text: "3. `<head></head>`: The {{htmlelement(\"head\")}} element. This element acts as a container for information about the page that _isn't_ part of the content that users will see. This can include keywords and a page description to be shown in search results, CSS to style content, character set declarations, and more. You will learn more about the head of the page in the next article."
        verbatim: true
        lines:
          - 318
          - 318
      - id: charset
        text: '4. `<meta charset="utf-8">`: A {{htmlelement("meta")}} element. This element represents metadata that describes the page. The [`charset`](/en-US/docs/Web/HTML/Reference/Elements/meta#charset) attribute specifies the character encoding your document will use. UTF-8 includes most characters from the vast majority of human written languages, which means the page will be able to display different languages successfully. There is no reason not to set this, and it can help avoid some problems later.'
        verbatim: true
        lines:
          - 319
          - 319
      - id: title
        text: '5. `<title></title>`: The {{htmlelement("title")}} element. This sets the title of the page, which is the title that appears in the browser tab the page is loaded in. The page title is also used to describe the page when it is bookmarked.'
        verbatim: true
        lines:
          - 320
          - 320
      - id: body
        text: '6. `<body></body>`: The {{htmlelement("body")}} element. This contains _all_ the content that displays on the page, including text, images, videos, games, playable audio tracks, and so on.'
        verbatim: true
        lines:
          - 321
          - 321
  - id: webpage-metadata
    title: What's in the head? Web page metadata
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Webpage_metadata
